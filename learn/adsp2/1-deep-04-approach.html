ld\">분석 과제 도출</div><b class=\"lane-label\">TOP-DOWN · 하향식</b></div><div class=\"approach-lane\"><div class=\"vbox mild\">원천 데이터·관찰</div><div class=\"downarr\">↓</div><div class=\"vbox\">패턴·숨은 관계 발견</div><div class=\"downarr\">↓</div><div class=\"vbox strong\">새로운 문제·가치 정의</div><b class=\"lane-label teal\">BOTTOM-UP · 상향식</b></div></div><h4 class=\"figure-title\">분석 대상(What) × 분석 방법(How): 4가지 유형</h4><div class=\"matrix-label\">열: 분석 대상 What</div><div class=\"matrix2\"><div class=\"matrix-cell heading\"></div><div class=\"matrix-cell heading\">Known · 알고 있음</div><div class=\"matrix-cell heading\">Unknown · 모름</div><div class=\"matrix-cell heading\">How: Known</div><div class=\"matrix-cell\"><b>Optimization</b><small>최적화</small></div><div class=\"matrix-cell\"><b>Insight</b><small>통찰</small></div><div class=\"matrix-cell heading\">How: Unknown</div><div class=\"matrix-cell\"><b>Solution</b><small>솔루션 탐색</small></div><div class=\"matrix-cell\"><b>Discovery</b><small>발견</small></div></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">왜 함께 사용할까요?</div><div class=\"ib-body\">상향식으로 새로운 문제 후보를 <strong>발견</strong>한 뒤, 하향식으로 목표와 해법을 구체화하는 방식이 가능합니다.</div></div><div class=\"info-box soft\"><div class=\"ib-title\">시험에서 자주 헷갈리는 표현</div><div class=\"ib-body\"><strong>대상이 명확할 때 → 보통 하향식</strong>. 대상이 불명확하고 데이터에서 과제를 찾을 때 → 보통 상향식. 단, 네 칸의 분석 유형과 두 접근법을 기계적으로 1:1 대응시키지 않습니다.</div></div>","keywords":[{"term":"Top-Down Approach","meaning":"하향식·문제 출발"},{"term":"Bottom-Up Approach","meaning":"상향식·데이터 출발"},{"term":"Optimization / Insight","meaning":"최적화 / 통찰"},{"term":"Solution / Discovery","meaning":"솔루션 / 발견"}],"comic":[{"emoji":"📣","title":"문제 제기","dialog":"“고객 이탈을 줄여!”","reason":"문제가 먼저 정해졌습니다."},{"emoji":"🧭","title":"하향식","dialog":"“이탈 원인을 분석해 보자.”","reason":"정해진 목표에 맞춰 분석합니다."},{"emoji":"📊","title":"데이터 관찰","dialog":"“갑자기 늘어난 패턴이 있네?”","reason":"문제부터 정하지 않고 탐색합니다."},{"emoji":"💡","title":"상향식","dialog":"“새로운 과제를 발견했어!”","reason":"데이터에서 질문이 나옵니다."}],"script":"하향식은 시험문제를 먼저 받고 답을 찾는 방식, 상향식은 여러 자료를 살펴보다 연구할 문제를 발견하는 방식입니다. 두 방식은 경쟁 관계가 아니라 서로 보완합니다.","takeaway":"문제 → 해법 = 하향식 / 데이터 → 문제 = 상향식","tag":"이론"},{"cat":"하향식","title":"하향식의 4단계 흐름","page":"125","lead":"하향식 분석은 ① 문제 탐색 → ② 문제 정의 → ③ 해결방안 탐색 → ④ 타당성 검토 순서로 진행됩니다.","visual":"<div class=\"flow-steps\"><div class=\"flow-step\"><small>01</small><b>문제 탐색</b><span>Problem Discovery</span></div><div class=\"flow-arrow\">→</div><div class=\"flow-step\"><small>02</small><b>문제 정의</b><span>Problem Definition</span></div><div class=\"flow-arrow\">→</div><div class=\"flow-step\"><small>03</small><b>해결방안 탐색</b><span>Solution Search</span></div><div class=\"flow-arrow\">→</div><div class=\"flow-step\"><small>04</small><b>타당성 검토</b><span>Feasibility Study</span></div></div><div class=\"work-example\"><div class=\"example-label\">수업용 가상 사례 · 관광기업</div><div class=\"work-chain\"><span>예약 취소율 급증</span><span>→</span><span>취소 가능성 예측</span><span>→</span><span>고객 행동모형 개발</span><span>→</span><span>비용·데이터·역량 검토</span></div></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">단계의 구분</div><div class=\"ib-body\"><strong>문제 탐색:</strong> 어떤 문제인가? <strong>문제 정의:</strong> 분석 문제로 어떻게 표현할까? <strong>해결방안 탐색:</strong> 어떤 도구·인력을 쓰나? <strong>타당성 검토:</strong> 추진할 가치와 가능성이 충분한가?</div></div>","keywords":[{"term":"Discovery","meaning":"문제를 찾아냄"},{"term":"Definition","meaning":"분석 언어로 정확히 정의"},{"term":"Solution Search","meaning":"해결 방안을 비교"},{"term":"Feasibility","meaning":"비용과 기술의 실행 가능성"}],"comic":[{"emoji":"🚨","title":"이상 신호","dialog":"“예약 취소가 늘었어!”","reason":"문제 탐색"},{"emoji":"📝","title":"질문 바꾸기","dialog":"“누가 취소할지 예측할까?”","reason":"문제 정의"},{"emoji":"🛠️","title":"해법 후보","dialog":"“기존 시스템으로 가능할까?”","reason":"해결방안 탐색"},{"emoji":"⚖️","title":"추진 결정","dialog":"“비용과 데이터는 충분할까?”","reason":"타당성 검토"}],"script":"네 단계를 소리 내어 외우기보다는 여행 예약 취소 문제를 예로 들어 흐름으로 이해해 보세요. 특히 문제 탐색과 문제 정의는 다릅니다.","takeaway":"시험 암기: 탐색 → 정의 → 해결방안 → 타당성","tag":"이론"},{"cat":"하향식","title":"문제 탐색: 비즈니스 모델로 빠짐없이 찾기","page":"126–127","lead":"비즈니스 모델 캔버스(Business Model Canvas)의 9블록을 참고하여, 과제 발굴에서는 업무·제품·고객에 규제·인프라를 더한 5영역을 검토합니다.","visual":"<div class=\"bmc\"><div class=\"bmc-small\"><b>핵심 파트너</b><small>Key Partners</small></div><div class=\"bmc-small\"><b>핵심 활동</b><small>Key Activities</small><hr><b>핵심 자원</b><small>Key Resources</small></div><div class=\"bmc-small bmc-main\"><b>가치 제안</b><small>Value Propositions</small></div><div class=\"bmc-small\"><b>고객 관계</b><small>Customer Relationships</small><hr><b>채널</b><small>Channels</small></div><div class=\"bmc-small\"><b>고객 세분화</b><small>Customer Segments</small></div><div class=\"bmc-bottom\"><b>비용 구조</b><small>Cost Structure</small></div><div class=\"bmc-bottom\"><b>수익원</b><small>Revenue Streams</small></div></div><div class=\"caption-figure\">비즈니스 모델 캔버스 9블록 · 수업용 구조화</div><div class=\"five-domain\"><span>업무 Operation</span><span>제품 Product</span><span>고객 Customer</span><span>규제·감사 Regulation & Audit</span><span>IT·인적자원 IT & HR</span></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">과제 발굴 5영역의 예</div><div class=\"ib-body\"><strong>업무:</strong> 처리시간 단축 · <strong>제품:</strong> 기능 개선 · <strong>고객:</strong> 대기시간 감소 · <strong>규제·감사:</strong> 보안·규제 이상 탐지 · <strong>지원 인프라:</strong> 시스템·운영인력 최적화</div></div><div class=\"info-box soft\"><div class=\"ib-title\">중요한 구분</div><div class=\"ib-body\"><strong>캔버스 자체 9블록</strong>과 교재의 <strong>분석 기회 탐색 5영역</strong>은 서로 다른 분류입니다. 「혁신」은 비즈니스 모델 캔버스의 독립 블록이 아닙니다.</div></div>","keywords":[{"term":"Business Model Canvas","meaning":"기업이 어떻게 가치를 만들고 전달하는지 구조화한 9블록 틀"},{"term":"Operation / Product / Customer","meaning":"업무·제품·고객 관점"},{"term":"Regulation & Audit / IT & HR","meaning":"규제·감사 / 지원 인프라"}],"comic":[{"emoji":"🏨","title":"고객 불편","dialog":"“체크인이 너무 느려요.”","reason":"고객 관점에서 문제를 찾습니다."},{"emoji":"⚙️","title":"업무 점검","dialog":"“직원 업무가 겹치네?”","reason":"운영 프로세스를 살핍니다."},{"emoji":"🛡️","title":"보안 점검","dialog":"“고객 정보 관리도 중요해.”","reason":"규제·감사를 확인합니다."},{"emoji":"📑","title":"과제 후보","dialog":"“대기시간 예측을 해보자.”","reason":"분석할 주제를 도출합니다."}],"script":"캔버스는 사업의 전체 지도를 펼치는 도구입니다. 한 분야에만 집중하면 중요한 분석 기회를 놓칠 수 있습니다. 그래서 업무, 제품, 고객뿐 아니라 규제와 인프라도 살핍니다.","takeaway":"BMC는 9블록 / 과제 탐색 관점은 교재의 5영역","tag":"이론"},{"cat":"하향식","title":"분석 기회 범위를 넓히는 4가지 관점","page":"127–129","lead":"지금 하는 일만 보지 않고 외부 변화, 경쟁자, 시장의 니즈, 활용 가능한 역량까지 확대하여 문제 후보를 발굴합니다.","visual":"<div class=\"horizon-grid\"><div class=\"horizon\"><span>🌏</span><b>거시적 관점</b><small>STEEP · 사회·기술·경제·환경·정치</small></div><div class=\"horizon\"><span>♟️</span><b>경쟁자 확대</b><small>대체재 · 직접 경쟁자 · 신규 진입자</small></div><div class=\"horizon\"><span>🗣️</span><b>시장 니즈</b><small>고객 · 채널 · 영향자</small></div><div class=\"horizon\"><span>🧩</span><b>역량의 재해석</b><small>내부 역량 · 파트너/네트워크</small></div></div><div class=\"wide-note\">현재 시장과 역량에만 머무르면 <b>새로운 유형의 분석 기회</b>를 놓칠 수 있습니다.</div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">관광업 가상 사례</div><div class=\"ib-body\">여행사라면 경쟁 여행사만 볼 것이 아니라, <strong>여행 대체 서비스</strong>, <strong>새로운 디지털 플랫폼</strong>, <strong>고령층 수요</strong>, <strong>제휴 항공·숙박 데이터</strong>까지 살펴볼 수 있습니다.</div></div>","keywords":[{"term":"Macro Environment","meaning":"거시 환경"},{"term":"Substitute / New Entrant","meaning":"대체재 / 신규 진입자"},{"term":"Influencer","meaning":"구매 결정에 영향을 미치는 이해관계자"},{"term":"Partners & Network","meaning":"외부 협력 관계의 역량"}],"comic":[{"emoji":"🏪","title":"안쪽만 보기","dialog":"“우리 서비스만 살피면 되지?”","reason":"문제 후보가 좁아집니다."},{"emoji":"🔎","title":"경쟁 밖 보기","dialog":"“다른 앱도 우리 경쟁자일까?”","reason":"대체재와 신규 진입자를 봅니다."},{"emoji":"🌦️","title":"환경 보기","dialog":"“정책과 인구도 달라졌네.”","reason":"거시 변화를 확인합니다."},{"emoji":"💡","title":"기회 발견","dialog":"“새로운 수요 예측 과제가 있네!”","reason":"관점을 넓히면 기회가 생깁니다."}],"script":"기회 탐색은 기존 사업 범위만 보는 것이 아닙니다. 네 가지 렌즈를 돌려가며 보면 비즈니스 문제가 더 넓게 발견됩니다.","takeaway":"확장 4관점 = 거시 / 경쟁자 / 시장 니즈 / 역량","tag":"이론"},{"cat":"하향식","title":"STEEP: 거시적 메가트렌드의 다섯 축","page":"128","lead":"거시적 변화를 다섯 범주로 나눈 것이 STEEP입니다. 채널(Channel)은 여기에 포함되지 않습니다.","visual":"<div class=\"steep-grid\"><div><span>👥</span><strong>S</strong><b>Social</b><small>사회</small><p>고령화·인구 변화</p></div><div><span>🤖</span><strong>T</strong><b>Technological</b><small>기술</small><p>AI·로봇·기술 혁신</p></div><div><span>💱</span><strong>E</strong><b>Economic</b><small>경제</small><p>금리·환율·원자재 가격</p></div><div><span>🌱</span><strong>E</strong><b>Environmental</b><small>환경</small><p>기후·탄소 규제</p></div><div><span>🏛️</span><strong>P</strong><b>Political</b><small>정치</small><p>정책·지정학적 변화</p></div></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">시험 포인트</div><div class=\"ib-body\">STEEP의 두 E는 <strong>Economic(경제)</strong>와 <strong>Environmental(환경)</strong>입니다. 고객에게 전달하는 <strong>Channel(채널)</strong>은 별도의 시장 니즈 탐색 관점입니다.</div></div>","keywords":[{"term":"Mega Trend","meaning":"산업 전반에 장기적으로 영향을 미치는 거시적 흐름"},{"term":"STEEP","meaning":"Social / Technological / Economic / Environmental / Political"}],"comic":[{"emoji":"👵","title":"사회","dialog":"“고령 관광객이 늘었어.”","reason":"Social"},{"emoji":"🤖","title":"기술","dialog":"“AI 안내가 보편화되네.”","reason":"Technological"},{"emoji":"💹","title":"경제·환경","dialog":"“환율과 탄소 규제도 바뀌어.”","reason":"Economic · Environmental"},{"emoji":"🏛️","title":"정치","dialog":"“새 관광정책이 나왔어.”","reason":"Political"}],"script":"다섯 개를 단순한 약자로 외우지 말고, 여행 상품 기획이 어떤 변화의 영향을 받는지 다섯 질문으로 떠올리면 기억하기 쉽습니다.","takeaway":"S T E E P = 사회·기술·경제·환경·정치","tag":"이론"},{"cat":"하향식","title":"시장 니즈·경쟁자·역량은 서로 다른 렌즈","page":"128–129","lead":"시장 니즈는 고객·채널·영향자, 경쟁자는 대체재·직접 경쟁자·신규 진입자, 역량은 내부·파트너 네트워크로 나눕니다.","visual":"<div class=\"three-lenses\"><div class=\"lens\"><div class=\"lens-top\">🛒 시장 니즈</div><div>👤 Customer<br><small>구매하는 사람</small></div><div>🧭 Channel<br><small>고객에게 닿는 경로</small></div><div>🗣️ Influencer<br><small>구매에 영향을 주는 주체</small></div></div><div class=\"lens\"><div class=\"lens-top\">♟️ 경쟁자 확대</div><div>🔁 Substitute<br><small>대체 가능한 서비스</small></div><div>🏪 Competitor<br><small>현재의 경쟁사</small></div><div>🚀 New Entrant<br><small>새롭게 들어오는 사업자</small></div></div><div class=\"lens\"><div class=\"lens-top\">🧠 역량</div><div>🏢 Competency<br>  수준 모니터링, 자금 시재 예측, 구매 최적화, 고객 만족 분석 등 여러 업무의 <strong>문제와 기대효과</strong>를 연결해 유즈케이스를 작성합니다. 관광 사례는 수업용으로 추가했습니다.</div></div>","keywords":[{"term":"External Reference Model","meaning":"유사·동종 사례에서 분석 주제를 참고하는 방법"},{"term":"Analytics Use Case","meaning":"문제 설명과 분석 후 기대효과를 명시한 사례"},{"term":"Benchmarking","meaning":"유사 사례를 학습해 활용하는 활동"}],"comic":[{"emoji":"📚","title":"사례 탐색","dialog":"“다른 지역은 어떻게 했지?”","reason":"벤치마킹"},{"emoji":"💭","title":"아이디어","dialog":"“우리 문제에도 적용해 볼까?”","reason":"과제 후보 도출"},{"emoji":"📋","title":"유즈케이스","dialog":"“문제와 효과를 적자.”","reason":"분석 대상 구체화"},{"emoji":"✅","title":"후보 검토","dialog":"“가치가 충분하네.”","reason":"과제화 여부 검토"}],"script":"유즈케이스는 분석 기법의 이름만 적는 메모가 아닙니다. 무엇이 문제이고 해결하면 어떤 효과가 있는지 적어, 과제 후보를 평가할 수 있게 합니다.","takeaway":"Use Case = 문제 설명 + 기대효과","tag":"이론"},{"cat":"하향식","title":"문제 정의: 비즈니스 언어를 분석 언어로","page":"132","lead":"1단계의 문제 탐색이 What·Why라면, 2단계의 문제 정의는 이를 데이터와 기법 중심의 How로 구체화합니다.","visual":"<div class=\"transform\"><div class=\"transform-before\"><small>비즈니스 문제</small><strong>“고객 이탈이 늘었다.”</strong><p>현장에서 관찰된 어려움</p></div><div class=\"trans-arrow\">⟶<small>문제 변환</small></div><div class=\"transform-after\"><small>데이터 분석 문제</small><strong>“이탈 가능성을 예측한다.”</strong><p>이탈 요인 식별 + 위험 고객 예측</p></div></div><div class=\"table-wrap\"><table><thead><tr><th>비즈니스 문제</th><th>분석 문제로 변환</th></tr></thead><tbody><tr><td>고객 이탈 증가</td><td>이탈 요인 식별, 이탈 가능성 예측</td></tr><tr><td>설비 장애로 판매량 감소</td><td>장애 징후 탐지, 발생 시점·가능성 예측</td></tr><tr><td>재고·가격 의사결정 곤란</td><td>수요 예측 인자 추출 및 모델링</td></tr></tbody></table></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">정의 시 검토할 사항</div><div class=\"ib-body\">필요 데이터·가능한 기법을 설정하되, <strong>최종 사용자(End User)</strong> 관점에서 분석 결과가 실제로 도움이 되는지 확인합니다.</div></div>","keywords":[{"term":"Business Problem","meaning":"사업에서 체감하는 문제"},{"term":"Analytics Problem","meaning":"데이터로 측정·설명·예측할 수 있게 정의한 문제"},{"term":"End User","meaning":"분석 결과의 최종 사용자"}],"comic":[{"emoji":"😟","title":"현장 문제","dialog":"“예약이 자꾸 취소돼요.”","reason":"문제 탐색 단계"},{"emoji":"❓","title":"질문 전환","dialog":"“누가 취소할 가능성이 크지?”","reason":"정확한 분석 질문"},{"emoji":"🗃️","title":"자료 찾기","dialog":"“취소 이력과 예약 기록이 필요해.”","reason":"데이터 정의"},{"emoji":"🧪","title":"분석 준비","dialog":"“취소 위험 예측을 해보자.”","reason":"문제 정의 완료"}],"script":"문제 정의는 단지 제목을 바꾸는 일이 아닙니다. 모호한 경영상 문제를 데이터로 다룰 수 있는 구체적 문제로 바꾸는 것입니다.","takeaway":"“매출이 떨어진다” → “매출 하락 요인을 분석한다”","tag":"이론"},{"cat":"하향식","title":"해결방안 탐색: 도구와 역량을 함께 선택","page":"132–133","lead":"정의한 문제를 어떤 방법으로 해결할지 검토합니다. 기존 시스템 개선, 엑셀, 전문 분석도구, 인력 확보 또는 전문업체 활용까지 폭넓게 검토합니다.","visual":"<div class=\"solution-matrix\"><div class=\"matrix-title\">분석 역량 × 분석 시스템</div><div class=\"sm-grid\"><div class=\"sm-head\">역량 있음</div><div class=\"sm-head\">역량 부족</div><div class=\"sm-card\"><b>기존 시스템 활용·개선</b><small>단순 보완 또는 고도화</small></div><div class=\"sm-card\"><b>교육·채용을 통한 역량 확보</b><small>내부에서 실행할 수 있게 준비</small></div><div class=\"sm-card\"><b>새 분석도구 도입</b><small>필요한 기법·환경을 추가</small></div><div class=\"sm-card\"><b>전문업체 활용</b><small>외부 전문성 Sourcing</small></div></div></div><div class=\"tool-line\"><span>📗 엑셀</span><span>🖥️ 기존 정보시스템</span><span>🧮 분석 소프트웨어</span><span>☁️ 분산처리 환경</span></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">결정의 핵심</div><div class=\"ib-body\">무조건 가장 복잡한 분석도구를 사용하는 것이 아닙니다. <strong>문제 해결에 필요한 수준</strong>과 현재 인력·시스템 역량을 함께 고려합니다.</div></div>","keywords":[{"term":"Solution Search","meaning":"문제 해결을 위한 대안 비교"},{"term":"Sourcing","meaning":"외부 전문업체의 역량 활용"},{"term":"Analytical Capability","meaning":"분석을 실제 수행할 수 있는 인력·조직 역량"}],"comic":[{"emoji":"🧑‍💻","title":"도구 점검","dialog":"“우리 시스템으로 될까?”","reason":"기존 자원 검토"},{"emoji":"📊","title":"쉬운 방법","dialog":"“엑셀만으로도 될 수 있어.”","reason":"간단한 방안도 고려"},{"emoji":"🧑‍🏫","title":"역량 검토","dialog":"“교육이 더 필요하네.”","reason":"분석 인력 확보"},{"emoji":"🤝","title":"실행 방안","dialog":"“전문가와 협업하자.”","reason":"해결방안 선택"}],"script":"분석 문제를 정했다고 반드시 대규모 도구를 쓰는 것은 아닙니다. 회사가 이미 가진 시스템과 역량부터 확인하고 필요한 대안을 찾습니다.","takeaway":"기법(How) + 인력(Who) + 시스템을 함께 검토","tag":"이론"},{"cat":"하향식","title":"타당성 검토: 실행해도 되는 과제인가?","page":"133","lead":"4단계에서 비용 대비 편익을 검토하고, 데이터·기술·역량의 충족 여부를 판단한 후 과제 정의서로 연결합니다.","visual":"<div class=\"feasibility\"><div class=\"feas-box\"><div class=\"feas-icon\">💰</div><b>경제적 타당성</b><p>비용: 데이터·시스템·인력·유지보수</p><p>편익: 비용 절감·매출·수익 증가</p></div><div class=\"feas-sep\">+</div><div class=\"feas-box\"><div class=\"feas-icon\">🧰</div><b>데이터·기술적 타당성</b><p>데이터가 존재하는가?</p><p>시스템·분석역량이 확보되는가?</p></div></div><div class=\"feas-outcome\">↓ 평가하여 우선 대안 선정 ↓<br><strong>📄 분석 과제 정의서 → 프로젝트 계획</strong></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">간단한 판단 예시</div><div class=\"ib-body\">예약 취소 예측 시스템의 비용이 예상 절감 효과보다 크다면 경제적으로 어렵습니다. 고객 데이터가 없어 학습 자체가 불가능하다면 데이터·기술적으로 어렵습니다.</div></div>","keywords":[{"term":"Cost–Benefit Analysis","meaning":"비용과 기대편익의 비교"},{"term":"Technical Feasibility","meaning":"기술·데이터·역량으로 구현 가능한 정도"},{"term":"Project Planning","meaning":"선정된 과제를 수행 계획으로 구체화"}],"comic":[{"emoji":"💳","title":"비용 계산","dialog":"“개발비가 얼마일까?”","reason":"비용 추정"},{"emoji":"📈","title":"효과 계산","dialog":"“취소 손실을 얼마나 줄이지?”","reason":"편익 추정"},{"emoji":"🧩","title":"실행 가능성","dialog":"“자료와 인력이 충분한가?”","reason":"데이터·기술 점검"},{"emoji":"✅","title":"결정","dialog":"“가장 적절한 대안을 추진하자.”","reason":"과제 정의로 연결"}],"script":"경제적 타당성은 돈의 관점, 데이터·기술적 타당성은 실현 가능성의 관점입니다. 둘 다 검토해야 합니다.","takeaway":"경제 = 비용 대비 효과 / 기술 = 데이터·시스템·역량","tag":"이론"},{"cat":"상향식","title":"상향식: 원천 데이터에서 인사이트와 문제 발견","page":"134","lead":"미리 완전히 정의된 질문이 없어도 데이터를 관찰하고 연결해 새로운 패턴과 가치 있는 분석 문제를 찾아냅니다.","visual":"<div class=\"data-discovery\"><div class=\"data-cloud\"><span class=\"dot\" style=\"top:13%;left:18%\"></span><span class=\"dot\" style=\"top:27%;left:28%\"></span><span class=\"dot\" style=\"top:63%;left:20%\"></span><span class=\"dot\" style=\"top:76%;left:50%\"></span><span class=\"dot\" style=\"top:40%;left:56%\"></span><span class=\"dot\" style=\"top:21%;left:77%\"></span><span class=\"dot\" style=\"top:69%;left:75%\"></span><b>📂 데이터 집합</b></div><div class=\"bigarr\">→</div><div class=\"clusters\"><span class=\"cl c1\">● ●<br>● ●</span><span class=\"cl c2\">● ●<br> ● ●</span><span class=\"cl c3\">● ●<br>●</span><b>🔎 패턴·집단 탐색</b></div><div class=\"bigarr\">→</div><div class=\"idea-card\">💡<b>새로운 과제 발견</b><small>“특정 방문 패턴이 반복된다!”</small></div></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">교재의 특징</div><div class=\"ib-body\">데이터 자체의 결합·연관성·유사성에서 출발할 수 있으며, 새로운 유형의 문제를 찾는 데 유용합니다. 교재는 상향식의 전형적인 방법으로 비지도학습을 설명합니다.</div></div><div class=\"info-box soft\"><div class=\"ib-title\">주의</div><div class=\"ib-body\">상향식과 비지도학습은 <strong>동일한 개념이 아닙니다</strong>. 상향식은 과제를 발굴하는 접근 방식, 비지도학습은 분석 기법의 한 유형입니다.</div></div>","keywords":[{"term":"Bottom-Up Approach","meaning":"데이터를 먼저 탐색하여 문제를 발견"},{"term":"Unsupervised Learning","meaning":"정답 레이블 없이 구조·유사성을 탐색"},{"term":"Insight","meaning":"데이터에서 발견한 의미 있는 통찰"}],"comic":[{"emoji":"🗃️","title":"데이터 모으기","dialog":"“예약·방문 기록을 살펴보자.”","reason":"문제가 확정되지 않은 상태"},{"emoji":"🔎","title":"패턴 탐색","dialog":"“특정 시간에 사람이 몰리네!”","reason":"반복·유사성 찾기"},{"emoji":"💡","title":"새로운 질문","dialog":"“혼잡을 줄일 수 있을까?”","reason":"문제 후보 발견"},{"emoji":"📌","title":"과제 선정","dialog":"“시간대별 혼잡을 분석하자.”","reason":"과제를 명확히 정의"}],"script":"하향식은 물어볼 질문을 먼저 정하고 자료를 찾습니다. 상향식은 이미 있는 자료에서 예상하지 못한 질문이 생겨날 수 있다는 점이 다릅니다.","takeaway":"먼저 관찰 → 패턴 발견 → 문제 구체화","tag":"이론"},{"cat":"상향식","title":"디자인 사고: 공감·정의·발상·시제품·검증","page":"134–135","lead":"디자인 사고(Design Thinking)는 상향식의 발산과 하향식의 수렴을 반복하는 접근입니다.","visual":"<div class=\"design-steps\"><div class=\"ds\"><b>👂</b><strong>Empathize</strong><small>공감</small><p>사용자 관찰</p></div><div class=\"ds\"><b>🎯</b><strong>Define</strong><small>문제 정의</small><p>핵심 문제 명료화</p></div><div class=\"ds\"><b>💡</b><strong>Ideate</strong><small>아이디어 도출</small><p>다양한 해결책</p></div><div class=\"ds\"><b>🧱</b><strong>Prototype</strong><small>시제품</small><p>간단히 구현</p></div><div class=\"ds\"><b>🧪</b><strong>Test</strong><small>시험</small><p>피드백 반영</p></div></div><div class=\"diamond-wrapper\"><svg viewBox=\"0 0 800 185\" role=\"img\" aria-label=\"발산-수렴-발산-수렴 다이아몬드\"><defs><linearGradient id=\"dga\"><stop stop-color=\"#77bdff\"/><stop offset=\"1\" stop-color=\"#e5eeff\"/></linearGradient><linearGradient id=\"dgb\"><stop stop-color=\"#6cdbc5\"/><stop offset=\"1\" stop-color=\"#e8fff5\"/></linearGradient></defs><path d=\"M18 95 L200 18 L382 95 L200 171 Z\" fill=\"url(#dga)\" stroke=\"#7aa5e5\" stroke-width=\"2\"/><path d=\"M418 95 L600 18 L782 95 L600 171 Z\" fill=\"url(#dgb)\" stroke=\"#6bad9f\" stroke-width=\"2\"/><g font-size=\"19\" fill=\"#19395a\" text-anchor=\"middle\" font-weight=\"750\"><text x=\"200\" y=\"94\">문제 공간</text><text x=\"600\" y=\"94\">해결 공간</text></g><g font-size=\"15\" fill=\"#284461\" text-anchor=\"middle\"><text x=\"95\" y=\"28\">발산</text><text x=\"305\" y=\"28\">수렴</text><text x=\"500\" y=\"28\">발산</text><text x=\"706\" y=\"28\">수렴</text></g><path d=\"M387 95 H413\" stroke=\"#587aa3\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">핵심 논리</div><div class=\"ib-body\">사용자를 관찰해 가능한 문제와 아이디어를 넓히는 <strong>발산(Divergence)</strong>, 핵심 문제·해결책을 선택하는 <strong>수렴(Convergence)</strong>을 오가며 개선합니다. 교재는 공감을 특히 강조합니다.</div></div>","keywords":[{"term":"Empathize","meaning":"사용자의 관점을 깊이 이해"},{"term":"Define","meaning":"실제 해결할 문제를 명확히 표현"},{"term":"Ideate","meaning":"대안을 다양하게 도출"},{"term":"Prototype / Test","meaning":"시제품 구현 / 사용자 피드백 검증"}],"comic":[{"emoji":"👂","title":"불편 공감","dialog":"“관광지 표지판이 어려워요.”","reason":"사용자의 경험 듣기"},{"emoji":"🎯","title":"문제 정의","dialog":"“안내 정보가 복잡하군.”","reason":"핵심 문제 선정"},{"emoji":"💡","title":"아이디어","dialog":"“그림 안내는 어떨까?”","reason":"해결 대안 발산"},{"emoji":"📱","title":"시험·개선","dialog":"“시제품을 써보고 고치자.”","reason":"반복과 수렴"}],"script":"디자인 사고에서 핵심은 처음부터 정답을 확신하지 않는 것입니다. 고객을 관찰하고 여러 해법을 만든 다음 직접 시험하면서 가장 적절한 것을 선택합니다.","takeaway":"디자인 사고 = 발산 ↔ 수렴, 반복 / 공감이 첫 단계","tag":"이론"},{"cat":"상향식","title":"지도학습과 비지도학습의 차이","page":"135–136","lead":"교재는 명확한 목적과 정답값을 이용하는 지도학습, 숨겨진 구조를 탐색하는 비지도학습을 비교합니다.","visual":"<div class=\"learning-split\"><div class=\"learning-pane\"><h4>지도학습 · Supervised</h4><svg viewBox=\"0 0 360 230\" role=\"img\" aria-label=\"동그라미와 세모로 구분된 두 집단을 직선이 분류\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"230\" fill=\"#f4f7ff\" rx=\"16\"/><g fill=\"#4b8ee8\"> <circle cx=\"62\" cy=\"47\" r=\"12\"/><circle cx=\"98\" cy=\"83\" r=\"12\"/><circle cx=\"66\" cy=\"120\" r=\"12\"/><circle cx=\"130\" cy=\"40\" r=\"12\"/><circle cx=\"139\" cy=\"104\" r=\"12\"/></g><g fill=\"#ef9e52\"><path d=\"M244 43 l-13 23 h26z\"/><path d=\"M285 82 l-13 23 h26z\"/><path d=\"M242 130 l-13 23 h26z\"/><path d=\"M307 133 l-13 23 h26z\"/><path d=\"M202 90 l-13 23 h26z\"/></g><line x1=\"195\" y1=\"10\" x2=\"164\" y2=\"208\" stroke=\"#223f5a\" stroke-width=\"4\" stroke-dasharray=\"8 6\"/><text x=\"25\" y=\"197\" fill=\"#315ca9\" font-size=\"17\">○ 그룹</text><text x=\"266\" y=\"197\" fill=\"#b06c28\" font-size=\"17\">△ 그룹</text></svg><p>정답이 있는 데이터로 경계를 학습</p><div class=\"badge-line\">분류 · 예측</div></div><div class=\"learning-pane\"><h4>비지도학습 · Unsupervised</h4><svg viewBox=\"0 0 360 230\" role=\"img\" aria-label=\"정답 없이 좌표상의 세 묶음으로 군집화된 데이터\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"230\" fill=\"#f5fdfa\" rx=\"16\"/><ellipse cx=\"85\" cy=\"73\" rx=\"59\" ry=\"51\" fill=\"#e2eafe\" stroke=\"#c1cef6\"/><ellipse cx=\"253\" cy=\"88\" rx=\"64\" ry=\"56\" fill=\"#ffe8cb\" stroke=\"#f2c8a2\"/><ellipse cx=\"177\" cy=\"182\" rx=\"58\" ry=\"39\" fill=\"#d7f7de\" stroke=\"#a9dbb8\"/><g fill=\"#527dca\"><circle cx=\"61\" cy=\"56\" r=\"8\"/><circle cx=\"94\" cy=\"42\" r=\"8\"/><circle cx=\"112\" cy=\"80\" r=\"8\"/><circle cx=\"67\" cy=\"106\" r=\"8\"/><circle cx=\"91\" cy=\"91\" r=\"8\"/></g><g fill=\"#e79c55\"><circle cx=\"229\" cy=\"61\" r=\"8\"/><circle cx=\"251\" cy=\"83\" r=\"8\"/><circle cx=\"279\" cy=\"76\" r=\"8\"/><circle cx=\"265\" cy=\"111\" r=\"8\"/><circle cx=\"228\" cy=\"112\" r=\"8\"/></g><g fill=\"#63ad7e\"><circle cx=\"150\" cy=\"177\" r=\"8\"/><circle cx=\"174\" cy=\"190\" r=\"8\"/><circle cx=\"201\" cy=\"169\" r=\"8\"/><circle cx=\"194\" cy=\"200\" r=\"8\"/></g></svg><p>정답 없이 유사한 데이터끼리 묶음</p><div class=\"badge-line green\">군집 · 연관 · 패턴</div></div></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">정확하게 이해하기</div><div class=\"ib-body\">지도학습에는 목표값(레이블)이 있고, 비지도학습에는 사전 정의한 정답 레이블이 없습니다. 교재에서 말하는 <strong>분류=지도, 군집=비지도</strong>의 구분이 핵심입니다.</div></div>","keywords":[{"term":"Classification","meaning":"정답 범주를 학습하는 분류"},{"term":"Clustering","meaning":"비슷한 데이터끼리 군집 형성"},{"term":"Label","meaning":"학습 과정에서 참고하는 목표값"}],"comic":[{"emoji":"📝","title":"정답이 있음","dialog":"“이 손님은 재방문했어.”","reason":"레이블 보유"},{"emoji":"🧠","title":"지도학습","dialog":"“재방문 여부를 예측해!”","reason":"분류·예측"},{"emoji":"🔍","title":"정답이 없음","dialog":"“방문객들을 그냥 살펴보자.”","reason":"레이블이 없음"},{"emoji":"🧩","title":"비지도학습","dialog":"“이렇게 세 부류로 묶이네!”","reason":"군집·구조 발견"}],"script":"정답이 있는 문제집으로 학습하는 것과, 정답 없이 비슷한 그림끼리 모아보는 것의 차이라고 생각하면 됩니다. 다만 상향식과 비지도학습은 개념의 층위가 다릅니다.","takeaway":"레이블 있음 → 지도 / 레이블 없음 → 비지도","tag":"이론"},{"cat":"상향식","title":"프로토타이핑: 먼저 시도하고 점차 개선","page":"136–137","lead":"요구사항·데이터가 불명확할 때 간단한 모형을 빠르게 만들어 테스트하고 그 결과를 이용해 문제를 구체화합니다.","visual":"<div class=\"prototype-cycle\"><div class=\"proto-node n1\">① 가설 생성<small>Hypothesis</small></div><div class=\"proto-node n2\">② 디자인 실험<small>Experiment</small></div><div class=\"proto-node n3\">③ 실제 테스트<small>Test</small></div><div class=\"proto-node n4\">④ 통찰·검증<small>Insight</small></div><div class=\"cycle-center\">🔄<b>반복·개선</b><small>Iterative Learning</small></div><svg viewBox=\"0 0 620 350\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M285 30 Q445 30 488 140\"/><path d=\"M520 176 Q520 285 369 305\"/><path d=\"M300 323 Q129 328 114 201\"/><path d=\"M108 164 Q92 44 257 30\"/></svg></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">핵심 특성</div><div class=\"ib-body\">처음부터 완성된 해결책을 요구하지 않습니다. 일단 실행 가능한 시제품으로 <strong>가설 → 실험 → 테스트 → 통찰</strong>을 순환하며 필요한 데이터와 문제 정의를 보완합니다.</div></div>","keywords":[{"term":"Prototyping","meaning":"작은 모형을 빠르게 만들어 검증하고 개선하는 방법"},{"term":"Iterative","meaning":"반복·순환하며 발전시키는 성격"},{"term":"Hypothesis","meaning":"데이터·사용자 요구에 대한 잠정적 설명"}],"comic":[{"emoji":"💭","title":"가설","dialog":"“이 안내가 더 쉽지 않을까?”","reason":"가설 세우기"},{"emoji":"🛠️","title":"시제품","dialog":"“간단한 화면을 만들자.”","reason":"빠른 구현"},{"emoji":"📱","title":"현장 테스트","dialog":"“직접 눌러보고 알려주세요.”","reason":"사용자 반응 수집"},{"emoji":"🔁","title":"개선","dialog":"“버튼 위치를 바꿔보자!”","reason":"통찰을 다음 시도에 반영"}],"script":"시제품은 반드시 복잡한 프로그램일 필요가 없습니다. 실제 사용자가 반응할 수 있는 작은 모형을 만들고 불편을 확인하면서 개선합니다.","takeaway":"프로토타이핑 = 작게 만들고 → 시험하고 → 고치기","tag":"이론"},{"cat":"상향식","title":"프로토타이핑이 필요한 세 가지 상황","page":"137","lead":"처음 보는 문제이거나 필요한 데이터가 확실하지 않거나, 보유 데이터의 쓰임새가 달라질 때 프로토타이핑이 특히 유용합니다.","visual":"<div class=\"why-proto\"><div><div class=\"why-icon\">❔</div><b>① 문제 인식의 불확실성</b><p>문제 자체가 낯설어 사용자도 요구를 잘 설명하지 못함</p><small>시제품을 보면 요구를 더 정확히 말할 수 있습니다.</small></div><div><div class=\"why-icon\">🗃️</div><b>② 필요 데이터의 불확실성</b><p>자료가 없거나 일부만 존재하며 수집·대체 가능성 확인이 필요함</p><small>분석 불가능한 과제를 조기에 확인합니다.</small></div><div><div class=\"why-icon\">🔁</div><b>③ 데이터 사용 목적의 가변성</b><p>원래 수집한 목적과 다른 곳에도 데이터가 쓰일 수 있음</p><small>예: 통신 위치 데이터 → 이동·밀집 패턴 연구</small></div></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">시험에 등장하는 질문 형태</div><div class=\"ib-body\">“요구사항을 정확히 규정할 수 없는데 일단 간단한 모델을 만들고 확인한다” → <strong>프로토타이핑</strong>. 단순한 데이터 탐색만 강조하면 → <strong>상향식</strong> 개념이 더 가깝습니다.</div></div>","keywords":[{"term":"Problem Awareness","meaning":"문제에 대한 인식 수준"},{"term":"Data Availability","meaning":"필요 데이터의 존재와 획득 가능성"},{"term":"Purpose Variability","meaning":"데이터 사용 목적이 상황에 따라 달라질 수 있음"}],"comic":[{"emoji":"😕","title":"불명확한 요구","dialog":"“어떤 화면이 필요한지 모르겠어.”","reason":"문제 인식의 불확실성"},{"emoji":"🗂️","title":"자료 점검","dialog":"“필요한 기록이 없는데?”","reason":"데이터 존재 여부"},{"emoji":"📍","title":"새로운 활용","dialog":"“위치 자료로 혼잡도 보자.”","reason":"목적의 가변성"},{"emoji":"🧪","title":"작게 시험","dialog":"“일단 시험해 확인하자.”","reason":"프로토타이핑"}],"script" -box \"><div class=\"ib-title\">문제와 연결되는 이론</div><div class=\"ib-body\">문제를 알고 시작하면 하향식, 데이터에서 문제를 찾으면 상향식.</div></div><div class=\"info-box soft\"><div class=\"ib-title\">풀이 전략</div><div class=\"ib-body\">①의 표현에서 “분석 대상이 명확하다면”을 표시하세요. 그것이 정답을 판별하는 결정적 조건입니다.</div></div>","keywords":[{"term":"교재 기출","meaning":"37회 기출 · 교재 138쪽"}],"comic":[{"emoji":"📣","title":"문제 있음","dialog":"“고객 이탈이 문제야.”","reason":"문제가 먼저 주어짐"},{"emoji":"⬇️","title":"목표 중심","dialog":"“이탈 원인을 찾자!”","reason":"하향식"},{"emoji":"📂","title":"문제 미정","dialog":"“데이터에 뭐가 있지?”","reason":"새로운 문제 탐색"},{"emoji":"⬆️","title":"데이터 중심","dialog":"“방문 패턴을 발견했어.”","reason":"상향식"}],"script":"①의 표현에서 “분석 대상이 명확하다면”을 표시하세요. 그것이 정답을 판별하는 결정적 조건입니다.","takeaway":"정답 ① · 문제를 알고 시작하면 하향식, 데이터에서 문제를 찾으면 상향식.","tag":"기출","quiz":{"no":9,"round":"37회 기출","page":"138","title":"분석 과제 발굴의 접근법","prompt":"분석 과제 발굴에 대한 설명으로 틀린 것은?","options":["분석해야 할 대상이 명확하다면 상향식 접근 방식이 적절하다.","하향식 접근법은 조직의 비즈니스 목표를 기준으로 분석 과제를 도출하고, 이에 필요한 데이터를 준비하는 방식이다.","비즈니스 목표와 데이터의 연계성을 파악하여 실질적인 가치를 창출할 수 있는 문제를 정의하는 것이 중요하다.","분석 과제는 과거 데이터를 활용한 패턴 분석과 미래 예측을 통해 조직의 의사결정을 지원하는 방향으로 발굴된다."],"answer":0,"reasons":["<strong>오답 선지(정답)</strong>. 분석 대상과 목표가 이미 명확하다면 보통 <b>하향식</b>에서 출발합니다. 상향식은 다양한 데이터에서 문제를 발견할 때 적합합니다.","<strong>타당한 설명.</strong> 조직 목표를 먼저 정해 그에 맞는 분석 과제를 찾는 것은 하향식 접근의 전형적인 특징입니다.","<strong>타당한 설명.</strong> 데이터 분석은 기업의 실질적 가치와 연결되어야 하며 문제 정의가 구체적이어야 합니다.","<strong>타당한 설명.</strong> 과거 패턴 분석·미래 예측은 의사결정을 지원하는 분석 과제의 활용 방향입니다."],"theory":"문제를 알고 시작하면 하향식, 데이터에서 문제를 찾으면 상향식.","mini":"<div class=\"compare-two\"><div class=\"compare-a\"><b>문제 출발</b><p>하향식 Top-Down</p></div><div class=\"compare-arrow\">↔</div><div class=\"compare-b\"><b>데이터 출발</b><p>상향식 Bottom-Up</p></div></div>","script":"①의 표현에서 “분석 대상이 명확하다면”을 표시하세요. 그것이 정답을 판별하는 결정적 조건입니다.","c":[{"emoji":"📣","title":"문제 있음","dialog":"“고객 이탈이 문제야.”","reason":"문제가 먼저 주어짐"},{"emoji":"⬇️","title":"목표 중심","dialog":"“이탈 원인을 찾자!”","reason":"하향식"},{"emoji":"📂","title":"문제 미정","dialog":"“데이터에 뭐가 있지?”","reason":"새로운 문제 탐색"},{"emoji":"⬆️","title":"데이터 중심","dialog":"“방문 패턴을 발견했어.”","reason":"상향식"}]}},{"cat":"기출문제","title":"문항 10 · 하향식 4단계 순서","page":"138","lead":"하향식 접근법(Top-Down Approach)의 데이터 분석 기획 단계를 올바른 순서로 나열한 것은?<div class=\"question-extra\">가. 문제 정의(Problem Definition)　 나. 문제 탐색(Problem Discovery)<br>다. 해결방안 탐색(Solution Search)　 라. 타당성 검토(Feasibility Study)</div>","visual":"<div class=\"flow-steps\"><div class=\"flow-step\"><small>01</small><b>나</b><span>문제 탐색</span></div><div class=\"flow-arrow\">→</div><div class=\"flow-step\"><small>02</small><b>가</b><span>문제 정의</span></div><div class=\"flow-arrow\">→</div><div class=\"flow-step\"><small>03</small><b>다</b><span>해결방안</span></div><div class=\"flow-arrow\">→</div><div class=\"flow-step\"><small>04</small><b>라</b><span>타당성</span></div></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">문제와 연결되는 이론</div><div class=\"ib-body\">탐색 → 정의 → 해결방안 → 타당성.</div></div><div class=\"info-box soft\"><div class=\"ib-title\">풀이 전략</div><div class=\"ib-body\">문제를 찾기도 전에 정의하는 것은 어색합니다. 문제를 찾아 이름 붙이고 해결책을 정한 후 현실성을 평가한다고 설명하면 순서가 자연스럽습니다.</div></div>","keywords":[{"term":"교재 기출","meaning":"33회 기출 · 교재 138쪽"}],"comic":[{"emoji":"🚨","title":"문제 발견","dialog":"“취소가 늘었어.”","reason":"나: 탐색"},{"emoji":"📝","title":"질문 바꾸기","dialog":"“취소 위험을 예측하자.”","reason":"가: 정의"},{"emoji":"🛠️","title":"해결방안","dialog":"“어떤 기법을 쓰지?”","reason":"다: 해결방안"},{"emoji":"⚖️","title":"실행 검토","dialog":"“비용과 데이터는?”","reason":"라: 타당성"}],"script":"문제를 찾기도 전에 정의하는 것은 어색합니다. 문제를 찾아 이름 붙이고 해결책을 정한 후 현실성을 평가한다고 설명하면 순서가 자연스럽습니다.","takeaway":"정답 ④ · 탐색 → 정의 → 해결방안 → 타당성.","tag":"기출","quiz":{"no":10,"round":"33회 기출","page":"138","title":"하향식 4단계 순서","prompt":"하향식 접근법(Top-Down Approach)의 데이터 분석 기획 단계를 올바른 순서로 나열한 것은?<div class=\"question-extra\">가. 문제 정의(Problem Definition)　 나. 문제 탐색(Problem Discovery)<br>다. 해결방안 탐색(Solution Search)　 라. 타당성 검토(Feasibility Study)</div>","options":["나 → 가 → 라 → 다","가 → 나 → 다 → 라","가 → 나 → 라 → 다","나 → 가 → 다 → 라"],"answer":3,"reasons":["<strong>오답.</strong> 마지막 두 단계가 바뀌었습니다. 해결방안을 먼저 검토한 뒤 타당성을 평가해야 합니다.","<strong>오답.</strong> 문제를 먼저 발견(탐색)한 뒤 그 문제를 분석 언어로 정의합니다.","<strong>오답.</strong> 첫 두 단계와 마지막 두 단계 모두 순서가 바뀌었습니다.","<strong>정답.</strong> 문제 탐색(나) → 문제 정의(가) → 해결방안 탐색(다) → 타당성 검토(라)."],"theory":"탐색 → 정의 → 해결방안 → 타당성.","mini":"<div class=\"flow-steps\"><div class=\"flow-step\"><small>01</small><b>나</b><span>문제 탐색</span></div><div class=\"flow-arrow\">→</div><div class=\"flow-step\"><small>02</small><b>가</b><span>문제 정의</span></div><div class=\"flow-arrow\">→</div><div class=\"flow-step\"><small>03</small><b>다</b><span>해결방안</span></div><div class=\"flow-arrow\">→</div><div class=\"flow-step\"><small>04</small><b>라</b><span>타당성</span></div></div>","script":"문제를 찾기도 전에 정의하는 것은 어색합니다. 문제를 찾아 이름 붙이고 해결책을 정한 후 현실성을 평가한다고 설명하면 순서가 자연스럽습니다.","c":[{"emoji":"🚨","title":"문제 발견","dialog":"“취소가 늘었어.”","reason":"나: 탐색"},{"emoji":"📝","title":"질문 바꾸기","dialog":"“취소 위험을 예측하자.”","reason":"가: 정의"},{"emoji":"🛠️","title":"해결방안","dialog":"“어떤 기법을 쓰지?”","reason":"다: 해결방안"},{"emoji":"⚖️","title":"실행 검토","dialog":"“비용과 데이터는?”","reason":"라: 타당성"}]}},{"cat":"기출문제","title":"문항 11 · 정형화된 단계의 문제 해결 방식","page":"139","lead":"주어진 문제에 대한 해법을 찾기 위해 각 과정이 체계적으로 단계화되어 수행하는 분석 과제 발굴 방식은?","visual":"<div class=\"flow-steps\"><div class=\"flow-step\"><small>01</small><b>문제 주어짐</b><span>목표·현황</span></div><div class=\"flow-arrow\">→</div><div class=\"flow-step\"><small>02</small><b>단계화</b><span>탐색·정의</span></div><div class=\"flow-arrow\">→</div><div class=\"flow-step\"><small>03</small><b>해법 검토</b><span>선택·검증</span></div></div>","explain":"<div class=\"info-box \"><div class=\"ib-title\">문제와 연결되는 이론</div><div class=\"ib-body\">주어진 문제 + 체계적 단계 + 해법 탐색 = 하향식.</div></div><div class=\"info-box soft\"><div class=\"ib-title\">풀이 전략</div><div class=\"ib-body\">②는 단어 그대로의 뜻이 매우 비슷해 보입니다. 하지만 이 문제는 교재에서 붙인 접근법의 이름을 묻기 때문에 ①을 선택해야 합니다.</div></div>","keywords":[{"term":"교재 기출","meaning":"35회 기출 · 교재 139쪽"}],"comic":[{"emoji":"📨","title":"문제 전달"," let current=0;

for(let i=0;i<DECK.length;i++){if(DECK[i].quiz)quizVisible[i]=true;}
const E=s=>String(s??'');
const esc=s=>E(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const src=`출처: 『윤종식 ADsP』 첨부 교재 pp.124–139 (원문 용어·기출 기반) · 시각화 및 가상 사례는 수업 이해용`;

function renderToc(){let h=''; for(const cat of sections){h+=`<div class="section-heading">${esc(cat)}</div>`; DECK.forEach((s,i)=>{if(s.cat===cat)h+=`<button class="toc-btn ${i===current?'active':''}" data-jump="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${esc(s.title)}</span></button>`;});}document.getElementById('toc').innerHTML=h;const active=document.querySelector('.toc-btn.active');active?.scrollIntoView({block:'nearest'});}
function comicHTML(s){if(!s.comic?.length)return '';return `<section class="comics"><div class="section-divider">🎬 4컷 개념 만화 · 상황으로 이해하기</div><div class="comic-grid">${s.comic.map((x,i)=>`<div class="comic-panel"><div class="comic-scene"><span class="comic-no">${i+1}컷</span>${esc(x.emoji)}</div><div class="comic-txt"><strong>${esc(x.title)}</strong><div class="speech">${esc(x.dialog)}</div><small>${esc(x.reason)}</small></div></div>`).join('')}</div></section>`;}

function teacherHTML(s){return `<div class="teacher"><b>🎙️ 강의 설명 대본</b><p>${esc(s.script)}</p></div>`;}
function quizHTML(s,i){const q=s.quiz;const show=quizVisible[i];const selected=quizChoice[i];const options=q.options.map((o,j)=>{let cl='option';if(selected===j)cl+=' selected';if(show&&j===q.answer)cl+=' correct';if(show&&selected===j&&j!==q.answer)cl+=' wrong';return `<button class="${cl}" data-pick="${j}" aria-pressed="${selected===j}"><span class="circ">${'①②③④'[j]}</span><span>${esc(o)}</span></button>`}).join('');const outcome=selected===undefined?'선택지를 누르면 선택 결과를 표시합니다.':selected===q.answer?'선택한 답이 정답입니다. 정답 근거도 함께 확인하세요.':'선택한 답과 정답을 비교하고, 이유를 읽어보세요.';const reasons=show?`<div class="answer-title">✓ 교재 정답 ${'①②③④'[q.answer]} · 선지별 정답·오답 설명</div><div class="reasons">${q.reasons.map((r,j)=>`<div class="reason ${j===q.answer?'good':''}"><b>${'①②③④'[j]}번</b> ${r}</div>`).join('')}</div>`:'';return `<div class="quiz-question">${q.prompt}</div><div class="qhelp">${esc(q.round)} · 보기 하나를 클릭해 보세요. 해설은 기본 표시되며 숨겨서 자가시험도 가능합니다.</div><div class="option-grid">${options}</div><div class="answer-tools"><button data-reveal="1">${show?'🔒 해설 숨기고 풀기':'🔓 정답·오답 해설 보기'}</button><span class="check-feedback">${outcome}</span></div>${reasons}<div class="mini-theory"><h3>🧠 문제와 연결된 이론 그림</h3>${s.visual}</div>${s.explain}`;}
function render(){const s=DECK[current];document.getElementById('topTitle').textContent=s.title;document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${DECK.length}`;document.getElementById('progress').style.width=`${(current+1)/DECK.length*100}%`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===DECK.length-1;let main='';if(s.quiz){main=quizHTML(s,current);}else{main=`<div class="content-grid"><div class="viz-card"><div class="panel-label">핵심 원리 · 시각화</div>${s.visual}</div><div class="explain-card"><div class="panel-label sand">이론 구조화 · 이해 포인트</div>${s.explain}</div></div>`;}container.innerHTML=`<div class="slide-topline"><span class="eyebrow ${s.quiz?'quiz':''}">${esc(s.cat)} ${s.quiz?`/ ${esc(s.quiz.round)}`:''}</span><span class="page-badge">교재 p. ${esc(s.page)}</span><span class="page-badge">${s.quiz?'문제 + 상세 해설':'이론 + 4컷 만화'}</span></div><h2>${esc(s.title)}</h2><div class="lead">${s.quiz?'핵심개념체크 · 교재 기출문제':esc(s.lead)}</div>${main}${keywordsHTML(s)}${s.takeaway?`<div class="takeaway">📌 한 문장 암기: ${esc(s.takeaway)}</div>`:''}${comicHTML(s)}${teacherHTML(s)}<div class="footerline"><span>${src}</span><span>슬라이드 ${current+1} / ${DECK.length}</span></div>`;renderToc();document.getElementById('stage').scrollTop=0;}
function go(n){const x=Math.max(0,Math.min(DECK.length-1,n));if(x!==current){current=x;render();}document.getElementById('sidebar').classList.remove('open')}
document.getElementById('prev').addEventListener('click',()=>go(current-1));document.getElementById('next').addEventListener('click',()=>go(current+1));document.getElementById('printBtn').addEventListener('click',()=>window.print());document.getElementById('menu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.addEventListener('click',e=>{const t=e.target.closest('[data-jump],[data-pick],[data-reveal]');if(!t)return;if(t.dataset.jump!==undefined){go(Number(t.dataset.jump));return;}if(t.dataset.pick!==undefined&&DECK[current].quiz){quizChoice[current]=Number(t.dataset.pick);render();return;}if(t.dataset.reveal!==undefined&&DECK[current].quiz){quizVisible[current]=!quizVisible[current];render();return;}});
document.addEventListener('keydown',e=>{if(e.altKey||e.metaKey||e.ctrlKey||e.target.closest('input,textarea,select'))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1);}else if(e.key==='ArrowLeft'){e.preventDefault();go(current-1);}else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(DECK.length-1);}});
render();
</script>
</body></html>
