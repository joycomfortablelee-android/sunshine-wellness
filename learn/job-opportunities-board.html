<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#172031; --muted:#5d6779; --line:#dfe4ec;
  --org:#0b57d0; --org-soft:#e8f0fe; --chip:#eef1f6;
  --ok:#137a4b; --ok-soft:#e3f4ea;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141c; --surface:#171e29; --ink:#e7ebf2; --muted:#9aa4b5; --line:#2a3342;
    --org:#7cacf8; --org-soft:#1a2a45; --chip:#222b39;
    --ok:#5fd39a; --ok-soft:#173327;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#171e29; --ink:#e7ebf2; --muted:#9aa4b5; --line:#2a3342;
  --org:#7cacf8; --org-soft:#1a2a45; --chip:#222b39;
  --ok:#5fd39a; --ok-soft:#173327;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.65;padding-inline:16px;padding-block:36px 56px}
.wrap{max-width:780px;margin:0 auto;display:grid;gap:26px}
a{color:var(--org)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--org);outline-offset:2px;border-radius:4px}

header{display:grid;gap:10px}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.08em;color:var(--org)}
header h1{font-size:1.9rem;line-height:1.25;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:60ch}

.index{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px}
.index-h{font-size:.82rem;color:var(--muted);letter-spacing:.04em}
.index ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px}
.index a{font-weight:700;font-size:1.02rem;text-decoration:none}
.index a:hover{text-decoration:underline;text-underline-offset:4px}
.index small{color:var(--muted);font-weight:400;font-size:.82rem;margin-left:4px}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters span{font-size:.85rem;color:var(--muted);margin-right:2px}
.filters button{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--org);border-color:var(--org);color:var(--surface);font-weight:500}

.list{display:grid;gap:18px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;display:grid;gap:14px;scroll-margin-top:16px}
.org{font-size:1.45rem;line-height:1.3;font-weight:700;color:var(--org);margin:0;text-wrap:balance}
.orgmeta{font-size:.86rem;color:var(--muted);margin-top:2px}
.role{font-size:1.05rem;font-weight:500;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--chip);color:var(--ink)}
.tag.lv{background:var(--org-soft);color:var(--org);font-weight:700}
.facts{margin:0;display:grid;grid-template-columns:6em 1fr;gap:6px 14px}
.facts dt{color:var(--muted);font-size:.88rem;padding-top:1px}
.facts dd{margin:0}
.why{font-size:.93rem;border-left:3px solid var(--org);padding:2px 0 2px 12px}
.why b{color:var(--org)}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.status{font-size:.84rem;color:var(--muted)}
.status.open{color:var(--ok)}
.status.open::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{text-decoration:none;font-weight:500;font-size:.9rem;padding:7px 14px;border-radius:8px;border:1px solid var(--org)}
.links a.primary{background:var(--org);color:var(--surface)}

details{font-size:.92rem}
summary{cursor:pointer;color:var(--muted);font-size:.88rem}
details[open] summary{margin-bottom:10px}
.more{display:grid;gap:12px}
.more .facts{grid-template-columns:6em 1fr}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:520px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
tr.pick td{background:var(--org-soft)}
.refs ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 16px}
.refs a{font-size:.88rem;text-underline-offset:3px}
.refs-h{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.empty{color:var(--muted);text-align:center;padding:24px}
footer{font-size:.82rem;color:var(--muted)}
@media (max-width:480px){
  .facts,.more .facts{grid-template-columns:1fr;gap:0}
  .facts dd{margin-bottom:8px}
  .org{font-size:1.3rem}
}
body{margin:0}
mark.hl-red{background:linear-gradient(transparent 55%,#fbd0d0 55%);color:inherit;padding:0 2px;font-weight:700}
:root[data-theme="dark"] mark.hl-red{background:linear-gradient(transparent 55%,#6b2a2a 55%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) mark.hl-red{background:linear-gradient(transparent 55%,#6b2a2a 55%)}}
[hidden]{display:none!important}
</style>
</head>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* ⟦ ⟧로 감싼 말은 빨간 줄 형광펜 — 수업에서 짚을 역량 (2026-09-30) */

function status(j){

  if(now<start) return '<span class="status">접수 예정 · '+esc(j.period)+'</span>';
  if(now<=end) return '<span class="status open">지금 접수 중 · '+esc(j.period)+'</span>';
  return '<span class="status">이번 공고 접수 끝남 ('+esc(j.period)+') · 다음 공고를 노려보세요</span>';
}
function card(j){
  var tags=j.levels.map(function(l){return '<span class="tag lv">'+esc(l)+'</span>';}).join('')+
           j.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('');
  var refs=(j.refs||[]).map(function(r){return '<li><a href="'+esc(r[1])+'" target="_blank" rel="noopener">'+esc(r[0])+'</a></li>';}).join('');
  return '<article class="job" id="'+j.id+'" data-levels="'+esc(j.levels.join('|'))+'">'+
    '<div><h2 class="org">'+esc(j.org)+'</h2><div class="orgmeta">'+esc(j.orgmeta)+'</div></div>'+
    '<p class="role">'+esc(j.role)+'</p>'+
    '<div class="tags">'+tags+'</div>'+
    '<dl class="facts"><dt>하는 일</dt><dd>'+hl(esc(j.what))+'</dd><dt>지원 대상</dt><dd>'+esc(j.who)+'</dd><dt>처우</dt><dd>'+esc(j.pay)+'</dd></dl>'+
    '<div class="why">'+j.why+'</div>'+
    '<details><summary>자세히 보기 · 관련 자료</summary><div class="more">'+(j.more||'')+
      (refs?'<div class="refs"><div class="refs-h">관련 자료</div><ul>'+refs+'</ul></div>':'')+'</div></details>'+
    '<div class="foot">'+status(j)+'<div class="links"><a class="primary" href="'+esc(j.url)+'" target="_blank" rel="noopener">공고 원문</a><a href="'+esc(j.apply)+'" target="_blank" rel="noopener">채용 사이트</a></div></div>'+
  '</article>';
}
document.getElementById('list').innerHTML=JOBS.map(card).join('');
document.getElementById('index').innerHTML=JOBS.map(function(j){
  return '<li><a href="#'+j.id+'">'+esc(j.org)+'</a><small>'+esc(j.levels.join('·'))+'</small></li>';
}).join('');
document.getElementById('index-h').textContent='소개한 기관 '+JOBS.length+'곳';
document.getElementById('updated').textContent=UPDATED;

var btns=document.querySelectorAll('.filters button');
btns.forEach(function(b){
  b.addEventListener('click',function(){
    var f=b.dataset.f, shown=0;
    btns.forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
    document.querySelectorAll('.job').forEach(function(el){
      var ok=f==='all'||el.dataset.levels.split('|').indexOf(f)>=0;
      el.hidden=!ok; if(ok) shown++;
    });
    var e=document.getElementById('empty');
    if(!shown){ if(!e){e=document.createElement('p');e.id='empty';e.className='empty';document.getElementById('list').appendChild(e);} e.textContent='아직 이 대상에 맞는 공고가 없습니다.'; e.hidden=false; }
    else if(e){ e.hidden=true; }
  });
});
</script>
</body>
</html>
