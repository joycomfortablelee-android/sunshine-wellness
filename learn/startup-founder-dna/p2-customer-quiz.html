<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>제2부 고객 · 핵심 개념 퀴즈 10 | 스타트업 창업가 DNA</title>
<link rel="icon" href="data:," />
<style>
:root{--bg:#f5f7fb;--ink:#1d2d46;--muted:#64748b;--line:#dfe7f2;--navy:#142e59;--blue:#2459b5;--card:#fff;--ok:#1f7a4a;--okbg:#e9f7ef;--no:#b42318;--nobg:#fdeceb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 60px}
header.top a{color:var(--blue);text-decoration:none;font-size:13px;font-weight:700}
h1{font-size:23px;color:var(--navy);margin:10px 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.bar b{color:var(--navy)}
button{font:inherit;font-size:13px;font-weight:700;cursor:pointer;border:1px solid #b9c9e4;border-radius:8px;padding:6px 12px;background:#fff;color:var(--navy)}
button:hover{background:#eef3fb}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.q h2{font-size:15.5px;margin:0 0 10px;color:var(--navy);line-height:1.5}
.q h2 .n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;margin-right:6px;vertical-align:1px}
.opts{display:grid;gap:6px}
.opts label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:14px}
.opts label:hover{background:#f6f9fe}
.opts input{margin-top:5px}
.opts label.ok{background:var(--okbg);border-color:#9fd3b4}
.opts label.no{background:var(--nobg);border-color:#f0b4ae}
.exp{display:none;margin-top:10px;font-size:13.5px;background:#f4f7fc;border-left:4px solid var(--blue);padding:8px 12px;border-radius:4px}
.q.done .exp{display:block}
.res{font-weight:800;margin-right:6px}
.res.ok{color:var(--ok)}.res.no{color:var(--no)}
footer{margin-top:24px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a href="./#p2">← 스타트업 창업가 DNA · 제2부 고객으로</a></header>
<h1>제2부 · 고객 — 핵심 개념 퀴즈 10</h1>
<p class="sub">교재 제2부(고객: 사업의 시작과 끝)에 나오는 이론 · 용어 가운데 정의가 정해진 개념만 골랐습니다. 보기를 고르면 바로 정답과 해설이 나옵니다.</p>
<div class="bar"><span>점수 <b id="score">0</b> / 10</span><button type="button" id="reset">다시 풀기</button></div>
<div id="quiz"></div>
<footer>정진선, 「스타트업 창업가 DNA」 제2부 강의교안 기반 학습용 문제 — 학내 자습용</footer>
</div>
<script>
const Q=[
 {q:'AIDA 모델의 네 단계를 순서대로 바르게 쓴 것은?',o:['Attention → Interest → Desire → Action','Action → Desire → Interest → Attention','Analysis → Idea → Design → Action','Attention → Information → Decision → Advocacy'],a:0,e:'AIDA = Attention(주의) → Interest(흥미) → Desire(욕구) → Action(행동). 소비자가 광고 · 메시지를 보고 실제 행동(구매)에 이르는 의사결정 단계를 설명한다.'},
 {q:'AIDA 모델에서 「D」가 뜻하는 것은?',o:['Desire(욕구)','Design(디자인)','Data(데이터)','Discount(할인)'],a:0,e:'D = Desire. 관심(Interest)을 가진 소비자에게 「갖고 싶다」는 욕구를 일으키는 단계다.'},
 {q:'라스웰(Lasswell) 커뮤니케이션 모델의 다섯 질문으로 맞는 것은?',o:['누가 · 무엇을 · 어떤 채널로 · 누구에게 · 어떤 효과로','언제 · 어디서 · 누가 · 무엇을 · 왜','제품 · 가격 · 유통 · 촉진 · 사람','주의 · 흥미 · 욕구 · 기억 · 행동'],a:0,e:'라스웰 모델 = Who(누가) says What(무엇을) in Which Channel(어떤 채널로) to Whom(누구에게) with What Effect(어떤 효과로). 커뮤니케이션을 주체 · 메시지 · 매체 · 수신자 · 효과로 나눠 본다.'},
 {q:'메라비언(Mehrabian)의 법칙에서 상대의 호감 · 감정을 판단할 때 가장 큰 비중(55%)을 차지하는 것은?',o:['시각 요소(표정 · 제스처 · 태도)','말의 내용','목소리의 크기만','글자 수'],a:0,e:'메라비언의 법칙 — 시각 요소 55% · 청각 요소(목소리 톤 · 억양) 38% · 말의 내용 7%. 그래서 신뢰를 쌓을 때 비언어적 신호가 중요하다.'},
 {q:'「고객 페르소나(Persona)」를 가장 잘 설명한 것은?',o:['데이터를 바탕으로 목표 · 문제 · 행동 · 동기를 담아 만든 가상의 대표 고객','회사의 실제 대표이사','모든 고객의 평균 나이만 적은 표','경쟁사의 제품 목록'],a:0,e:'페르소나는 실제 고객 데이터를 바탕으로 만든 「가상의 이상적 고객상」이다. 나이 같은 표면 정보뿐 아니라 목표 · 문제 · 행동 패턴 · 심리적 동기까지 담는다.'},
 {q:'마케팅에서 리드(Lead) 고객이란?',o:['제품 · 서비스에 관심을 보여 고객으로 전환될 가능성이 있는 잠재 고객','이미 10년 이상 거래한 단골 고객','회사를 떠난 이탈 고객','제품을 만드는 협력업체'],a:0,e:'리드 = 관심을 보인 잠재 고객(예: 이메일 구독 · 상담 신청 · 무료 자료 다운로드). 판매 활동을 통해 실제 고객으로 전환할 대상이다.'},
 {q:'리드 스코어링(Lead Scoring)의 목적은?',o:['리드의 행동 데이터에 점수를 매겨 구매 가능성이 높은 순서로 우선순위를 정하는 것','모든 리드에게 같은 광고를 보내는 것','리드의 명단을 지우는 것','직원의 업무 성과를 평가하는 것'],a:0,e:'리드 스코어링 — 방문 · 클릭 · 문의 같은 행동 데이터에 점수를 부여해 「먼저 연락할 리드」를 고른다. 한정된 영업 자원을 효율적으로 쓰는 방법이다.'},
 {q:'B2B(Business to Business) 고객의 특징으로 맞는 것은?',o:['기업이 고객이며, 여러 담당자가 함께 구매를 결정하는 경우가 많다','개인 소비자가 혼자 충동적으로 구매한다','정부가 국민에게 서비스를 제공한다','소비자끼리 중고 물건을 사고판다'],a:0,e:'B2B = 기업 대 기업 거래. 구매 담당 · 실무자 · 결재권자 등 여러 사람이 의사결정에 참여한다. 개인 소비자 대상은 B2C(Business to Consumer)다.'},
 {q:'고객 여정 지도(Customer Journey Map)의 단계 순서로 맞는 것은?',o:['인지 → 고려 → 구매 → 사용 → 유지 · 재구매(추천)','구매 → 인지 → 사용 → 고려 → 유지','사용 → 구매 → 고려 → 인지 → 추천','고려 → 추천 → 인지 → 구매 → 사용'],a:0,e:'고객 여정 = 인지(Awareness) → 고려(Consideration) → 구매(Purchase) → 사용(Usage) → 유지 · 재구매 · 추천(Retention & Advocacy). 단계마다 고객이 느끼는 감정 · 기대 · 문제를 찾는 도구다.'},
 {q:'다음 중 「열린 질문」은?',o:['이용하시면서 어떤 점이 가장 불편하셨나요?','만족하셨나요? (예/아니요)','오늘 오셨나요?','이 제품을 사시겠습니까? (예/아니요)'],a:0,e:'열린 질문은 상대가 자유롭게 생각을 말하게 해 니즈를 깊이 파악한다. 닫힌 질문은 「예 / 아니요」처럼 짧은 답을 받아 사실을 확인할 때 쓴다.'}
];
function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const box=document.getElementById('quiz'),sc=document.getElementById('score');
function draw(){box.innerHTML='';let s=0;sc.textContent=0;
 Q.forEach((it,k)=>{const d=document.createElement('div');d.className='q';
  const ord=sh(it.o.map((t,i)=>i));
  d.innerHTML='<h2><span class="n">'+(k+1)+'</span>'+it.q+'</h2><div class="opts">'+ord.map(i=>'<label><input type="radio" name="q'+k+'" value="'+i+'"><span>'+it.o[i]+'</span></label>').join('')+'</div><div class="exp"><span class="res"></span>'+it.e+'</div>';
  d.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{if(d.classList.contains('done'))return;d.classList.add('done');
   const ok=+inp.value===it.a;if(ok){s++;sc.textContent=s}
   d.querySelectorAll('label').forEach(l=>{const v=+l.querySelector('input').value;if(v===it.a)l.classList.add('ok');else if(l===inp.parentElement)l.classList.add('no');l.querySelector('input').disabled=true});
   const r=d.querySelector('.res');r.textContent=ok?'정답!':'오답 — 정답은 초록 칸';r.className='res '+(ok?'ok':'no')}));
  box.appendChild(d)})}
document.getElementById('reset').addEventListener('click',()=>{draw();window.scrollTo(0,0)});
draw();
</script>
</body>
</html>
