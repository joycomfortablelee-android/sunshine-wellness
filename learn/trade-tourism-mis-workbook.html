<head>

<title>경영정보의 이해 요약노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
  :root { --ink:#14243A; --ink-2:#44566B; --ink-3:#7C8A99; --line:#DBE4EE; --navy:#17365D; --sky:#e8f1fb;
    --gold:#FFF3B0; --ground:#F4F7FB; --ok:#1f5a3f; --ok-bg:#e3f4ea; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:'Noto Sans KR',system-ui,sans-serif; font-size:14px; line-height:1.6; }
  .sheet { max-width:1120px; margin:0 auto; padding:24px 16px 56px; display:grid; gap:20px; }
  .eyebrow { display:inline-block; background:var(--gold); color:var(--navy); font-size:11px; font-weight:700; padding:2px 10px; border-radius:999px; }
  h1 { margin:6px 0 4px; font-size:clamp(20px,3vw,26px); }
  .lede { margin:0; color:var(--ink-2); }
  .tools { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; align-items:center; }
  .tools button { font:inherit; font-size:12px; font-weight:700; border:1px solid var(--navy); color:var(--navy); background:#fff; border-radius:999px; padding:3px 12px; cursor:pointer; }
  .tools button:hover { background:var(--sky); }
  .prog { margin-left:auto; font-size:12px; color:var(--ink-3); font-weight:700; }
  .prog b { color:var(--navy); }

  .grid-nav { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .grid-nav a { display:block; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; text-decoration:none; color:var(--ink); border-top:3px solid var(--navy); }
  .grid-nav a:hover { background:var(--sky); }
  .grid-nav .n { font-size:11px; font-weight:800; color:var(--navy); }
  .grid-nav .t { font-size:13px; font-weight:700; margin:3px 0 4px; }
  .grid-nav .h { font-size:11px; color:var(--ink-3); }
  @media (max-width:860px) { .grid-nav { grid-template-columns:repeat(2,1fr); } }

  .jump { display:flex; flex-wrap:wrap; gap:5px; position:sticky; top:0; background:var(--ground); padding:8px 0; z-index:5; }
  .jump a { font-size:11.5px; font-weight:700; color:var(--navy); background:#fff; border:1px solid var(--line); border-radius:7px; padding:4px 8px; text-decoration:none; }
  .jump a:hover { background:var(--sky); }

  .chap { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; scroll-margin-top:52px; }
  .chap > .head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; border-bottom:2px solid var(--navy); padding-bottom:8px; margin-bottom:10px; }
  .chap .num { font-size:20px; font-weight:800; color:var(--navy); }
  .chap h2 { margin:0; font-size:16.5px; }
  .chap .ov { margin:0 0 12px; font-size:12.5px; color:var(--ink-2); }

  .block { margin-bottom:12px; }
  .block h3 { margin:0 0 6px; font-size:12.5px; color:var(--navy); display:flex; align-items:center; gap:6px; }
  .block h3::before { content:""; width:4px; height:4px; border-radius:50%; background:var(--navy); }

  .outline { display:grid; gap:6px; }
  .outline .sec { font-size:12.5px; }
  .outline .sec b { color:var(--ink); }
  .outline .sec ul { margin:3px 0 0; padding-left:16px; color:var(--ink-2); font-size:12px; }
  .outline .sec li { margin:1px 0; }

  .terms { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:7px; }
  .term { background:var(--sky); border-radius:8px; padding:7px 10px; }
  .term b { display:block; font-size:12px; color:var(--navy); }
  .term span { font-size:11.5px; color:var(--ink-2); }

  .checks { display:grid; gap:5px; }
  .chk { display:flex; gap:7px; align-items:flex-start; font-size:12.5px; color:var(--ink-2); }
  .chk input { margin-top:3px; transform:scale(1.1); flex-shrink:0; }
  .chk.done span { color:var(--ok); text-decoration:line-through; text-decoration-color:var(--line); }

  footer.note { font-size:11.5px; color:var(--ink-3); text-align:center; padding:6px 0 0; }

  @media (max-width:860px) { .terms { grid-template-columns:1fr; } }
  @media print { .jump, .tools, .grid-nav { display:none; } .chap { break-inside:avoid; } body { background:#fff; } }
</style>
</head>

<main class="sheet">

    <div class="tools">
      <button type="button" onclick="window.print()">인쇄 / PDF</button>
      <button type="button" id="resetAll">체크 전체 지우기</button>
      <span class="prog">체크 <b id="progNum">0</b> / <span id="progMax">0</span></span>
    </div>
  </header>

  <nav class="grid-nav" id="gridNav"></nav>

  <nav class="jump" id="jump"></nav>

  <div id="chapters"></div>

  <footer class="note">차훈상 외, 「경영정보의 이해」(2판) 강의자료 기반 학습용 요약 — 무역과 관광 보강자료 · 학내 자습용</footer>
</main>

/* 체크 상태 — 이 브라우저에만(localStorage) */
const KEY = 'tradeTourismMisWorkbook_v1';
function allBoxes() { return [...document.querySelectorAll('.cb')]; }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(allBoxes().map(b => b.checked))); } catch (e) {}
}
function load() {
  let d = null; try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!Array.isArray(d)) return;
  allBoxes().forEach((b, i) => { if (d[i]) b.checked = true; });
}
function refresh() {
  const boxes = allBoxes();
  const n = boxes.filter(b => b.checked).length;
  $('progNum').textContent = n;
  $('progMax').textContent = boxes.length;
  boxes.forEach(b => b.closest('.chk').classList.toggle('done', b.checked));
}
document.addEventListener('change', e => { if (e.target.classList.contains('cb')) { refresh(); save(); } });
$('resetAll').addEventListener('click', () => {
  if (!confirm('체크한 내용을 모두 지울까요?')) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  allBoxes().forEach(b => b.checked = false);
  refresh();
});
load(); refresh();
</script>
</body>
</html>
