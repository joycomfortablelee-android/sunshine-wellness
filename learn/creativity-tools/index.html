n:left" onclick="openTool(5)"><span class="pill">06 · 아이디어</span><h3>역발상</h3><p>반대 방향에서 해결책 도출하기</p></button><button class="tile" style="text-align:left" onclick="openTool(6)"><span class="pill">07 · 공감 · 정의 · 아이디어</span><h3>마인드맵</h3><p>연상과 관계를 한눈에 정리하기</p></button><button class="tile" style="text-align:left" onclick="openTool(7)"><span class="pill">08 · 아이디어 · 프로토타입 · 테스트</span><h3>체크리스트</h3><p>핵심 질문으로 빠진 요소를 찾기</p></button><button class="tile" style="text-align:left" onclick="openTool(8)"><span class="pill">09 · 아이디어 · 실행계획</span><h3>만다라트</h3><p>한 목표를 8개 영역과 구체 행동으로 확장하기</p></button><button class="tile" style="text-align:left" onclick="openTool(9)"><span class="pill">10 · 공감 · 문제 정의</span><h3>5 Why</h3><p>표면적 증상과 근본 원인 가설 구분하기</p></button><button class="tile" style="text-align:left" onclick="openTool(10)"><span class="pill">11 · 아이디어</span><h3>유추기법</h3><p>다른 영역의 작동 원리를 관광에 적용하기</p></button><button class="tile" style="text-align:left" onclick="openTool(11)"><span class="pill">12 · 아이디어 · 프로토타입</span><h3>TRIZ</h3><p>상충하는 요구를 동시에 만족할 방법 찾기</p></button></div></div><iframe id="frame" title="도구 학습 페이지" hidden style="width:100%;height:85vh;border:1px solid #c7d6e6;border-radius:10px;background:white"></iframe></div><script>const prefix='creativity-'+document.body.dataset.tool;let fields=[...document.querySelectorAll('textarea[data-save],input[data-save]')];let storageOK=true;try{fields.forEach(el=>{let v=localStorage.getItem(prefix+'-'+el.dataset.save);if(v!==null)el.value=v;});}catch(e){storageOK=false;}fields.forEach(el=>el.addEventListener('input',()=>{try{localStorage.setItem(prefix+'-'+el.dataset.save,el.value);}catch(e){storageOK=false;}document.getElementById('status').textContent=storageOK?'이 브라우저에 임시 저장됨':'브라우저 저장 불가 · 텍스트 내보내기 사용';}));function exportWork(){const lines=[document.title,'',...fields.map(el=>(el.getAttribute('aria-label')||el.dataset.save)+'\n'+el.value+'\n')];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});let a=document.
