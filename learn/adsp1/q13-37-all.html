let current = 0;
let currentUrl = null;
const tabs = document.getElementById('rangeTabs');
const frame = document.getElementById('contentFrame');
const status = document.getElementById('status');
const prevSet = document.getElementById('prevSet');
const nextSet = document.getElementById('nextSet');

function b64ToBlobUrl(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  const blob = new Blob([bytes], {type:'text/html;charset=utf-8'});
  return URL.createObjectURL(blob);
}

function renderTabs() {
  tabs.innerHTML='';
  SOURCES.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='range-btn'+(i===current?' active':'');
    b.textContent=s.range;
    b.setAttribute('aria-label',s.title+' 보기');
    b.onclick=()=>showSet(i);
    tabs.appendChild(b);
  });
}

function showSet(i) {
  if(i<0 || i>=SOURCES.length) return;
  current=i;
  if(currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl=b64ToBlobUrl(SOURCES[current].b64);
  frame.src=currentUrl;
  renderTabs();
  status.textContent=`${current+1} / ${SOURCES.length} · ${SOURCES[current].title}`;
  prevSet.disabled=current===0;
  nextSet.disabled=current===SOURCES.length-1;
  document.title='빅데이터 '+SOURCES[current].range+' | 13~37 통합본';
}
prevSet.onclick=()=>showSet(current-1);
nextSet.onclick=()=>showSet(current+1);
window.addEventListener('beforeunload',()=>{if(currentUrl) URL.revokeObjectURL(currentUrl)});
showSet(0);
</script>
