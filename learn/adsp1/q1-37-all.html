<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADsP 1과목 · 핵심개념·기출문제 1~37 · 완전 통합본</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"NanumBarunGothic","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#eaf0f6;color:#17324d}
  body{display:flex;flex-direction:column;overflow:hidden}
  .master-header{flex:0 0 auto;background:linear-gradient(135deg,#12345B,#1F5EA8);color:#fff;padding:12px 18px 10px;box-shadow:0 5px 18px rgba(18,52,91,.18);z-index:100}
  .master-inner{max-width:1280px;margin:0 auto}
  .title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .titlebox h1{font-size:20px;margin:0 0 3px;letter-spacing:-.3px}
  .titlebox p{font-size:12.5px;margin:0;opacity:.88}
  .range-tabs{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .ch-label{font-size:11px;font-weight:850;opacity:.75;margin-left:4px}
  .ch-label:first-child{margin-left:0}
  .range-btn{border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.10);color:#fff;padding:8px 13px;border-radius:999px;font-weight:850;cursor:pointer;font-size:13px}
  .range-btn:hover{background:rgba(255,255,255,.20)}
  .range-btn.active{background:#fff;color:#17324d;border-color:#fff}
  .subnav{margin-top:9px;display:grid;grid-template-columns:110px 1fr 110px;gap:10px;align-items:center}
  .master-navbtn{border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:7px 10px;font-weight:800;cursor:pointer}
  .master-navbtn:hover:not(:disabled){background:rgba(255,255,255,.23)}
  .master-navbtn:disabled{opacity:.35;cursor:not-allowed}
  .status{text-align:center;font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .viewer{flex:1 1 auto;min-height:0;padding:8px;background:#dfe8f1}
  iframe{width:100%;height:100%;display:block;border:0;border-radius:13px;background:#fff;box-shadow:0 4px 16px rgba(18,52,91,.10)}
  @media(max-width:760px){
    .master-header{padding:10px 10px 8px}
    .titlebox h1{font-size:17px}
    .titlebox p{font-size:11.5px}
    .range-tabs{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
    .ch-label{display:none}
    .range-btn{padding:7px 5px;font-size:12px}
    .subnav{grid-template-columns:82px 1fr 82px;gap:6px}
    .master-navbtn{padding:7px 5px;font-size:12px}
    .status{font-size:11.5px}
    .viewer{padding:4px}
    iframe{border-radius:8px}
  }
  @media print{
    body{display:block;overflow:visible;background:white}
    .master-header{display:none}
    .viewer{padding:0}
    iframe{width:100%;height:100vh;box-shadow:none;border-radius:0}
  }
</style>
</head>
<body>
<header class="master-header">
  <div class="master-inner">
    <div class="title-row">
      <div class="titlebox">
        <h1>ADsP 1과목 · 핵심개념·기출문제 1~37 · 완전 통합본</h1>
        <p>1~37번 · 8개 원본(1장 셋 + 2·3장 다섯) · 내용·디자인·해설·좌우 클릭 기능 그대로 보존</p>
      </div>
      <div class="range-tabs" id="rangeTabs" aria-label="문제 범위 선택"></div>
    </div>
    <div class="subnav">
      <button class="master-navbtn" id="prevSet">← 이전 묶음</button>
      <div class="status" id="status"></div>
      <button class="master-navbtn" id="nextSet">다음 묶음 →</button>
    </div>
  </div>
</header>
<main class="viewer">
  <iframe id="contentFrame" title="ADsP 1과목 기출문제 통합 학습자료"></iframe>
</main>
<script>
// 원본 여덟 파일을 그대로 불러온다(복사본을 품지 않음) - 원본을 고치면 여기에도 바로 반영된다.
// 13~37은 q13-37-all.html에 품긴 것과 같은 파일이다(2026-09-29 줄 단위 대조, 차이 0).
const SOURCES = [
  {ch:"1장", range:"1–5",   title:"1장 1절 데이터와 정보 · 개념 그림 + 기출 1–5",      src:"1-1-data-info.html"},
  {ch:"1장", range:"6–7",   title:"1장 2절 데이터베이스 정의와 특징 · 기출 6–7",       src:"1-2-database.html"},
  {ch:"1장", range:"8–12",  title:"1장 3절 데이터베이스의 활용 · 기출 8–12",          src:"1-3-q8-12.html"},
  {ch:"2·3장", range:"13–17", title:"빅데이터 핵심개념체크 13–17",                    src:"2-1-check-13-17.html"},
  {ch:"2·3장", range:"18–21", title:"빅데이터 기출문제 18–21",                        src:"2-1-q18-21.html"},
  {ch:"2·3장", range:"22–25", title:"빅데이터 기출문제 22–25",                        src:"2-2-q22-25.html"},
  {ch:"2·3장", range:"26–29", title:"빅데이터 위기요인·비식별화 26–29",               src:"2-4-q26-29.html"},
  {ch:"2·3장", range:"30–37", title:"빅데이터 기출문제 30–37",                        src:"3-q30-37.html"}
];
let current = 0;
const tabs = document.getElementById('rangeTabs');
const frame = document.getElementById('contentFrame');
const status = document.getElementById('status');
const prevSet = document.getElementById('prevSet');
const nextSet = document.getElementById('nextSet');

function renderTabs() {
  tabs.innerHTML='';
  let lastCh='';
  SOURCES.forEach((s,i)=>{
    if(s.ch!==lastCh){
      const l=document.createElement('span');
      l.className='ch-label'; l.textContent=s.ch; tabs.appendChild(l); lastCh=s.ch;
    }
    const b=document.createElement('button');
    b.className='range-btn'+(i===current?' active':'');
    b.textContent=s.range;
    b.setAttribute('aria-label',s.title+' 보기');
    b.onclick=()=>showSet(i);
    tabs.appendChild(b);
  });
}

function showSet(i) {
  if(i<0 || i>=SOURCES.length) return;
  current=i;
  frame.src=SOURCES[current].src;
  renderTabs();
  status.textContent=`${current+1} / ${SOURCES.length} · ${SOURCES[current].title}`;
  prevSet.disabled=current===0;
  nextSet.disabled=current===SOURCES.length-1;
  document.title='ADsP 1과목 '+SOURCES[current].range+' | 1~37 통합본';
  history.replaceState(null,'','#'+SOURCES[current].range.replace('–','-'));
}
prevSet.onclick=()=>showSet(current-1);
nextSet.onclick=()=>showSet(current+1);
// 주소 끝 #13-17 처럼 범위를 붙이면 그 묶음부터 연다
const start = SOURCES.findIndex(s=>'#'+s.range.replace('–','-')===decodeURIComponent(location.hash));
showSet(start>=0?start:0);
</script>
</body>
</html>
