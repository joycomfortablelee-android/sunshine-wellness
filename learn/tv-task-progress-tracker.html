function readDb(){
  return new Promise((resolve,reject)=>{
    const request=db.transaction('workspace','readonly').objectStore('workspace').get('records');
    request.onsuccess=()=>resolve(request.result||blank());
    request.onerror=()=>reject(request.error);
  });
}
function writeDb(value,revision){
  return new Promise((resolve,reject)=>{
    if(!db){reject(new Error('이 브라우저에서 저장소를 열 수 없습니다.'));return;}
    const transaction=db.transaction('workspace','readwrite');
    const store=transaction.objectStore('workspace');
    const request=store.get('records');
    let conflict=false;
    request.onsuccess=()=>{
      if((request.result?.revision||0)!==revision){conflict=true;transaction.abort();return;}
      store.put(value,'records');
    };
    transaction.oncomplete=resolve;
    transaction.onabort=()=>reject(new Error(conflict?'다른 탭에 새 기록이 저장되었습니다. 입력값을 복사한 뒤 이 페이지를 새로고침해 주세요.':(transaction.error?.message||'저장에 실패했습니다.')));
  });
}

function embeddedData(root){
  const prefix=/window\.__DATA__\s*=\s*/;
  for(const script of root.querySelectorAll('script')){
    const text=script.textContent;
    const match=prefix.exec(text);
    if(!match)continue;
    const start=match.index+match[0].length;
    if(text[start]!=='[')continue;
    let depth=0,quoted=false,escaped=false;
    for(let i=start;i<text.length;i++){
      const c=text[i];
      if(quoted){if(escaped)escaped=false;else if(c==='\\')escaped=true;else if(c==='"')quoted=false;continue;}
      if(c==='"')quoted=true;
      else if(c==='[')depth++;
      else if(c===']'&&--depth===0)return JSON.parse(text.slice(start,i+1));
    }
    throw new Error('기존 작성형 HTML의 자료 블록을 읽을 수 없습니다.');
  }
  return null;
}
function sectionLines(section){
  return section.blocks.flatMap(b=>{
    if(b.type==='table'&&Array.isArray(b.rows))return b.rows.filter(Array.isArray).map(row=>row.filter(x=>typeof x==='string').join(' | '));
    return typeof b.text==='string'?[b.text]:[];
  }).filter(Boolean);
}
function fingerprint(value){
  let hash=2166136261;
  for(let i=0;i<value.length;i++)hash=Math.imul(hash^value.charCodeAt(i),16777619);
  return value.length+':'+(hash>>>0).toString(36);
}
function legacyDocument(file,student,attachment){

async function parseLegacy(file){

    const sections=Object.fromEntries(exported.map(el=>[el.dataset.section,cleanText(el)]));
    const checkGroups=Object.fromEntries(Object.entries(sections).map(([f,text])=>[f,checkLines(text.split('\n'))]));
    return [{name,project,doc:{id:id(),title:project+' · 학생별 작성본',kind:'draft',code:'',text:'기존 작성형 HTML의 내보내기 파일입니다. 제안 초안과 미확인 항목의 표기를 참고하세요.',sections,checkGroups,legacy:fingerprint(title+JSON.stringify(sections)),name:file.name,size:file.size,data:await toData(file)}}];
  }

  if(!recordLike(x)||x.version!==1||!Array.isArray(x.students)||!Array.isArray(x.docs)||!Array.isArray(x.logs)||!recordLike(x.tasks))return false;
  const ids=new Set();
  for(const s of x.students){
    if(!recordLike(s)||!keySafe(s.id)||ids.has(s.id)||!str(s.name,240)||!s.name.trim()||!str(s.project,400))return false;
    ids.add(s.id);
  }
  for(const [key,t] of Object.entries(x.tasks)){
    const [sid,f,...rest]=key.split('|');
    if(rest.length||!ids.has(sid)||!Object.hasOwn(formBy,f)||!recordLike(t)||!Object.hasOwn(statuses,t.status)||!['basis',...Object.keys(fields)].every(k=>str(t[k]))||typeof t.gapsResolved!=='boolean'||typeof t.riskResolved!=='boolean'||!Array.isArray(t.resolved)||!t.resolved.every(r=>str(r,240)))return false;
  }
  const docIds=new Set();
  for(const d of x.docs){
    if(!recordLike(d)||!keySafe(d.id)||docIds.has(d.id)||!str(d.title,500)||!str(d.name,500)||!Object.hasOwn(kinds,d.kind)||!(d.studentId===''||ids.has(d.studentId))||!(d.code===''||Object.hasOwn(formBy,d.code))||!str(d.text)||!recordLike(d.sections)||!recordLike(d.checkGroups)||!str(d.data,17*1024*1024))return false;
    if(d.data&&!/^data:[^,]{0,200};base64,[a-z0-9+/=]*$/i.test(d.data))return false;
    if(!Object.entries(d.sections).every(([f,text])=>Object.hasOwn(formBy,f)&&str(text))||!Object.entries(d.checkGroups).every(([f,a])=>Object.hasOwn(formBy,f)&&Array.isArray(a)&&a.every(p=>str(p))))return false;
    docIds.add(d.id);
  }
  const logIds=new Set();
  for(const l of x.logs){
    if(!recordLike(l)||!keySafe(l.id)||logIds.has(l.id)||!Object.hasOwn(weeks,l.week)||!str(l.date,10)||!/^\d{4}-\d{2}-\d{2}$/.test(l.date)||!str(l.text)||!(l.studentId===''||ids.has(l.studentId))||!(l.code===''||Object.hasOwn(formBy,l.code))||!(l.status===''||Object.hasOwn(statuses,l.status)))return false;
    logIds.add(l.id);
  }
  return true;
}
async function prepareRestore(file){
  if(file.size>100*1024*1024)throw new Error('100 MB 이하의 진도관리 백업을 선택해 주세요.');
  const parsed=JSON.parse(await file.text());
  if(parsed.format!=='silla-venture-progress'||!validBackup(parsed.workspace))throw new Error('이 진도관리 웹앱에서 만든 정상적인 백업 파일을 선택해 주세요.');
  const value=parsed.workspace;
  const form=showDialog('백업 복원','현재 작업 기록 전체를 선택한 백업으로 교체합니다.',
    '<div class="callout warn">복원할 기록 · 학생 '+value.students.length+'명, 자료 '+value.docs.length+'건, 점검 '+value.logs.length+'건</div><label class="tick"><input type="checkbox" required>현재 작업 기록을 이 백업으로 교체합니다.</label>',
    '백업으로 교체');
  modalSubmit(form,async()=>{
    await mutate(state=>{
      state.students=value.students;state.tasks=value.tasks;state.docs=value.docs;state.logs=value.logs;
    });
    selected='';code='3-1';view='board';finish('백업을 복원했습니다.');
  });
}
function deleteDialog(type,recordId){
  const isDoc=type==='doc';
  const row=(isDoc?current().docs:current().logs).find(x=>x.id===recordId);
  if(!row)return;
  const form=showDialog(isDoc?'자료 삭제':'점검 기록 삭제',isDoc?'이 자료와 여기에서 가져온 확인 항목을 제거합니다.':'선택한 점검 기록을 제거합니다.',
    '<div class="callout warn wrap">'+h(row.title||row.text.slice(0,180))+'</div>','삭제');
  modalSubmit(form,async()=>{
    await mutate(state=>{
      if(isDoc){
        state.docs=state.docs.filter(x=>x.id!==recordId);
        for(const t of Object.values(state.tasks))t.resolved=t.resolved.filter(r=>!r.startsWith(recordId+':'));
      }else state.logs=state.logs.filter(x=>x.id!==recordId);
    });
    finish('선택한 기록을 삭제했습니다.');
  });
}
const actions={
  go:({view:destination})=>go(destination),
  'add-student':()=>studentDialog(),
  'edit-student':({sid})=>studentDialog(sid),
  'open-task':({sid,code:f})=>{selected=sid;code=f;go('student');},
  'add-log':({sid,code:f})=>logDialog({sid,formCode:f}),
  'edit-log':({log})=>logDialog({logId:log}),
  'remove-log':({log})=>deleteDialog('log',log),
  'import-source':()=>importDialog(),
  'add-doc':({sid,code:f,kind})=>docDialog({sid,formCode:f,kind}),
  'edit-doc':({doc})=>docDialog({docId:doc}),
  'view-doc':({doc,code:f})=>showDoc(doc,f),
  'remove-doc':({doc})=>deleteDialog('doc',doc),
  'download-doc':({doc})=>downloadAttachment(doc),
  close:()=>$('#dialog').close(),
  'filter-status':({status})=>{
    filters.board.status=filters.board.status===status?'':status;render();$('#board-panel').scrollIntoView({block:'nearest'});$('#board-panel select[data-filter="status"]').focus({preventScroll:true});
  },
  'filter-code':({code:f})=>{
    filters.board.code=filters.board.code===f?'':f;
    if(filters.board.week&&String(formBy[f].week)!==filters.board.week)filters.board.week='';
    go('board',false);$('#board-panel').scrollIntoView({block:'start'});$('#board-panel select[data-filter="code"]').focus({preventScroll:true});
  },
  'filter-week':({week})=>{
    filters.board.week=week;filters.board.code='';
    go('board',false);$('#board-panel').scrollIntoView({block:'start'});$('#board-panel select[data-filter="week"]').focus({preventScroll:true});
  },
  'reset-filter':()=>{
    for(const key of Object.keys(filters[view]))filters[view][key]='';
    render();$('#page [data-filter=q]').focus();
  },
  'toggle-demo':()=>{
    if(writing)return;
    demo=!demo;if(demo)example??=sample();
    for(const group of Object.values(filters))for(const k of Object.keys(group))group[k]='';
    selected='';code='3-1';go('board');
  },
  backup:()=>{
    if(demo){toast('예시를 종료한 뒤 실제 기록을 백업할 수 있습니다.');return;}
    download('관광벤처창업론_진도관리_'+dateInKorea()+'.json',new Blob([JSON.stringify({format:'silla-venture-progress',workspace:actual})],{type:'application/json'}));
  },
  restore:()=>{if(demo){toast('예시를 종료한 뒤 실제 기록을 복원할 수 있습니다.');return;}$('#restore').click();}
};
document.addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');
  if(!button)return;
  const action=actions[button.dataset.action];
  if(action)try{await action(button.dataset);}catch(error){toast(error.message);}
});
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.dataset.filter==='q'){filters[view].q=el.value;updateResults();return;}
  const form=el.closest('#task-form');
  if(!form)return;
  if(el.name==='gaps'||el.name==='risk'){
    const previous=task(selected,code);
    if(el.value.trim()!==previous[el.name])form.elements.namedItem(el.name+'Resolved').checked=false;
  }
  const info=stateFor(selected,code,taskFromForm(form,task(selected,code)));
  $('#active-badge').innerHTML=badge(info.status);
  $('#task-reasons').textContent=info.reasons.join(' ');
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.dataset.filter&&el.dataset.filter!=='q'){
    filters[view][el.dataset.filter]=el.value;
    if(view==='board'&&el.dataset.filter==='week'&&filters.board.code&&el.value&&String(formBy[filters.board.code].week)!==el.value){
      filters.board.code='';$('#page [data-filter=code]').value='';
    }
    if(view==='board'&&el.dataset.filter==='code'&&el.value&&filters.board.week&&String(formBy[el.value].week)!==filters.board.week){
      filters.board.week='';$('#page [data-filter=week]').value='';
    }
    updateResults();
  }
  if(el.dataset.change==='student'){selected=el.value;render();$('#page [data-change=student]').focus();}
});
document.addEventListener('submit',async event=>{
  const form=event.target;
  if(form.id!=='task-form')return;
  event.preventDefault();
  const sid=selected,f=code,t=taskFromForm(form,task(sid,f));
  const button=form.querySelector('button[type=submit]');
  if(button.disabled)return;
  button.disabled=true;
  try{
    await mutate(state=>{state.tasks[taskKey(sid,f)]=t;});
    render();
    if(view==='student'&&selected===sid&&code===f)$('#task-form button[type=submit]').focus({preventScroll:true});
    toast('과제 기록을 저장했습니다. 현재 상태는 '+statuses[stateFor(sid,f).status]+'입니다.');
  }catch(error){toast(error.message);}
  finally{button.disabled=false;}
});
$('#restore').addEventListener('change',async event=>{
  const file=event.target.files[0];event.target.value='';
  if(file)try{await prepareRestore(file);}catch(error){toast('백업을 열 수 없습니다. '+error.message);}
});
function setup(){
  $('#brand-icon').innerHTML=icon('mark');$('#crumb-icon').innerHTML=icon('arrow');
  $('#top-add').insertAdjacentHTML('afterbegin',icon('plus'));$('#top-import').insertAdjacentHTML('afterbegin',icon('upload'));
  for(const [key,[glyph,label]] of Object.entries(views)){
    $(key==='guide'||key==='data'?'#nav-tools':'#nav-main').insertAdjacentHTML('beforeend','<button type="button" class="nav" data-action="go" data-view="'+key+'">'+icon(glyph)+label+'</button>');
  }
}
async function init(){
  setup();
  try{db=await openDb();actual=await readDb();}
  catch(error){$('#store-chip').textContent='저장소 사용 불가';toast('브라우저 저장소를 열 수 없습니다. 다른 브라우저 창이나 Sites 주소에서 다시 열어 주세요.');}
  render();
}
init();
</script>
