<script id="dataset" type="application/json">[{"id":1,"category":"Business","en":"Founder","ko":"창업자·설립자","definition":"사업 아이디어를 실제 조직과 사업으로 출범시킨 사람이다.","example":"지역 관광 예약 플랫폼을 만들고 사업자 등록과 첫 서비스를 시작한 사람이 Founder다.","note":"아이디어 보유자와 실제 설립자는 구분한다.","page":"2","extra":false,"pron":"파운더"},{"id":2,"category":"Business","en":"Wantrepreneur","ko":"예비 창업 희망자","definition":"창업에 관심과 아이디어는 있지만 아직 실행에 옮기지 않은 사람을 가리킨다.","example":"로컬 투어 아이디어를 노트에 정리했지만 고객 인터뷰와 시범 판매는 아직 시작하지 않은 상태다.","note":"창업의 차이는 ‘실행 여부’에서 드러난다.","page":"2","extra":false,"pron":"원트러프러너"},{"id":3,"category":"Business","en":"Non-technical Founder","ko":"비기술 창업자","definition":"프로그래밍보다 사업개발, 영업, 마케팅, 조직 운영에 전문성이 있는 창업자다.","example":"여행 코스 기획과 호텔 제휴를 맡고 앱 개발은 기술 공동창업자와 협력한다.","note":"비기술 창업자도 제품과 고객을 이해해야 한다.","page":"2","extra":false,"pron":"논 테크니컬 파운더"},{"id":4,"category":"Business","en":"Validation","ko":"사업 타당성 검증","definition":"시장·고객·제품·경쟁·재무 가정을 자료와 실험으로 확인하는 과정이다.","example":"친환경 여행상품을 출시하기 전에 여행객 30명을 인터뷰하고 예약 의향과 예상 지불가격을 확인한다.","note":"“고객이 실제로 원하는가?”가 핵심 질문이다.","page":"2","extra":false,"pron":"밸리데이션"},{"id":5,"category":"Business","en":"Scalability","ko":"확장성","definition":"수요가 커질 때 비용과 운영 부담을 지나치게 늘리지 않고 서비스를 확대할 수 있는 능력이다.","example":"도보 해설 서비스 예약이 하루 20건에서 200건으로 늘어도 자동 예약 시스템으로 대응한다.","note":"성장 가능성과 이를 감당하는 구조를 함께 본다.","page":"3","extra":false,"pron":"스케일러빌리티"},{"id":6,"category":"Business","en":"Accelerator","ko":"액셀러레이터","definition":"초기 스타트업의 빠른 성장과 투자 유치를 위해 멘토링·네트워크·프로그램을 제공하는 조직이다.","example":"관광 스타트업이 12주 육성 프로그램에서 고객 확보 전략을 다듬고 데모데이에서 발표한다.","note":"성장 가속과 투자 연결이 중심이다.","page":"3","extra":false,"pron":"액셀러레이터"},{"id":7,"category":"Business","en":"Incubator","ko":"인큐베이터","definition":"창업 초기에 필요한 공간·교육·자문 등 기초적인 정착과 사업화를 지원하는 조직이다.","example":"대학 창업보육센터가 예비 창업팀에 사무공간과 사업자 등록·특허 자문을 제공한다.","note":"초기 생존과 사업 기반 마련에 초점이 있다.","page":"3","extra":false,"pron":"인큐베이터"},{"id":8,"category":"Business","en":"Dragon","ko":"드래곤 기업","definition":"한 번의 투자 유치 라운드에서 10억 달러 이상의 자금을 조달한 기업을 가리키는 용어다.","example":"어떤 비상장 플랫폼 기업이 단일 투자 라운드에서 12억 달러를 유치했다면 이 범주에 해당한다.","note":"기업가치가 아니라 ‘한 번에 유치한 투자액’을 본다.","page":"4","extra":false,"pron":"드래건"},{"id":9,"category":"Business","en":"Bootstrapping","ko":"자체 자금 창업","definition":"외부 지분 투자에 의존하지 않고 창업자 자금이나 사업 매출로 사업을 운영하는 방식이다.","example":"작은 지역 체험 상품을 개인 저축과 초기 매출을 활용해 운영한다.","note":"지분을 지킬 수 있지만 성장 자금에는 제약이 있을 수 있다.","page":"4","extra":false,"pron":"부트스트래핑"},{"id":10,"category":"Business","en":"Iteration","ko":"반복 개선","definition":"고객 피드백을 받아 제품·타깃·사업모델의 일부를 조금씩 개선하는 과정이다.","example":"투어 앱 예약 화면을 고객 의견에 따라 세 번 수정해 이탈을 줄인다.","note":"핵심 방향을 유지한 채 작은 변화를 반복한다.","page":"4","extra":false,"pron":"이터레이션"},{"id":11,"category":"Business","en":"Pivot","ko":"사업 방향 전환","definition":"검증 결과에 따라 핵심 고객, 제품 또는 사업모델의 중요한 방향을 바꾸는 결정이다.","example":"여행 일정 추천 앱에서 수요가 적어 호텔용 B2B 일정 관리 도구로 전환한다.","note":"작은 수정이 아니라 핵심 전략의 변화다.","page":"4","extra":false,"pron":"피벗"},{"id":12,"category":"Business","en":"Unicorn","ko":"유니콘 기업","definition":"기업가치가 10억 달러 이상으로 평가된 비상장 스타트업을 뜻한다.","example":"비상장 관광 기술회사의 투자 후 기업가치가 11억 달러로 평가된 상황을 생각해 보자.","note":"기업가치 기준이며 실제 투자액과 다르다.","page":"4","extra":false,"pron":"유니콘"},{"id":13,"category":"Business","en":"Disruption","ko":"파괴적 혁신","definition":"기존의 경쟁 방식과 시장 구조를 바꾸는 새로운 사업 접근이나 혁신을 말한다.","example":"개인 가이드와 관광객을 직접 연결하는 서비스가 전통적인 여행상품 유통방식을 바꾼다.","note":"단순한 신제품 출시와 시장구조 변화는 다르다.","page":"5","extra":false,"pron":"디스럽션"},{"id":14,"category":"Business","en":"MVP","ko":"최소기능제품","definition":"가장 중요한 가설을 고객과 시험할 수 있도록 필수 기능만 갖춘 초기 제품이다.","example":"완성된 앱 대신 예약 신청서와 결제 링크로 야간 도보 투어를 1주일간 시험 운영한다.","note":"처음부터 완벽한 제품을 만들 필요는 없다.","page":"5","extra":false,"pron":"엠브이피"},{"id":15,"category":"Business","en":"Lean Startup","ko":"린 스타트업","definition":"만들기–측정하기–학습하기의 반복으로 고객 가설을 빠르게 검증하는 창업 접근이다.","example":"웰니스 상품의 소규모 시범 운영 후 만족도와 재구매 의향을 분석해 개선한다.","note":"빠른 검증과 학습이 목적이다.","page":"5","extra":false,"pron":"린 스타트업"},{"id":16,"category":"Business","en":"Agile","ko":"애자일","definition":"변화에 신속히 대응하기 위해 짧은 실행 주기와 협업·피드백을 강조하는 업무 방식이다.","example":"관광 앱 팀이 2주마다 기능을 점검하고 사용자 반응에 따라 다음 작업 우선순위를 정한다.","note":"빠른 적응과 협력이 핵심이다.","page":"5","extra":false,"pron":"애자일"},{"id":17,"category":"Business","en":"Exit","ko":"투자 회수·엑싯","definition":"투자자나 창업자가 인수합병(M&A), 기업공개(IPO) 등으로 투자 성과를 실현하는 과정이다.","example":"성장한 여행 기술 스타트업을 대기업이 인수하면서 초기 투자자가 보유 지분을 매각한다.","note":"기업 운영 종료만을 뜻하는 것은 아니다.","page":"6","extra":false,"pron":"엑시트"},{"id":18,"category":"Business","en":"SaaS","ko":"서비스형 소프트웨어","definition":"소프트웨어를 설치·구매하는 대신 온라인 구독이나 이용 방식으로 제공하는 모델이다.","example":"게스트하우스가 월 구독료를 내고 온라인 예약·고객관리 소프트웨어를 쓴다.","note":"제품 자체보다 지속적인 서비스 이용에 가깝다.","page":"6","extra":false,"pron":"사스"},{"id":19,"category":"Business","en":"PaaS","ko":"서비스형 플랫폼","definition":"개발자가 직접 서버 환경 전체를 구축하지 않고 애플리케이션 개발·배포 플랫폼을 이용하는 방식이다.","example":"창업팀이 클라우드 플랫폼에서 관광 정보 앱을 개발하고 서비스를 배포한다.","note":"개발·운영을 위한 기반 환경을 제공한다.","page":"6","extra":false,"pron":"파스"},{"id":20,"category":"Business","en":"Acqui-hire","ko":"인재 확보형 인수","definition":"제품이나 시장보다 특정 팀의 역량과 인재를 확보하려고 회사를 인수하는 방식이다.","example":"대형 여행사가 AI 추천 기술팀을 확보하기 위해 작은 개발 스타트업을 인수한다.","note":"인수 목적이 ‘팀과 인재’에 있다.","page":"6","extra":false,"pron":"애퀴하이어"},{"id":21,"category":"Business","en":"Alpha Release","ko":"알파 버전","definition":"정식 출시 전 내부 팀을 중심으로 기능과 문제점을 시험하는 초기 버전이다.","example":"투어 예약 앱을 직원과 개발팀이 사용해 예약 오류를 점검한다.","note":"초기 내부 테스트 성격이 강하다.","page":"7","extra":false,"pron":"알파 릴리스"},{"id":22,"category":"Business","en":"Beta Release","ko":"베타 버전","definition":"정식 출시 전 제한된 외부 사용자에게 사용성을 시험받고 의견을 수집하는 버전이다.","example":"지역 대학생 100명이 관광 앱 시험판을 사용하고 불편한 점을 제출한다.","note":"외부 사용자 관점에서 마지막 문제를 찾는다.","page":"7","extra":false,"pron":"베타 릴리스"},{"id":23,"category":"Business","en":"Board of Directors","ko":"이사회","definition":"기업의 주요 의사결정과 경영 활동을 감독하는 조직이다.","example":"여행 스타트업 이사회가 대규모 투자와 신규 시장 진출 계획을 검토한다.","note":"자문 멘토단과 법적 역할의 이사회는 다르다.","page":"7","extra":false,"pron":"보드 오브 디렉터스"},{"id":24,"category":"Business","en":"Business Development","ko":"사업개발","definition":"새로운 고객·파트너·매출 기회를 발굴하고 협력 관계를 구축하는 활동이다.","example":"관광 플랫폼이 호텔 체인과 입장권 제휴를 체결해 판매 채널을 확대한다.","note":"파트너십과 사업 성장 기회 발굴이다.","page":"7","extra":false,"pron":"비즈니스 디벨롭먼트"},{"id":25,"category":"Business","en":"Business Model Canvas","ko":"비즈니스 모델 캔버스","definition":"고객군·가치제안·채널·수익원·비용구조 등 사업의 핵심 요소를 한 장에 정리하는 도구다.","example":"지역 투어 스타트업이 고객군을 외국인 여행객으로, 수익원을 예약 수수료로 적는다.","note":"사업의 9개 구성요소를 연결해 본다.","page":"8","extra":false,"pron":"비즈니스 모델 캔버스"},{"id":26,"category":"Business","en":"Hockey Stick Growth","ko":"하키스틱 성장","definition":"초기에는 완만하다가 어느 시점부터 매출·이용자 등의 지표가 가파르게 증가하는 성장 양상이다.","example":"월 예약 건수가 30→40→55건이다가 시장 적합성 확보 뒤 180→450건으로 늘어난다.","note":"그래프 모양이 하키스틱을 닮았다.","page":"8","extra":false,"pron":"하키 스틱 그로스"},{"id":27,"category":"Business","en":"Pitch Deck","ko":"투자 발표자료","definition":"창업 아이템·시장·비즈니스 모델·성과·팀·자금 활용계획을 투자자에게 설명하는 발표자료다.","example":"창업팀이 10장 안팎의 슬라이드로 여행 서비스의 고객 문제와 예상 매출을 발표한다.","note":"짧고 설득력 있는 투자용 이야기다.","page":"8","extra":false,"pron":"피치 덱"},{"id":28,"category":"Business","en":"Freemium","ko":"부분 무료·유료 전환 모델","definition":"기본 기능을 무료로 제공하고 고급 기능이나 추가 혜택에는 요금을 부과하는 전략이다.","example":"기본 관광 일정 생성은 무료, 동행자 공유와 오프라인 지도는 유료로 제공한다.","note":"무료 이용자를 유료 고객으로 전환한다.","page":"8","extra":false,"pron":"프리미엄"},{"id":29,"category":"Business","en":"Value Proposition","ko":"가치제안","definition":"고객이 왜 우리 제품을 선택해야 하는지 설명하는 차별적인 편익과 문제 해결의 약속이다.","example":"“예약부터 이동까지 3분이면 끝나는 휠체어 접근성 여행 코스”를 제안한다.","note":"기능보다 ‘고객이 얻는 가치’를 표현한다.","page":"9","extra":false,"pron":"밸류 프로퍼지션"},{"id":30,"category":"Business","en":"Consumer Product","ko":"소비자 대상 제품","definition":"기업이 개인 소비자를 최종 이용자로 상정해 제공하는 상품 또는 서비스다.","example":"여행객이 직접 구매하는 스마트 여행 일정 앱이 이에 해당한다.","note":"B2C 고객을 대상으로 한다.","page":"9","extra":false,"pron":"컨슈머 프로덕트"},{"id":31,"category":"Business","en":"Enterprise Product","ko":"기업 대상 제품","definition":"다른 기업이 사업 운영에 사용하도록 제공하는 상품 또는 서비스다.","example":"호텔이 직원 교대와 객실 판매량을 관리하는 소프트웨어를 구매한다.","note":"B2B 조직 고객을 대상으로 한다.","page":"9","extra":false,"pron":"엔터프라이즈 프로덕트"},{"id":32,"category":"Business","en":"Competitive Advantage","ko":"경쟁우위","definition":"경쟁자보다 고객에게 더 우수하거나 차별적인 가치를 제공할 수 있는 상대적 강점이다.","example":"지역 가이드 네트워크와 독점 콘텐츠를 보유해 다른 투어 업체보다 예약 만족도를 높인다.","note":"가격만이 아니라 경험·지식·네트워크도 차별점이다.","page":"9","extra":false,"pron":"컴페티티브 어드밴티지"},{"id":33,"category":"Business","en":"Hackers","ko":"기술 개발 인재","definition":"스타트업에서 프로그램과 기술 문제 해결 역량을 가진 개발자를 가리키는 비공식적 표현이다.","example":"모바일 결제 오류를 고치고 예약 시스템을 구현하는 개발팀 구성원을 뜻한다.","note":"여기서는 불법 침입자가 아니라 개발 역량을 뜻한다.","page":"10","extra":false,"pron":"해커스"},{"id":34,"category":"Business","en":"Intellectual Property","ko":"지식재산권","definition":"특허·상표·저작권 등 창작과 기술 성과를 법적으로 보호하는 권리다.","example":"관광 브랜드의 이름을 상표로 등록하고 자체 제작 가이드 음성 콘텐츠의 권리를 관리한다.","note":"아이디어만이 아니라 보호 대상과 권리 요건을 확인한다.","page":"10","extra":false,"pron":"인텔렉추얼 프로퍼티"},{"id":35,"category":"Business","en":"Customer Development","ko":"고객 개발","definition":"고객을 탐색하고 인터뷰·실험을 통해 문제, 수요, 구매 행동에 관한 가설을 검증하는 과정이다.","example":"외국인 여행객 20명에게 야간 이동 불편을 듣고 해결책의 구매 의사를 시험한다.","note":"제품 개발 전후 모두 고객을 직접 확인한다.","page":"10","extra":false,"pron":"커스터머 디벨롭먼트"},{"id":36,"category":"Business","en":"Product–Market Fit","ko":"제품–시장 적합성","definition":"제품이 특정 시장의 중요한 수요를 충분히 충족해 고객 반응과 성장 가능성이 확인된 상태다.","example":"도보 관광 앱의 재사용률과 유료 예약이 꾸준히 늘어나 수요가 검증된다.","note":"좋은 아이디어만으로 적합성이 확정되는 것은 아니다.","page":"10","extra":false,"pron":"프로덕트 마켓 핏"},{"id":37,"category":"Design","en":"User Interface (UI)","ko":"사용자 인터페이스","definition":"사용자가 화면에서 보고 조작하는 버튼·메뉴·입력창 등의 접점을 뜻한다.","example":"관광 앱의 ‘여행 시작’ 버튼, 지도 메뉴, 예약 달력이 UI다.","note":"사용자가 직접 마주하는 화면과 조작 요소다.","page":"12","extra":false,"pron":"유저 인터페이스, 유아이"},{"id":38,"category":"Design","en":"User Experience (UX)","ko":"사용자 경험","definition":"고객이 제품을 알고 사용하고 평가하는 전 과정에서 느끼는 총체적 경험이다.","example":"예약 검색부터 결제, 알림, 현장 입장까지 불편함 없이 이어지는 여행 앱 경험이다.","note":"화면 디자인만이 아니라 전체 이용 여정을 포함한다.","page":"12","extra":false,"pron":"유저 익스피리언스, 유엑스"},{"id":39,"category":"Design","en":"Usability","ko":"사용성","definition":"사용자가 목표한 일을 효과적이고 효율적이며 쉽게 수행할 수 있는 정도다.","example":"어르신이 관광 앱에서 설명 없이도 입장권을 구매할 수 있는지 평가한다.","note":"원문은 ‘유용성’으로 표기했으며 수업에서는 ‘사용성’으로 설명한다.","page":"12","extra":false,"pron":"유저빌리티"},{"id":40,"category":"Design","en":"Accessibility","ko":"접근성","definition":"다양한 신체·인지·기술 환경의 사람들이 제품과 기능을 이용할 수 있는 정도다.","example":"저시력 이용자를 위해 큰 글자와 음성 안내가 제공되는 예약 서비스다.","note":"사용하기 쉬운 것과 누구나 접근 가능한 것은 구분한다.","page":"12","extra":false,"pron":"액세서빌리티"},{"id":41,"category":"Design","en":"Wireframing","ko":"와이어프레이밍","definition":"색상·세부 디자인 전에 화면 구조와 정보 배치를 단순한 도식으로 설계하는 과정이다.","example":"관광 앱의 첫 화면에 검색창·지역 선택·예약 버튼의 위치를 사각형으로 그려 본다.","note":"화면의 골격을 검토한다.","page":"13","extra":false,"pron":"와이어프레이밍"},{"id":42,"category":"Design","en":"Interaction Design","ko":"인터랙션 디자인","definition":"사용자의 행동에 시스템이 어떻게 반응하며 과업을 진행시키는지 설계하는 분야다.","example":"숙박 날짜를 누르면 가격이 즉시 변하고 예약 오류를 친절하게 알려주는 흐름을 설계한다.","note":"행동과 반응의 연결을 설계한다.","page":"13","extra":false,"pron":"인터랙션 디자인"},{"id":43,"category":"Finance","en":"Angel Investor","ko":"엔젤 투자자","definition":"초기 기업에 개인 자금을 투자하고 경험이나 인적 네트워크로 성장에 도움을 주는 투자자다.","example":"지역 체험 스타트업에 개인 투자자가 초기 자금을 투자하고 마케팅 멘토링을 제공한다.","note":"창업 초기의 개인 투자자다.","page":"15","extra":false,"pron":"엔젤 인베스터"},{"id":44,"category":"Finance","en":"Venture Capital (VC)","ko":"벤처캐피털","definition":"성장 가능성이 높은 비상장 기업 등에 전문적으로 투자하는 투자기관 또는 자금이다.","example":"관광 플랫폼의 성장성을 평가한 VC가 지분 투자에 참여한다.","note":"개인 엔젤과 달리 전문 투자조직 중심이다.","page":"15","extra":false,"pron":"벤처 캐피털, 브이씨"},{"id":45,"category":"Finance","en":"Seed Funding","ko":"시드 투자","definition":"사업 아이디어의 구체화·초기 개발·시제품 제작에 필요한 창업 초기 자금이다.","example":"친환경 여행 키트를 시험 제작하기 위해 3천만 원의 초기 자금을 유치한다.","note":"제품과 수요를 확인하기 위한 출발 자금이다.","page":"15","extra":false,"pron":"시드 펀딩"},{"id":46,"category":"Finance","en":"Series A / B / C","ko":"시리즈 단계 투자","definition":"기업 성장 단계에 따라 순차적으로 진행되는 자금조달 라운드의 관행적 명칭이다.","example":"시장 검증 이후 시리즈 A로 사업을 확대하고, 후속 라운드로 국내외 시장에 진출한다.","note":"단계 명칭과 사용 목적은 기업별로 달라질 수 있다.","page":"16","extra":false,"pron":"시리즈 에이·비·씨"},{"id":47,"category":"Finance","en":"Cash Flow","ko":"현금흐름","definition":"일정 기간 기업에 실제로 들어오고 나가는 현금의 이동이다.","example":"여행상품 매출은 늘었지만 호텔 선결제 금액이 커서 현금 잔고가 부족할 수 있다.","note":"매출이나 회계이익과 현금 잔액은 다르다.","page":"16","extra":false,"pron":"캐시 플로"},{"id":48,"category":"Finance","en":"Pre-money Valuation","ko":"투자 전 기업가치","definition":"이번 투자금이 들어오기 전에 평가한 회사의 가치다.","example":"투자 전 스타트업 가치가 8억 원으로 협의되었다면 프리머니는 8억 원이다.","note":"투자 이전을 기준으로 본 기업가치다.","page":"16","extra":false,"pron":"프리 머니 밸류에이션"},{"id":49,"category":"Finance","en":"Post-money Valuation","ko":"투자 후 기업가치","definition":"투자 전 기업가치에 새로 유입되는 투자액을 반영한 투자 후 평가가치다.","example":"프리머니 8억 원에 신규 투자 2억 원이 들어오면 포스트머니는 10억 원이다.","note":"단순 신규 현금 투자 사례에서는 두 값을 더한다.","page":"17","extra":false,"pron":"포스트 머니 밸류에이션"},{"id":50,"category":"Finance","en":"Burn Rate","ko":"현금 소진 속도","definition":"일정 기간 사업 운영으로 현금이 순감소하는 정도를 측정한 지표다.","example":"매달 현금 잔액이 평균 500만 원씩 줄어들면 월 순번레이트를 500만 원으로 볼 수 있다.","note":"얼마나 빠르게 현금이 줄어드는지 본다.","page":"17","extra":false,"pron":"번 레이트"},{"id":51,"category":"Finance","en":"Cap Table","ko":"지분 구조표","definition":"창업자·직원·투자자 등이 기업 주식과 지분을 얼마나 보유하는지 정리한 표다.","example":"창업자 70%, 공동창업자 20%, 투자자 10%인 지분 관계를 표로 관리한다.","note":"투자 후 지분 희석을 확인하는 핵심 자료다.","page":"17","extra":false,"pron":"캡 테이블"},{"id":52,"category":"Finance","en":"Crowdfunding","ko":"크라우드펀딩","definition":"온라인 플랫폼 등을 통해 다수의 개인에게서 소액 자금을 모으는 방식이다.","example":"지역 축제 굿즈의 시제품 제작비를 후원형 펀딩으로 모은다.","note":"원문 표기의 철자를 표준 철자인 Crowdfunding으로 표시했다.","page":"17","extra":false,"pron":"크라우드펀딩"},{"id":53,"category":"Finance","en":"ROI","ko":"투자수익률","definition":"투입한 투자금에 비해 얼마나 성과나 이익을 거두었는지 나타내는 비율이다.","example":"마케팅에 100만 원을 투자해 그 투자에 귀속되는 순수익이 20만 원이면 ROI는 20%다.","note":"이익과 투자금의 기준을 명확히 해야 한다.","page":"18","extra":false,"pron":"알오아이"},{"id":54,"category":"Finance","en":"Term Sheet","ko":"투자 주요조건 합의서","definition":"투자 금액·기업가치·지분·조건 등 핵심 투자조건을 정리하는 문서다.","example":"VC와 창업팀이 투자금 5억 원, 지분율, 선행 조건을 정리한 텀시트를 검토한다.","note":"최종 투자계약 전 조건 확인에 활용된다.","page":"18","extra":false,"pron":"텀 시트"},{"id":55,"category":"Finance","en":"Sweat Equity","ko":"노동 기여 지분","definition":"현금 출자 대신 창업 참여자의 시간·기술·노력·노하우 등의 기여를 지분으로 인정하는 개념이다.","example":"앱을 무급으로 개발한 공동창업자의 기여를 지분 배분 협상에 반영한다.","note":"시간 투입과 지분 배분은 합의를 통해 정한다.","page":"18","extra":false,"pron":"스웨트 에퀴티"},{"id":56,"category":"Finance","en":"Run Rate","ko":"성과 연환산 추정치","definition":"현재의 매출·이용량 등 성과를 바탕으로 일정 기간의 성과를 단순 추산한 값이다.","example":"최근 월매출이 1천만 원이라면 연환산 매출 런레이트를 1억2천만 원으로 제시한다.","note":"예측치이며 실제 연매출을 보장하지 않는다.","page":"18","extra":false,"pron":"런 레이트"},{"id":57,"category":"Finance","en":"Income / Profit","ko":"이익(원문: Income)","definition":"원문은 비용을 차감하고 남는 금액을 이익으로 설명한다. 강의에서는 매출과 이익을 구분한다.","example":"관광상품 매출 100만 원, 관련 비용 70만 원이라면 이익은 30만 원이다.","note":"Revenue(매출)와 Profit(이익)은 같은 말이 아니다.","page":"18","extra":false,"pron":"인컴 / 프로핏"},{"id":58,"category":"Finance","en":"Revenue","ko":"매출·수익","definition":"제품이나 서비스를 제공하고 대가로 얻는 매출을 뜻하며 비용 차감 전 금액이다.","example":"도보 투어를 2만 원에 100건 판매했다면 상품 매출은 200만 원이다.","note":"매출이 증가해도 이익은 감소할 수 있다.","page":"19","extra":false,"pron":"레버뉴"},{"id":59,"category":"Finance","en":"Vesting","ko":"권리 확정 일정","definition":"주식이나 스톡옵션의 권리가 근속기간·성과 등 조건 충족에 따라 단계적으로 확정되는 제도다.","example":"4년에 걸쳐 스톡옵션 권리가 순차적으로 확정되도록 약정한다.","note":"부여 시점과 권리 확정 시점은 다르다.","page":"19","extra":false,"pron":"베스팅"},{"id":60,"category":"Finance","en":"Cliff","ko":"베스팅 최소 대기기간","definition":"정해진 기간을 채우기 전에는 권리가 확정되지 않고 기간 도달 시 일정 분량이 확정되는 조건이다.","example":"1년 클리프 조건이면 11개월 퇴사 시 확정 주식이 없을 수 있다.","note":"일정 기간을 넘어야 첫 권리가 확정된다.","page":"19","extra":false,"pron":"클리프"},{"id":61,"category":"Marketing","en":"Growth Hacking","ko":"그로스 해킹","definition":"고객 데이터와 빠른 실험을 통해 저비용으로 고객 획득·성장을 개선하는 접근이다.","example":"여행 앱이 친구 추천 혜택을 실험해 가입 전환율 변화를 비교한다.","note":"실험과 지표를 바탕으로 성장 방법을 찾는다.","page":"21","extra":false,"pron":"그로스 해킹"},{"id":62,"category":"Marketing","en":"Evangelists","ko":"브랜드 전도사","definition":"제품을 열정적으로 지지하며 다른 사람에게 적극적으로 추천하는 고객이나 옹호자를 말한다.","example":"로컬 투어에 만족한 고객이 자발적으로 여행 후기와 이용 팁을 공유한다.","note":"자발적 추천과 브랜드 옹호가 특징이다.","page":"21","extra":false,"pron":"이밴절리스트"},{"id":63,"category":"Marketing","en":"The Chasm","ko":"캐즘","definition":"초기 혁신 수용자 시장에서 대중시장으로 확산되는 사이에 발생할 수 있는 수요 정체·단절 구간이다.","example":"신기술 관광 앱이 얼리어답터에게는 인기지만 일반 여행객 확보에는 어려움을 겪는다.","note":"초기 호응이 곧바로 대중화를 보장하지 않는다.","page":"22","extra":false,"pron":"더 캐즘"},{"id":64,"category":"Marketing","en":"SEO","ko":"검색엔진 최적화","definition":"검색 결과에서 웹사이트를 더 쉽게 찾을 수 있도록 콘텐츠와 사이트 구조 등을 개선하는 활동이다.","example":"‘부산 도보 여행’ 검색에서 지역 투어 소개 페이지가 잘 노출되도록 정보를 정리한다.","note":"검색 광고와 자연 검색 최적화는 다르다.","page":"22","extra":false,"pron":"에스이오"},{"id":65,"category":"Marketing","en":"Target Marketing","ko":"표적 마케팅","definition":"비슷한 요구와 특성을 지닌 고객 집단을 선택해 집중적으로 서비스를 제안하는 전략이다.","example":"모든 여행객 대신 유모차 동반 가족을 겨냥한 주말 관광상품을 홍보한다.","note":"누구에게 팔 것인지 선명하게 정한다.","page":"22","extra":false,"pron":"타깃 마케팅"},{"id":66,"category":"Marketing","en":"Traction","ko":"시장 반응·실제 성과","definition":"스타트업이 고객의 실제 사용과 구매를 통해 시장에서 얻은 가시적인 진전을 뜻한다.","example":"3개월간 유료 예약 500건과 재예약 고객 100명이 확인된다.","note":"‘관심’보다 실제 지표가 중요하다.","page":"23","extra":false,"pron":"트랙션"},{"id":67,"category":"Marketing","en":"Inbound Marketing","ko":"인바운드 마케팅","definition":"검색·콘텐츠·SNS 등을 통해 고객이 스스로 브랜드를 찾아오게 하는 마케팅이다.","example":"여행 준비 가이드를 블로그에 게시해 검색을 통해 예약 페이지 방문을 유도한다.","note":"고객의 자발적인 유입을 촉진한다.","page":"23","extra":false,"pron":"인바운드 마케팅"},{"id":68,"category":"Marketing","en":"Outbound Marketing","ko":"아웃바운드 마케팅","definition":"광고·전화·이메일 등 브랜드가 먼저 잠재 고객에게 접근하는 마케팅이다.","example":"호텔 제휴 담당자에게 상품 소개 메일을 보내거나 배너광고를 집행한다.","note":"기업이 먼저 고객에게 접촉한다.","page":"23","extra":false,"pron":"아웃바운드 마케팅"},{"id":69,"category":"Marketing","en":"KPI","ko":"핵심성과지표","definition":"사업목표 달성 정도를 정량적으로 확인하는 핵심 지표다.","example":"축제 관광상품의 월 예약 300건, 예약 취소율 5% 이하를 KPI로 정한다.","note":"목표·측정방법·기준기간을 명확히 한다.","page":"23","extra":false,"pron":"케이피아이"},{"id":70,"category":"Marketing","en":"Bounce Rate","ko":"이탈률·반송률","definition":"사이트 방문 후 추가 탐색이나 유의미한 상호작용 없이 이탈하는 정도를 나타내는 웹 지표다.","example":"관광상품 랜딩페이지에 들어왔다가 상세 정보를 보지 않고 나가는 방문이 많다.","note":"분석 도구에 따라 산정 기준이 다를 수 있다.","page":"24","extra":false,"pron":"바운스 레이트"},{"id":71,"category":"Marketing","en":"A/B Testing","ko":"A/B 테스트","definition":"두 가지 시안을 무작위로 나누어 노출해 정해진 지표 차이를 비교하는 실험이다.","example":"여행 예약 버튼을 A안 ‘지금 예약’과 B안 ‘자리 확인’으로 나눠 전환율을 비교한다.","note":"디자인 취향보다 행동 지표로 평가한다.","page":"24","extra":false,"pron":"에이비 테스팅"},{"id":72,"category":"Marketing","en":"LTV","ko":"고객생애가치","definition":"고객 한 명이 관계를 유지하는 동안 기업에 기여할 것으로 기대되는 총가치를 뜻한다.","example":"한 관광객이 3년간 여러 상품을 반복 구매하며 만들어 내는 장기 가치를 추정한다.","note":"단기 매출뿐 아니라 유지·반복 구매를 본다.","page":"24","extra":false,"pron":"엘티브이"},{"id":73,"category":"Marketing","en":"CAC","ko":"고객획득비용","definition":"신규 고객 한 명을 확보하기 위해 사용한 마케팅·영업 비용을 나타내는 지표다.","example":"광고비 50만 원을 써서 신규 유료 고객 25명을 얻었다면 단순 CAC는 2만 원이다.","note":"획득 비용을 고객 가치와 함께 비교한다.","page":"24","extra":false,"pron":"씨에이씨"},{"id":74,"category":"Marketing","en":"Churn","ko":"고객 이탈","definition":"고객이 구독·서비스 이용을 종료하거나 떠나는 현상 또는 그 비율이다.","example":"관광 일정 앱의 유료 구독자 100명 중 한 달에 8명이 해지했다면 월 이탈률은 8%다.","note":"이탈률의 기간과 모수를 일치시킨다.","page":"25","extra":false,"pron":"천"},{"id":75,"category":"Marketing","en":"Retention","ko":"고객 유지","definition":"기존 고객이 일정 기간 이후에도 계속 이용하거나 재구매하는 정도다.","example":"지난달 회원 100명 중 70명이 이번 달에도 앱을 사용했다면 단순 유지율은 70%다.","note":"신규 확보 못지않게 지속 이용이 중요하다.","page":"25","extra":false,"pron":"리텐션"},{"id":76,"category":"Marketing","en":"Activation","ko":"활성화·첫 가치 경험","definition":"원문은 무료 평가판 이후 유료 회원으로 전환되는 비율을 사례로 설명한다.","example":"무료체험 관광 앱 이용자 200명 중 30명이 유료 구독을 시작하는 전환을 측정한다.","note":"이 자료의 Activation 사례는 유료전환에 초점이 있다.","page":"25","extra":false,"pron":"액티베이션"},{"id":77,"category":"Programming","en":"Technology Stack","ko":"기술 스택","definition":"앱·웹서비스를 만들고 운영하는 데 사용하는 프로그래밍 언어·도구·데이터베이스 등의 조합이다.","example":"관광 예약 서비스가 Python, 웹 프레임워크, PostgreSQL을 조합해 개발된다.","note":"무엇을 만들지에 맞춰 기술 조합을 고른다.","page":"27","extra":false,"pron":"테크놀로지 스택"},{"id":78,"category":"Programming","en":"QA","ko":"품질보증","definition":"서비스가 요구사항대로 안정적으로 동작하는지 점검하고 품질을 확보하는 활동이다.","example":"예약 취소 버튼이 제대로 작동하는지 다양한 휴대폰에서 시험한다.","note":"오류 발견뿐 아니라 신뢰성 확보가 목적이다.","page":"27","extra":false,"pron":"큐에이"},{"id":79,"category":"Programming","en":"DevOps","ko":"개발·운영 협업","definition":"소프트웨어 개발과 운영 담당자가 협업해 배포·검증·운영을 지속적으로 개선하는 접근이다.","example":"관광 앱 업데이트를 자동 점검 후 배포해 장애 대응 시간을 줄인다.","note":"개발과 운영을 분리하지 않고 연결한다.","page":"27","extra":false,"pron":"데브옵스"},{"id":80,"category":"Programming","en":"Full-stack Developer","ko":"풀스택 개발자","definition":"사용자 화면(프런트엔드)과 서버·데이터 처리(백엔드) 모두를 다룰 수 있는 개발자다.","example":"예약 화면부터 결제 내역 데이터 저장까지 함께 구현하는 개발자다.","note":"서비스 앞단과 뒷단을 모두 이해한다.","page":"27","extra":false,"pron":"풀 스택 디벨로퍼"},{"id":81,"category":"Programming","en":"Front-end","ko":"프런트엔드","definition":"사용자가 직접 보고 조작하는 웹사이트·앱의 화면 영역을 구현하는 부분이다.","example":"여행 코스 목록, 달력, 예약 버튼을 모바일 화면에 표시한다.","note":"사용자에게 보이는 부분이다.","page":"28","extra":false,"pron":"프런트 엔드"},{"id":82,"category":"Programming","en":"Back-end","ko":"백엔드","definition":"사용자에게 보이지 않는 서버 로직·데이터 저장·시스템 연동을 담당하는 부분이다.","example":"예약 요청이 오면 남은 좌석을 확인하고 데이터베이스를 업데이트한다.","note":"서비스 뒤에서 처리되는 부분이다.","page":"28","extra":false,"pron":"백 엔드"},{"id":83,"category":"Programming","en":"Compiler","ko":"컴파일러","definition":"사람이 작성한 프로그램 코드를 컴퓨터가 실행할 수 있는 형태로 변환하는 도구다.","example":"개발자가 작성한 프로그램을 실행 가능한 파일로 변환한다.","note":"코드 변환을 담당하는 개발 도구다.","page":"28","extra":false,"pron":"컴파일러"},{"id":84,"category":"Programming","en":"API","ko":"응용프로그램 인터페이스","definition":"서로 다른 소프트웨어가 정해진 방식으로 요청·응답하며 기능이나 데이터를 주고받도록 하는 규약이다.","example":"관광 앱이 날씨 서비스의 API를 호출해 여행지 예보를 표시한다.","note":"서비스와 서비스를 이어 주는 약속이다.","page":"28","extra":false,"pron":"에이피아이"},{"id":85,"category":"Programming","en":"Open Source","ko":"오픈소스","definition":"소스코드가 공개되고 라이선스에 정해진 조건으로 사용·수정·배포할 수 있는 소프트웨어다.","example":"창업팀이 공개된 지도 라이브러리를 라이선스를 확인한 뒤 앱에 적용한다.","note":"원문은 무료 공개를 강조하며 실제 권한은 라이선스에 따른다.","page":"28","extra":false,"pron":"오픈 소스"},{"id":86,"category":"Programming","en":"Framework","ko":"프레임워크","definition":"반복되는 설계·기능을 미리 제공해 프로그램 개발을 효율적으로 돕는 소프트웨어 기반이다.","example":"관광 예약 사이트를 웹 프레임워크의 로그인·라우팅 기능을 이용해 개발한다.","note":"개발을 빠르게 하는 기본 구조다.","page":"29","extra":false,"pron":"프레임워크"},{"id":87,"category":"Programming","en":"Concurrency","ko":"동시성","definition":"프로그램이 여러 작업의 실행을 서로 겹치게 처리하도록 구성하는 특성이다.","example":"예약 앱이 여러 고객의 검색·예약 요청을 동시에 처리한다.","note":"여러 요청을 효율적으로 다룬다.","page":"29","extra":false,"pron":"컨커런시"},{"id":88,"category":"Programming","en":"CRUD","ko":"생성·조회·수정·삭제","definition":"데이터 처리의 기본 동작인 Create·Read·Update·Delete를 묶어 부르는 말이다.","example":"관광상품 등록(C), 목록 보기(R), 가격 변경(U), 상품 삭제(D)에 해당한다.","note":"대부분 데이터 관리 기능의 기본이다.","page":"29","extra":false,"pron":"크러드"},{"id":89,"category":"Programming","en":"Database","ko":"데이터베이스","definition":"필요한 데이터를 구조적으로 저장하고 검색·관리할 수 있도록 만든 정보 저장소다.","example":"여행 앱이 상품, 고객, 예약 내역을 체계적으로 저장한다.","note":"데이터를 정확하고 일관되게 관리한다.","page":"29","extra":false,"pron":"데이터베이스"},{"id":90,"category":"Programming","en":"Cache","ko":"캐시","definition":"자주 사용하는 데이터를 임시로 저장해 다시 읽을 때 속도를 높이는 방식이다.","example":"인기 관광지 썸네일을 캐시에 보관해 화면을 더 빠르게 연다.","note":"속도 향상을 위한 임시 저장이다.","page":"30","extra":false,"pron":"캐시"},{"id":91,"category":"Programming","en":"Operating System","ko":"운영체제","definition":"컴퓨터의 하드웨어 자원을 관리하고 응용 프로그램을 실행할 기반을 제공하는 소프트웨어다.","example":"호텔 키오스크의 운영체제가 화면·메모리·입력 장치를 관리한다.","note":"하드웨어와 응용 프로그램을 연결한다.","page":"30","extra":false,"pron":"오퍼레이팅 시스템"},{"id":92,"category":"Programming","en":"Cloud Computing","ko":"클라우드 컴퓨팅","definition":"인터넷을 통해 서버·저장공간·컴퓨팅 자원을 필요에 따라 사용하는 방식이다.","example":"지역 관광 앱이 자체 서버를 구매하는 대신 클라우드 서버를 임대해 예약량 증가에 대응한다.","note":"원자료에 없는 강의 보완 개념이다.","page":"보완","extra":true,"pron":"클라우드 컴퓨팅"}]</script><script id="quizset" type="application/json">[{"category": "Business", "q": "시범 예약 페이지만 만들어 실제 고객의 반응을 가장 빨리 확인하려 한다. 이 초기 제품을 무엇이라 하는가?", "opts": ["MVP", "Exit", "Unicorn", "Pitch Deck"], "correct": 0, "explain": "MVP는 가장 핵심적인 기능만으로 고객 가설을 시험하는 최소기능제품이다."}, {"category": "Business", "q": "핵심 고객을 개인 여행객에서 호텔 운영자로 바꾸고 서비스 목적도 전환했다. 무엇에 해당하는가?", "opts": ["Iteration", "Pivot", "Beta Release", "Freemium"], "correct": 1, "explain": "Pivot은 핵심 고객·제품·사업모델처럼 중요한 방향을 바꾸는 전략적 전환이다."}, {"category": "Business", "q": "기업가치가 10억 달러 이상인 비상장 스타트업을 뜻하는 것은?", "opts": ["Dragon", "Unicorn", "Accelerator", "Incubator"], "correct": 1, "explain": "Unicorn은 비상장 스타트업의 기업가치 기준이다. Dragon은 단일 투자 라운드의 대규모 유치액 개념이다."}, {"category": "Design", "q": "관광 앱의 지도 버튼·검색창·예약 달력처럼 고객이 화면에서 직접 조작하는 요소는?", "opts": ["UX", "UI", "Accessibility", "Wireframing"], "correct": 1, "explain": "UI는 사용자가 보고 조작하는 화면상의 인터페이스를 가리킨다."}, {"category": "Design", "q": "예약을 시작해 결제·확인·현장 입장까지 겪는 총체적인 만족 경험은?", "opts": ["UX", "UI", "Framework", "QA"], "correct": 0, "explain": "UX는 개별 화면을 넘어 서비스를 경험하는 전 과정을 포함한다."}, {"category": "Design", "q": "저시력 이용자도 큰 글자와 음성 안내로 관광 앱을 이용할 수 있도록 하는 특성은?", "opts": ["Usability", "Accessibility", "Traction", "Iteration"], "correct": 1, "explain": "Accessibility는 서로 다른 능력과 환경의 이용자들도 서비스를 사용할 수 있게 하는 것이다."}, {"category": "Finance", "q": "투자 전 회사가치가 8억 원이고 신규 투자 2억 원이 들어온다면 단순 포스트머니 가치는?", "opts": ["6억 원", "8억 원", "10억 원", "16억 원"], "correct": 2, "explain": "단순 신규 현금 투자 상황에서 포스트머니는 프리머니 8억 원에 투자액 2억 원을 더한 10억 원이다."}, {"category": "Finance", "q": "창업팀의 월별 현금 잔고가 평균 500만 원씩 줄어든다. 이 속도를 나타내는 지표는?", "opts": ["Burn Rate", "ROI", "Run Rate", "Cap Table"], "correct": 0, "explain": "Burn Rate는 현금이 일정 기간에 얼마나 빨리 소진되는지 나타낸다."}, {"category": "Finance", "q": "창업자와 투자자 각각의 보유 지분율을 한눈에 보여주는 표는?", "opts": ["Term Sheet", "Cap Table", "Pitch Deck", "BM Canvas"], "correct": 1, "explain": "Cap Table은 주주 구성과 지분 관계 및 투자에 따른 변화를 정리한다."}, {"category": "Marketing", "q": "광고비 50만 원으로 신규 고객 25명을 유치했다. 단순 고객획득비용(CAC)은?", "opts": ["2천 원", "1만 원", "2만 원", "5만 원"], "correct": 2, "explain": "CAC는 신규 고객 획득에 사용한 비용을 획득 고객 수로 나누며, 50만 원 ÷ 25명 = 2만 원이다."}, {"category": "Marketing", "q": "A형과 B형 예약 버튼을 서로 다른 고객에게 보여주고 실제 전환율을 비교했다. 무엇인가?", "opts": ["SEO", "A/B Testing", "Inbound Marketing", "Retention"], "correct": 1, "explain": "A/B Testing은 두 시안을 비교해 정해진 성과 지표를 바탕으로 선택하는 실험이다."}, {"category": "Marketing", "q": "지난달 유료 구독자 100명 중 8명이 이달 해지했다. 해당 기간의 단순 이탈률은?", "opts": ["4%", "8%", "12%", "92%"], "correct": 1, "explain": "이탈률은 기간 내 이탈 고객 8명 ÷ 기준 고객 100명 × 100 = 8%다."}, {"category": "Programming", "q": "관광 앱이 외부 날씨 서비스의 데이터를 정해진 방식으로 가져올 때 사용하는 것은?", "opts": ["Compiler", "API", "Cache", "Operating System"], "correct": 1, "explain": "API는 서로 다른 프로그램이 정해진 방식으로 요청과 응답을 주고받도록 연결한다."}, {"category": "Programming", "q": "상품 등록·조회·수정·삭제 작업을 묶는 약어는?", "opts": ["CRUD", "SaaS", "SEO", "QA"], "correct": 0, "explain": "CRUD는 Create, Read, Update, Delete의 네 가지 기본 데이터 작업이다."}, {"category": "Programming", "q": "예약 처리 서버 및 데이터베이스 기능을 구현하는 개발 영역은?", "opts": ["Front-end", "Back-end", "User Interface", "Wireframing"], "correct": 1, "explain": "Back-end는 서버의 처리 로직과 데이터 관리를 담당한다."}]</script><script id="categories" type="application/json">{"Business": {"kr": "비즈니스 기초", "subtitle": "창업의 언어와 사업 모델", "color": "#2053bd", "sub": "창업·검증·비즈니스 모델", "range": "원자료 p.2–10", "symbol": "◈"}, "Design": {"kr": "디자인과 사용자 경험", "subtitle": "고객 관점의 서비스 설계", "color": "#7443a8", "sub": "UI·UX·접근성·설계", "range": "원자료 p.12–13", "symbol": "▦"}, "Finance": {"kr": "투자와 재무", "subtitle": "자금 조달과 성과 이해", "color": "#0f7472", "sub": "투자·기업가치·지분", "range": "원자료 p.15–19", "symbol": "◉"}, "Marketing": {"kr": "마케팅과 데이터 분석", "subtitle": "고객 확보와 성장 지표", "color": "#a75412", "sub": "고객·마케팅·분석", "range": "원자료 p.21–25", "symbol": "⌁"}, "Programming": {"kr": "프로그래밍과 기술", "subtitle": "디지털 서비스가 작동하는 구조", "color": "#ad355e", "sub": "개발·데이터·운영", "range": "원자료 p.27–30", "symbol": "◇"}}</script>
<script>
'use strict';
const ITEMS=JSON.parse(document.getElementById('dataset').textContent),QUESTIONS=JSON.parse(document.getElementById('quizset').textContent),CATEGORIES=JSON.parse(document.getElementById('categories').textContent);
const names=['Business','Design','Finance','Marketing','Programming'];
const quizAnswers=Array(QUESTIONS.length).fill(null);const slides=[];const indices={};
function esc(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function create(tag,classname,content){const el=document.createElement(tag);if(classname)el.className=classname;if(content!==undefined)el.innerHTML=content;return el}
function add(type,category,htmlc,extra){const el=create('section','slide '+(type==='toc'?'toc-slide':''),htmlc);el.dataset.type=type;el.dataset.category=category||'Business';if(extra!==undefined)el.dataset.extra=String(extra);el.style.setProperty('--accent',CATEGORIES[category||'Business'].color);document.getElementById('pages').appendChild(el);slides.push(el);return slides.length-1;}
function toc(){let cards=names.map((cat,j)=>{let c=CATEGORIES[cat],n=ITEMS.filter(d=>d.category===cat).length;return `<button class="toc-card" data-goto="${cat}" style="--acolor:${c.color}"><div><span class="n">${String(j+1).padStart(2,'0')}</span><strong>${c.kr}</strong><p>${c.sub} · ${n}개 · ${c.range}</p></div><span class="next">↗</span></button>`}).join('');return `<div class="eyebrow">2026 · STARTUP LECTURE SERIES</div><h1 class="toc-title">스타트업 핵심 용어<br>강의 목차</h1><p class="toc-intro">한 장에 두 개념씩. 영어 원어·한글 발음·핵심 정의를 익히고, 관광·로컬 창업의 실제 적용 상황을 통해 이해하는 학습형 강의 자료입니다.</p><div class="toc-stats"><span class="stat"><strong>5</strong>개 영역</span><span class="stat"><strong>91</strong>개 원자료 용어</span><span class="stat"><strong>1</strong>개 보완 개념</span><span class="stat"><strong>15</strong>문항 점검 퀴즈</span></div><div class="toc-grid">${cards}<button class="toc-card toc-end" data-goto="quiz" style="--acolor:#0e746e"><div><span class="n">06</span><strong>개념 확인 퀴즈</strong><p>분야별 3문항 · 정답·해설·최종 점수</p></div><span class="next">↗</span></button></div><p class="source-line">영어 발음은 한국어 학습용 근사 표기입니다. 기준자료: 「스타트업 관련 Business · Design · Finance · Marketing/Analytics · Programming 용어 정리」(TNT SPEECH, 2022 PDF). 정의는 학습 목적에 맞게 요약·표현을 다듬었으며, 모든 창업 사례는 설명을 위해 새로 만든 가상 예시입니다. 클라우드 컴퓨팅은 2열 구성을 맞추기 위해 추가한 보완 개념입니다.</p>`;}
function card(item){return `<article class="concept"><div class="card-top"><span class="term-num">CONCEPT ${String(item.id).padStart(2,'0')}</span><span class="term-source">${item.extra?'<span class="badge-extra">추가 보완</span>':`원자료 p.${item.page}`}</span></div><div><div class="term-enrow"><h3 class="term-en">${esc(item.en)}</h3><span class="term-pron" title="학습용 한글 발음 근사 표기">[${esc(item.pron)}]</span></div><div class="term-ko">${esc(item.ko)}</div></div><div class="term-hr"></div><div><div class="item-label">CONCEPT · 개념 정의</div><p class="item-desc">${esc(item.definition)}</p></div><div class="example"><div class="item-label">EXAMPLE · 관광·창업 적용 예시</div><p>${esc(item.example)}</p></div><div class="point"><strong>핵심 포인트 · </strong>${esc(item.note)}</div></article>`}
add('toc','Business',toc());
for(const cat of names){const group=ITEMS.filter(x=>x.category===cat),c=CATEGORIES[cat];indices[cat]=slides.length;for(let i=0;i<group.length;i+=2){let pair=group.slice(i,i+2);const num=i/2+1,len=group.length/2;add('concept',cat,`<header class="slide-head"><div><div class="eyebrow">${esc(cat)} · ${esc(c.subtitle)}</div><h2 class="slide-title">${esc(c.kr)}</h2><p class="slide-sub">영어 발음 → 개념 → 적용 사례 → 핵심 포인트 · 1장 2개념</p></div><span class="section-num">${String(num).padStart(2,'0')} / ${String(len).padStart(2,'0')}</span></header><div class="pair">${pair.map(card).join('')}</div><div class="slide-foot"><span>${esc(c.range)}</span><span>모든 적용 예시는 학습용 가상 사례입니다.</span></div>`);}}
indices.quiz=slides.length;
QUESTIONS.forEach((q,i)=>{let c=CATEGORIES[q.category];let opts=q.opts.map((x,j)=>`<button class="option" data-q="${i}" data-choice="${j}"><b>${String.fromCharCode(65+j)}</b>${esc(x)}</button>`).join('');add('quiz',q.category,`<header class="slide-head"><div><div class="eyebrow">LEARNING CHECK · ${esc(q.category)}</div><h2 class="slide-title">개념 확인 퀴즈</h2><p class="slide-sub">선택 후 정답과 해설을 확인하세요. 문항별 선택을 변경할 수 있습니다.</p></div><span class="section-num">${String(i+1).padStart(2,'0')} / 15</span></header><div class="quiz-body"><div class="quiz-progress">QUESTION ${String(i+1).padStart(2,'0')} / 15</div><h3 class="quiz-q">${esc(q.q)}</h3><div class="options">${opts}</div><div class="feedback" id="feedback-${i}"></div><p class="quiz-note">분야: ${esc(c.kr)} · 객관식 4지선다 · 정답 선택 여부를 마지막 성적표에서 확인할 수 있습니다.</p></div>`,i);});
indices.result=slides.length;
add('result','Business',`<header class="slide-head"><div><div class="eyebrow">LEARNING SUMMARY · FINAL RESULT</div><h2 class="slide-title">최종 점검 · 학습 결과</h2><p class="slide-sub">15개 핵심 질문에 대한 정답률을 확인하고 부족한 영역을 복습하세요.</p></div><span class="section-num">RESULT</span></header><div class="score-box"><div class="eyebrow">YOUR SCORE</div><div class="score-val" id="scoreVal">—</div><div class="score-caption" id="scoreCaption">문항에 답하고 결과를 확인하세요.</div><div class="score-meta" id="scoreMeta">완료 문항: 0 / 15</div><div class="score-buttons"><button class="action-primary" id="gradeBtn">결과 확인</button><button class="action-secondary" id="retryBtn">다시 풀기</button><button class="action-secondary" id="reviewBtn">용어 다시 보기</button></div></div><div class="slide-foot"><span>이 자료의 모든 수치 예시는 학습을 위한 가상 상황입니다.</span><span>END OF LECTURE</span></div>`);
let current=0;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2500)}
function go(n){current=Math.min(slides.length-1,Math.max(0,n));slides.forEach((s,i)=>s.classList.toggle('active',i===current));let s=slides[current],cat=s.dataset.category;document.documentElement.style.setProperty('--accent',s.dataset.type==='result'?'#087a56':CATEGORIES[cat].color);document.getElementById('slideIndex').textContent=`${current+1} / ${slides.length}`;document.getElementById('progressFill').style.width=`${100*(current+1)/slides.length}%`;document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===slides.length-1;document.getElementById('sectionPill').textContent=s.dataset.type==='toc'?'강의 목차':s.dataset.type==='quiz'?'개념 확인 퀴즈':s.dataset.type==='result'?'학습 결과':CATEGORIES[cat].kr;window.scrollTo({top:0,behavior:'instant'});if(s.dataset.type==='result')updateScore(false);location.hash=`page-${current+1}`;}
function choose(qi,ch){quizAnswers[qi]=ch;const slide=slides[indices.quiz+qi],q=QUESTIONS[qi],correct=ch===q.correct;slide.querySelectorAll('.option').forEach((b,i)=>{b.classList.toggle('selected',i===ch);b.classList.toggle('correct',i===q.correct);b.classList.toggle('wrong',i===ch&&!correct)});const f=slide.querySelector('.feedback');f.className='feedback show'+(correct?'':' wrong');f.innerHTML=`<strong>${correct?'✓ 정답입니다':'↗ 다시 확인해 보세요 · 정답: '+String.fromCharCode(65+q.correct)}</strong>${esc(q.explain)}`;}
function updateScore(notify){const done=quizAnswers.filter(v=>v!==null).length,score=quizAnswers.reduce((s,a,i)=>s+(a===QUESTIONS[i].correct?1:0),0);document.getElementById('scoreVal').textContent=`${score} / 15`;document.getElementById('scoreCaption').textContent=done<15?'미응답 문항이 남았습니다. 모든 문항을 풀면 전체 성적을 확인할 수 있습니다.':score===15?'훌륭합니다! 5개 분야의 핵심 개념을 모두 이해했습니다.':score>=12?'좋습니다! 정답을 놓친 개념을 한번 더 확인해 보세요.':'개념 페이지를 복습하고 다시 도전해 보세요.';const groupInfo=names.map(cat=>{const is=QUESTIONS.map((q,i)=>q.category===cat?i:-1).filter(i=>i>=0);const ok=is.filter(i=>quizAnswers[i]===QUESTIONS[i].correct).length;return `${CATEGORIES[cat].kr}: ${ok}/3`}).join(' · ');document.getElementById('scoreMeta').innerHTML=`<strong>완료 문항:</strong> ${done} / 15<br><strong>정답 문항:</strong> ${score} / 15<br><strong>영역별 결과:</strong> ${groupInfo}`;if(notify){if(done<15){let first=quizAnswers.indexOf(null);toast(`${15-done}개 미응답 문항이 남았습니다.`);go(indices.quiz+first)}else{toast('채점 완료! 영역별 결과를 확인하세요.')}}}
function reset(){quizAnswers.fill(null);QUESTIONS.forEach((q,i)=>{slides[indices.quiz+i].querySelectorAll('.option').forEach(b=>b.className='option');const f=document.getElementById('feedback-'+i);f.className='feedback';f.innerHTML=''});go(indices.quiz);toast('새로운 학습을 시작합니다.');}
function bind(){document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>go(indices[b.dataset.goto]||0)));document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.q),Number(b.dataset.choice))));document.getElementById('gradeBtn').addEventListener('click',()=>updateScore(true));document.getElementById('retryBtn').addEventListener('click',reset);document.getElementById('reviewBtn').addEventListener('click',()=>go(indices.Business));document.getElementById('tocBtn').addEventListener('click',()=>go(0));document.getElementById('prevBtn').addEventListener('click',()=>go(current-1));document.getElementById('nextBtn').addEventListener('click',()=>go(current+1));document.getElementById('printBtn').addEventListener('click',()=>window.print());document.getElementById('fullBtn').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}if(e.key==='Home'){go(0)}if(e.key==='End'){go(slides.length-1)}});const search=document.getElementById('termSearch'),result=document.getElementById('searchResults');search.addEventListener('input',()=>{let v=search.value.toLowerCase().trim();result.innerHTML='';if(!v){result.classList.remove('open');return}const hits=ITEMS.filter(x=>(x.en+x.ko+x.definition).toLowerCase().includes(v)).slice(0,12);result.classList.toggle('open',hits.length>0);hits.forEach(item=>{const b=create('button','',`<strong>${esc(item.en)}</strong> <span style="color:#135b8c">${esc(item.ko)}</span>`);b.addEventListener('click',()=>{go(slides.findIndex(s=>s.dataset.type==='concept'&&s.innerHTML.includes('CONCEPT '+String(item.id).padStart(2,'0'))));search.value='';result.classList.remove('open')});result.appendChild(b)})});search.addEventListener('keydown',e=>{if(e.key==='Escape'){search.value='';result.classList.remove('open')}});}
bind();const hash=location.hash.match(/page-(\d+)/);go(hash?parseInt(hash[1],10)-1:0);
</script></body></html>
