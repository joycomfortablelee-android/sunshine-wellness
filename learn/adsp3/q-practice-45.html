.chap{margin:26px 0 12px;font-size:15px;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:10px}
.chap span{background:var(--navy);color:#fff;border-radius:7px;padding:3px 9px;font-size:12.5px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 6px 18px rgba(20,56,95,.06)}
.card.correct{border-color:#9bd3bd;background:#f3fbf8}
.card.wrong{border-color:#eab3ac;background:#fff6f5}
.qtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.qno{font-weight:900;color:var(--blue);font-size:13px}
.src{font-size:11.5px;color:var(--muted);background:#f4f7fa;border:1px solid #e2e9ef;border-radius:999px;padding:3px 9px;white-space:nowrap}
.qtext{font-weight:800;font-size:15.5px;line-height:1.55;margin:4px 0 12px}

.opt:hover{background:#f7fafd}
.opt input{margin-top:3px}
.opt.right{border-color:#73c2a0;background:#eafbf3;font-weight:800}
.opt.chosen-wrong{border-color:var(--red);background:#fdeceb;font-weight:800}
.explain-btn{margin-top:14px;border:1px solid var(--navy);border-radius:9px;background:#fff;color:var(--navy);font-size:12.5px;font-weight:800;padding:7px 13px;cursor:pointer}
.explain-btn:hover{background:#eef6ff}
.explain{display:none;margin-top:12px;background:#eef8f6;border:1px solid #c7e6df;border-radius:11px;padding:13px 15px;font-size:13.5px;line-height:1.65}
.explain b{color:var(--green)}
.result-tag{font-size:12px;font-weight:900;border-radius:999px;padding:3px 10px;display:none}
.card.correct .result-tag.r-ok{display:inline-block;background:#dff3ea;color:var(--green)}
.card.wrong .result-tag.r-no{display:inline-block;background:#fbe3e0;color:var(--red)}
.footer-grade{text-align:center;margin:28px 0}
.summary{display:none;max-width:860px;margin:0 auto;padding:0 16px}
.summary.show{display:block}
.summary-box{background:#fff;border:2px solid var(--gold);border-radius:16px;padding:20px 22px;text-align:center;margin-top:10px}
.summary-box .num{font-size:38px;font-weight:900;color:var(--navy)}

const wrap = document.getElementById('quizWrap');
let flatIdx = 0;
const flat = [];
DATA.forEach(group=>{
  const h = document.createElement('div');
  h.className = 'chap';
  h.innerHTML = '<span>' + group.chap.slice(0,2) + '</span>' + group.chap;
  wrap.appendChild(h);
  group.items.forEach(item=>{
    const gi = flatIdx++;
    flat.push(item);
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card'+gi;
    let optsHtml = item.opts.map((o,oi)=>{
      const n = ['①','②','③','④'][oi];
      return `<label class="opt" id="opt${gi}_${oi}"><input type="radio" name="q${gi}" value="${oi}" onchange="markAnswered(${gi})">${n} ${o}</label>`;
    }).join('');
    card.innerHTML = `
      <div class="qtop">
        <span class="qno">Q${gi+1}</span>
        <span class="src">${item.src}</span>
      </div>
      <div class="qtext">${item.q}</div>
      ${item.sub ? `<div class="codebox">${item.sub}</div>` : ''}
      ${item.code ? `<div class="codebox">${item.code}</div>` : ''}
      ${optsHtml}
      <span class="result-tag r-ok">정답</span><span class="result-tag r-no">오답</span>
      <button class="explain-btn" id="ebtn${gi}" onclick="toggleExplain(${gi})">해설 보기</button>
      <div class="explain" id="explain${gi}"><b>정답 ${['①','②','③','④'][item.answer]}</b> &nbsp;${item.explain}</div>
    `;
    wrap.appendChild(card);
  });
});

function toggleExplain(i){
  const box = document.getElementById('explain'+i);
  const btn = document.getElementById('ebtn'+i);
  const open = box.style.display === 'block';
  box.style.display = open ? 'none' : 'block';
  btn.textContent = open ? '해설 보기' : '해설 닫기';
}

function markAnswered(){
  const answered = flat.filter((_,i)=>document.querySelector(`input[name="q${i}"]:checked`)).length;
  document.getElementById('progressPill').textContent = answered + ' / ' + flat.length + ' 응답';
}

function gradeAll(){
  let score = 0;
  flat.forEach((item,i)=>{
    const checked = document.querySelector(`input[name="q${i}"]:checked`);
    const card = document.getElementById('card'+i);
    const explain = document.getElementById('explain'+i);
    document.getElementById(`opt${i}_${item.answer}`).classList.add('right');
    explain.style.display = 'block';
    document.getElementById('ebtn'+i).textContent = '해설 닫기';
    if(checked){
      const val = parseInt(checked.value,10);
      if(val === item.answer){
        card.classList.add('correct'); card.classList.remove('wrong');
        score++;
      } else {
        card.classList.add('wrong'); card.classList.remove('correct');
        document.getElementById(`opt${i}_${val}`).classList.add('chosen-wrong');
      }
    } else {
      card.classList.add('wrong'); card.classList.remove('correct');
    }
  });
  document.getElementById('summary').classList.add('show');
  document.getElementById('scoreNum').textContent = score + ' / ' + flat.length;
  document.getElementById('summary').scrollIntoView({behavior:'smooth'});
}
markAnswered();
</script>
</body>
</html>
