.explain-btn:hover{background:#eef6ff}

.card.correct .result-tag.r-ok{display:inline-block;background:#dff3ea;color:var(--green)}

.summary{display:none;max-width:860px;margin:0 auto;padding:0 16px}

</style>

const wrap = document.getElementById('quizWrap');
let flatIdx = 0;
const flat = [];
DATA.forEach(group=>{
  const h = document.createElement('div');
  h.className = 'chap';
  h.innerHTML = '<span>' + group.chap.slice(0,2) + '</span>' + group.chap;
  wrap.appendChild(h);
  group.items.forEach(item=>{
    const gi = flatIdx++;
    flat.push(item);
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card'+gi;
    let optsHtml = item.opts.map((o,oi)=>{
      const n = ['①','②','③','④'][oi];
      return `<label class="opt" id="opt${gi}_${oi}"><input type="radio" name="q${gi}" value="${oi}" onchange="markAnswered(${gi})">${n} ${o}</label>`;
    }).join('');
    card.innerHTML = `
      <div class="qtop">
        <span class="qno">Q${gi+1}</span>
        <span class="src">${item.src}</span>
      </div>
      <div class="qtext">${item.q}</div>
      ${item.code ? `<div class="codebox">${item.code}</div>` : ''}
      ${optsHtml}
      <span class="result-tag r-ok">정답</span><span class="result-tag r-no">오답</span>
      <button class="explain-btn" id="ebtn${gi}" onclick="toggleExplain(${gi})">해설 보기</button>
      <div class="explain" id="explain${gi}"><b>정답 ${['①','②','③','④'][item.answer]}</b> &nbsp;${item.explain}</div>
    `;
    wrap.appendChild(card);
  });
});

function toggleExplain(i){
  const box = document.getElementById('explain'+i);
  const btn = document.getElementById('ebtn'+i);
  const open = box.style.display === 'block';
  box.style.display = open ? 'none' : 'block';
  btn.textContent = open ? '해설 보기' : '해설 닫기';
}

function markAnswered(){
  const answered = flat.filter((_,i)=>document.querySelector(`input[name="q${i}"]:checked`)).length;
  document.getElementById('progressPill').textContent = answered + ' / ' + flat.length + ' 응답';
}

function gradeAll(){
  let score = 0;
  flat.forEach((item,i)=>{
    const checked = document.querySelector(`input[name="q${i}"]:checked`);
    const card = document.getElementById('card'+i);
    const explain = document.getElementById('explain'+i);
    document.getElementById(`opt${i}_${item.answer}`).classList.add('right');
    explain.style.display = 'block';
    document.getElementById('ebtn'+i).textContent = '해설 닫기';
    if(checked){
      const val = parseInt(checked.value,10);
      if(val === item.answer){
        card.classList.add('correct'); card.classList.remove('wrong');
        score++;
      } else {
        card.classList.add('wrong'); card.classList.remove('correct');
        document.getElementById(`opt${i}_${val}`).classList.add('chosen-wrong');
      }
    } else {
      card.classList.add('wrong'); card.classList.remove('correct');
    }
  });
  document.getElementById('summary').classList.add('show');
  document.getElementById('scoreNum').textContent = score + ' / ' + flat.length;
  document.getElementById('summary').scrollIntoView({behavior:'smooth'});
}
markAnswered();
</script>
