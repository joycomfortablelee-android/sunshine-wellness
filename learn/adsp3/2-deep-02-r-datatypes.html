<script>
'use strict';
const chapters=[
{type:'cover',title:'R 데이터의 언어부터 기출까지',page:'208–219',section:'학습 안내'},
{type:'theory',section:'01 데이터 타입',title:'숫자·문자·논리는 어떻게 다를까?',subtitle:'같은 값처럼 보여도 자료형에 따라 가능한 연산이 달라집니다.',page:'208–209',topic:'types',keywords:['numeric','character','logical','factor'],concept:'<b>데이터 타입(Data Type)</b>은 값의 종류를 구분하는 규칙입니다. R은 숫자, 문자, 논리값, 범주형 데이터를 서로 다르게 처리합니다.',bullets:['숫자형: <b>2.5</b>처럼 계산 가능한 값','문자형: <b>"2.5"</b>처럼 따옴표로 묶인 문자열','논리형: <b>TRUE / FALSE</b> — 계산에서는 1/0으로 변환 가능','팩터형: <b>factor()</b>로 범주와 수준(level)을 관리'],code:'a <- 2.5\nb <- "2.5"\nc <- TRUE\nmode(a)     # "numeric"\nmode(b)     # "character"\nmode(c)     # "logical"',tip:'숫자 2.5와 문자 "2.5"는 다릅니다. 복소수는 R에서 별도의 complex 자료형입니다.',comic:[['🧮','숫자는 계산','2 + 3 = 5'],['🔤','문자는 글','"2"는 문자'],['✅','논리는 참/거짓','TRUE / FALSE'],['🏷️','팩터는 분류','소·중·대']]},
{type:'theory',section:'01 데이터 타입',title:'NA · NULL · NaN · Inf 한눈에 구분',subtitle:'모두 일반 숫자와 다르지만, 의미는 완전히 다릅니다.',page:'209–210',topic:'missing',keywords:['NA','NULL','NaN','Inf'],concept:'<b>NA</b>는 관측되지 않은 값, <b>NULL</b>은 비어 있는 객체, <b>NaN</b>은 정의되지 않는 수치 계산 결과, <b>Inf</b>는 무한대를 의미합니다.',bullets:['NA: 자료가 빠졌거나 알 수 없음','NULL: 길이가 0인 빈 객체·요소 없음','NaN: 0/0 등의 정의되지 않는 결과','Inf: 1/0과 같이 양의 무한대로 나타나는 결과','자료형 변환: as.numeric(), as.character(), as.factor()'],code:'x <- c(3, NA, 7)\nis.na(x)            # FALSE TRUE FALSE\nlength(NULL)        # 0\n0/0                 # NaN\n1/0                 # Inf\nas.numeric("12")    # 12',tip:'NA와 NaN은 관련이 있지만 동일하지 않습니다. is.na(NaN)은 TRUE, is.nan(NA)은 FALSE입니다.',comic:[['📋','NA','응답이 비었어요'],['📦','NULL','상자 자체가 비었어요'],['🌀','NaN','0 ÷ 0은 못 정해요'],['♾️','Inf','1 ÷ 0은 무한대']]},
{type:'theory',section:'02 벡터',title:'벡터: 같은 타입을 한 줄로',subtitle:'R의 가장 기본적인 데이터 구조는 1차원 벡터입니다.',page:'210',topic:'vector',keywords:['vector','c()','type coercion'],concept:'<b>벡터(Vector)</b>는 원소를 한 줄로 담는 1차원 구조입니다. 한 벡터의 원소들은 <b>동일한 원자형 타입</b>으로 맞춰집니다.',bullets:['c(2, 4, 6)은 숫자 벡터','c("가", "나")는 문자 벡터','c(1, "가")를 만들면 숫자 1도 문자 "1"이 됨','R에서 스칼라는 길이가 1인 벡터로 다룰 수 있음'],code:'x <- c(2, 4, 6)\nlength(x)     # 3\ny <- c(1, "가")\ny             # "1" "가"\nmode(y)       # "character"',tip:'행렬도 모든 원소가 한 가지 원자형 타입이며, 데이터프레임은 열마다 서로 다른 타입을 허용합니다.',comic:[['🧱','원소 선택','2, 4, 6'],['🧵','한 줄로 잇기','c(2,4,6)'],['🎯','한 가지 타입','숫자끼리'],['🔁','혼합 시 변환','1 → "1"']]},
{type:'theory',section:'02 벡터',title:'벡터 인덱싱과 원소별 연산',subtitle:'R은 1번째 원소가 1번입니다. -는 위치를 제외합니다.',page:'210–211',topic:'index',keywords:['v[2]','v[-2]','v[2:4]','x+y'],concept:'<b>인덱싱(Indexing)</b>은 원소의 위치를 지정하는 방법입니다. 벡터 간 산술 연산은 <b>같은 위치의 원소끼리</b> 수행됩니다.',bullets:['z[2] → 두 번째 값만 반환','z[-2] → 두 번째 값을 제외','z[2:4] → 두 번째부터 네 번째까지','z[z > 3] → 조건을 만족하는 값만 선택','길이가 같은 x+y → 원소별 덧셈'],code:'z <- 1:5\nz[2]             # 2\nz[-2]            # 1 3 4 5\nz[2:4]           # 2 3 4\nz[z > 3]         # 4 5\nc(2,4) + c(1,3) # 3 7',tip:'왼쪽 그림의 번호 버튼을 눌러 z[n]이 어떤 원소를 선택하는지 확인하세요.',comic:[['📍','자리에 번호','1부터 시작'],['👆','z[2]','2번 선택'],['🚫','z[-2]','2번만 제외'],['➕','x+y','같은 자리 더함']]},
{type:'theory',section:'02 벡터',title:'길이가 달라도 계산? 재활용 규칙',subtitle:'짧은 벡터를 반복해 긴 벡터와 맞춰 계산합니다.',page:'211',topic:'recycle',keywords:['recycling rule','원소별 연산'],concept:'<b>Recycling Rule(재활용 규칙)</b>: 서로 다른 길이의 벡터를 계산할 때 짧은 벡터를 반복해 부족한 자리를 채웁니다.',bullets:['x = (2,4,6,8), y = (1,3)','y를 (1,3,1,3)으로 반복','x+y = (3,7,7,11)','길이가 긴 벡터가 짧은 벡터 길이의 정수배가 아니면 경고가 발생할 수 있음'],code:'x <- c(2, 4, 6, 8)\ny <- c(1, 3)\nx + y\n# [1] 3 7 7 11',tip:'벡터 길이가 서로 배수 관계인지 먼저 확인하면 예기치 않은 계산 오류를 예방할 수 있습니다.',comic:[['📏','길이 비교','4개 vs 2개'],['🔁','짧은 줄 반복','1,3 → 1,3,1,3'],['➕','같은 칸 더하기','2+1, 4+3…'],['✅','결과 확인','3,7,7,11']]},
{type:'theory',section:'03 행렬',title:'행렬은 행×열로 된 같은 타입의 표',subtitle:'R matrix()는 기본적으로 위에서 아래, 열 방향으로 채웁니다.',page:'212',topic:'matrix',keywords:['matrix()','byrow','%*%','t()'],concept:'<b>행렬(Matrix)</b>은 행과 열로 이뤄진 2차원 원자형 구조입니다. R의 기본 입력 순서는 <b>열 우선(byrow=FALSE)</b>입니다.',bullets:['matrix(1:6, nrow=2): 열 방향으로 순서대로 채움','byrow=TRUE: 행 방향으로 순서대로 채움','*는 같은 위치의 원소끼리 곱하기','%*%는 선형대수에서의 행렬곱','t(x) 전치, diag(x) 대각원소, solve(x) 역행렬'],code:'m <- matrix(1:6, nrow=2)\nm # [1,] 1 3 5 / [2,] 2 4 6\nm[2,3]           # 6\nt(m)              # 전치행렬',tip:'원문 일부 예시의 x[3,3]은 3×2 행렬에서는 범위를 벗어납니다. 인덱스는 실제 행·열 크기 안에서 선택해야 합니다.',comic:[['📦','숫자 6개','1~6 준비'],['⬇️','열부터 채움','기본값'],['➡️','행부터 채움','byrow=TRUE'],['✖️','곱셈 구별','* 와 %*%']]},
{type:'theory',section:'04 데이터프레임',title:'데이터프레임: 서로 다른 타입이 공존하는 표',subtitle:'한 열의 타입은 일정하지만, 서로 다른 열의 타입은 달라도 됩니다.',page:'212–214',topic:'frame',keywords:['data.frame()','$','[행,열]','str()'],concept:'<b>데이터프레임(Data Frame)</b>은 여러 벡터를 같은 길이로 모은 2차원 표입니다. <b>행은 개체, 열은 변수</b>를 의미합니다.',bullets:['이름은 문자, 나이는 숫자, 합격은 논리형으로 저장 가능','df$나이 → 특정 변수(열)','df[2,1] → 2행 1열','head(df) → 앞부분, str(df) → 구조 확인','subset(df, 나이 > 20) → 조건에 맞는 행'],code:'df <- data.frame(\n  이름=c("유리","민준","민지"),\n  나이=c(20,22,21),\n  합격=c(TRUE,FALSE,TRUE))\ndf$나이     # 20 22 21\nstr(df)     # 구조 확인',tip:'R 4.0 이후 data.frame()의 stringsAsFactors 기본값은 FALSE입니다. 선택 버튼으로 열별 타입을 살펴보세요.',comic:[['🧑‍🎓','한 줄 = 학생','개체(행)'],['🏷️','한 칸 열 = 변수','이름·나이'],['🔀','열 타입은 다름','문자·숫자·논리'],['🔍','조건으로 조회','subset()']]},
{type:'theory',section:'05 구조 비교',title:'벡터·행렬·데이터프레임·배열·리스트',subtitle:'시험에서는 차원보다 ‘자료형 혼합 가능 여부’를 함께 물어봅니다.',page:'210–214',topic:'structure',keywords:['vector','matrix','data.frame','array','list'],concept:'<b>핵심 비교</b>: 벡터·행렬·배열은 같은 원자형 타입, 데이터프레임은 열마다 다른 타입, 리스트는 원소마다 다른 객체·구조까지 담을 수 있습니다.',bullets:['벡터: 1차원, 동일한 원자형 타입','행렬: 2차원, 동일한 원자형 타입','배열: 다차원, 동일한 원자형 타입','데이터프레임: 2차원 표, 열마다 다른 타입 가능','리스트: 벡터, 표, 함수 등 서로 다른 객체 저장 가능'],code:'v <- c(1,2,3)\nm <- matrix(1:4,2,2)\na <- array(1:8,c(2,2,2))\nd <- data.frame(a=1:2,b=c("A","B"))\l <- list(v=v, df=d, fun=mean)',tip:'기출 3·4·5번을 푸는 데 필요한 가장 중요한 대비표입니다.',comic:[['🧵','벡터','한 줄의 같은 타입'],['🧊','행렬·배열','2D·다차원'],['📊','데이터프레임','열마다 다른 타입'],['🧰','리스트','무엇이든 담기']]},
{type:'theory',section:'06 데이터 결합',title:'rbind · cbind · merge 차이',subtitle:'표를 세로로 잇는지, 가로로 잇는지, 공통 키로 연결하는지 구분합니다.',page:'215',topic:'bind',keywords:['rbind','cbind','merge','by'],concept:'<b>rbind()</b>는 행으로 쌓고, <b>cbind()</b>는 열로 붙이며, <b>merge()</b>는 공통 키(key)를 기준으로 행을 맞춰 결합합니다.',bullets:['rbind: 열 수와 열 이름 등 구조가 호환되어야 함','cbind: 행 수가 맞아야 함 — 순서가 맞는지 주의','merge: 공통 열 값을 기준으로 결합','merge 기본값은 내부 결합(inner join)과 유사함'],code:'rbind(df1, df2)\ncbind(df1, df2)\nmerge(df1, df2, by="id")',tip:'관광객 설문조사를 연도별로 이어 붙이면 rbind, 개인별 속성과 예약 정보를 고객 ID로 결합하면 merge가 적합합니다.',comic:[['📚','rbind','아래로 쌓기'],['↔️','cbind','옆에 붙이기'],['🔑','merge','공통 ID 찾기'],['✅','결과 점검','행 수·중복 확인']]},
{type:'theory',section:'07 제어문',title:'for · while · repeat 는 언제 쓰나?',subtitle:'같은 일을 반복하지만 종료 조건을 정하는 방식이 다릅니다.',page:'215–216',topic:'loop',keywords:['for','while','repeat','break'],concept:'<b>for</b>는 정해진 값들의 순회, <b>while</b>은 조건이 TRUE일 때 반복, <b>repeat</b>는 명시적으로 중단할 때까지 계속 수행합니다.',bullets:['for(i in 1:3): i가 1, 2, 3일 때 각각 실행','while(i < 4): 조건이 TRUE인 동안 반복','repeat: 조건 없이 시작하며 보통 if + break로 중단','종료 조건을 갱신하지 않으면 무한 반복에 주의'],code:'for (i in 1:3) print(i)\n\ni <- 1\nwhile (i < 4) {\n  print(i)\n  i <- i + 1\n}',tip:'왼쪽에서 단계 버튼을 눌러 반복문의 현재 값과 다음 동작을 관찰할 수 있습니다.',comic:[['🎯','for','1~3 각각 수행'],['❓','while','참이면 계속'],['🔄','repeat','직접 멈춰야 함'],['🛑','break','반복 종료']]},
{type:'theory',section:'07 제어문',title:'if · else · ifelse · function',subtitle:'조건에 따라 다른 길을 선택하거나 작업을 함수로 묶습니다.',page:'216–217',topic:'conditions',keywords:['if','else if','ifelse()','function()'],concept:'<b>if/else</b>는 조건에 따른 실행 흐름을 나눕니다. <b>ifelse(조건,a,b)</b>는 각 원소에 참/거짓 값을 지정할 때 유용합니다.',bullets:['if: 조건이 TRUE일 때만 실행','else if / else: 다른 경우를 순서대로 처리','ifelse(): 조건 벡터를 받아 결과 벡터 생성 가능','function(x) {...}: 자주 쓰는 명령을 함수로 정의'],code:'score <- c(55, 81, 72)\nifelse(score >= 70, "통과", "재학습")\n# "재학습" "통과" "통과"\n\nadd2 <- function(x) x + 2\nadd2(5)  # 7',tip:'ifelse()는 벡터에 적용하면 각 원소별 결과를 반환합니다. if 조건문은 길이 1의 논리값을 요구합니다.',comic:[['❔','조건 확인','70점 이상?'],['🟢','TRUE','통과'],['🟡','FALSE','재학습'],['🛠️','함수로 묶기','기능 재사용']]},
{type:'theory',section:'08 문자열·날짜',title:'문자열·날짜 데이터를 다루는 도구',subtitle:'자르고, 붙이고, 찾고, 날짜를 원하는 문자 형식으로 바꿉니다.',page:'217–218',topic:'textdate',keywords:['paste','substr','gsub','Sys.Date','format'],concept:'<b>문자열 처리</b>는 길이·연결·추출·치환·검색을, <b>날짜 처리</b>는 날짜 객체를 만들고 원하는 형식으로 표시하는 작업입니다.',bullets:['nchar(): 글자 수 / paste(): 문자열 붙이기','substr(): 일부 문자 추출 / strsplit(): 구분자로 분리','sub(): 첫 일치 치환 / gsub(): 모든 일치 치환','grep(): 패턴을 가진 원소의 위치 검색','Sys.Date(): 오늘 날짜 / as.Date(): 날짜로 변환','format(x,"%Y-%m-%d"): 연-월-일 형태 표시'],code:'paste("스마트", "관광", sep="-")\n# "스마트-관광"\nsubstr("TOURISM", 1, 4) # "TOUR"\ngsub("a", "A", "banana") # "bAnAnA"\nformat(as.Date("2026-10-28"), "%Y")\n# "2026"',tip:'%Y=4자리 연도, %y=2자리 연도, %m=월, %d=일, %a=축약 요일, %B=월 전체 이름.',comic:[['🔗','paste','문자 이어붙이기'],['✂️','substr','일부 잘라내기'],['🖊️','gsub','모두 바꾸기'],['📅','format','날짜 표시 바꾸기']]},
{type:'theory',section:'09 기출 대비',title:'문제 전에 확인하는 5가지 핵심',subtitle:'자료구조 3문항, 벡터 반복 1문항, 함수 활용 1문항으로 이어집니다.',page:'218–219',topic:'summary',keywords:['리스트','벡터','데이터프레임','rep','example'],concept:'<b>시험 포인트 5개</b>를 그림으로 연결해 암기하지 않고 선택지와 대응해 봅니다.',bullets:['Q3: 서로 다른 객체를 한데 모으기 → 리스트','Q4: 1차원, 한 가지 타입 → 벡터','Q5: 각 열의 타입이 달라도 되는 표 → 데이터프레임','Q6: rep(times=2)와 rep(each=2)의 결과 차이','Q7: example(solve)는 예제 코드를 실제 실행'],code:'rep(1:4, times=2)\n# 1 2 3 4 1 2 3 4\nrep(1:4, each=2)\n# 1 1 2 2 3 3 4 4\nexample(solve) # 예제 실행',tip:'이제 오른쪽 위의 [기출문제 5개]를 누르거나 다음으로 넘어가 실제 선택지를 풀어보세요.',comic:[['🧰','Q3','리스트'],['🧵','Q4','벡터'],['📊','Q5','데이터프레임'],['🔁','Q6·7','반복·예제']]}
];

{num:3,year:'32회 기출',page:'218–219',concept:'리스트는 서로 다른 타입·객체를 하나로 묶을 수 있습니다.',question:'R에서는 데이터 타입이 다른 객체들을 하나의 객체로 묶을 수 있다. 다음 중 이러한 자료구조는 무엇인가?',options:['행렬','배열','리스트','벡터'],correct:2,visual:'quizList',hint:'관건은 “서로 다른 객체”입니다. 숫자 벡터와 문자 데이터, 표를 함께 담을 수 있는 구조를 찾으세요.',rationales:['행렬은 원자형 타입이 하나로 맞춰집니다.','배열도 동일한 원자형 타입을 저장합니다.','리스트는 벡터·행렬·데이터프레임·함수 등 다양한 객체를 담을 수 있습니다.','벡터는 같은 원자형 타입의 원소로 구성됩니다.']},

case 'matrix':{let nums=demo.byrow?[[1,2,3],[4,5,6]]:[[1,3,5],[2,4,6]];return `<div class="vis"><div class="vizHead">matrix(1:6, nrow=2, byrow=...)</div>${buttons('byrow',[false,true],['FALSE · 열 우선 (기본)','TRUE · 행 우선'])}<div class="matrix">${nums.flat().map((n,i)=>`<div style="background:${i===0?'#fff1b7':'white'}">${n}</div>`).join('')}</div><div class="diagram-note">위쪽이 1행, 아래쪽이 2행 · 총 2행 × 3열</div><div class="vfill"><span class="tag">* : 원소별 곱</span><span class="tag">%*% : 행렬곱</span><span class="tag">t(m) : 전치</span></div></div>`}

case 'structure':return `<div class="vis"><div class="vizHead">자료구조의 차원과 타입 규칙 비교</div><table class="dataTable"><thead><tr><th>구조</th><th>차원</th><th>혼합 가능?</th></tr></thead><tbody><tr><td>🧵 벡터</td><td>1D</td><td>✕</td></tr><tr><td>🧊 행렬</td><td>2D</td><td>✕</td></tr><tr><td>🧱 배열</td><td>다차원</td><td>✕</td></tr><tr><td>📊 데이터프레임</td><td>2D</td><td>열별 ✓</td></tr><tr><td>🧰 리스트</td><td>객체 모음</td><td>원소별 ✓</td></tr></tbody></table><div class="diagram-note">원자형 객체의 원소 타입 기준 · 리스트는 객체 종류까지 다르게 구성 가능</div></div>`;
case 'bind':{let x=demo.bind, html={rbind:`<div class="vfill"><div class="vbox">표 A<div class="small">id 1, 2</div></div><span class="arr">+</span><div class="vbox">표 B<div class="small">id 3, 4</div></div></div><div class="arr" style="text-align:center">↓</div><div class="minicard">행 4개 · 열 구성 유지</div>`,cbind:`<div class="vfill"><div class="vbox">표 A<div class="small">이름 열</div></div><span class="arr">+</span><div class="vbox">표 B<div class="small">나이 열</div></div></div><div class="arr" style="text-align:center">↓</div><div class="minicard">열 2개 · 행 수는 그대로</div>`,merge:`<div class="vfill"><div class="vbox">이름 표<div class="small">id 1, 2</div></div><div class="vbox yellow">공통 id 🔑</div><div class="vbox">예약 표<div class="small">id 2, 3</div></div></div><div class="arr" style="text-align:center">↓</div><div class="minicard">양쪽에 있는 id = 2만 일치 (기본 내부 결합)</div>`}[x];return `<div class="vis"><div class="vizHead">붙이는 방법을 바꿔 보세요</div>${buttons('bind',['rbind','cbind','merge'],['rbind · 세로','cbind · 가로','merge · 키'])}${html}</div>`}

case 'quizVector':return `<div class="vis"><div class="vizHead">벡터: 1차원 + 같은 타입</div><div class="visrow">${[1,2,3,4].map(x=>cell(x)).join('')}</div><div class="minicard">c(1, 2, 3, 4) · numeric</div><div class="visrow">${['"가"','"나"','"다"'].map(x=>cell(x,'cyan')).join('')}</div><div class="diagram-note">숫자만 가능한 것이 아니라 문자형·논리형 벡터도 만들 수 있습니다.</div></div>`;
case 'quizFrame':return `<div class="vis"><div class="vizHead">데이터프레임: 열 타입이 다를 수 있음</div><table class="df"><tr><th>이름 🔤</th><th>나이 🔢</th><th>합격 ✅</th></tr><tr><td>유리</td><td>20</td><td>TRUE</td></tr><tr><td>민준</td><td>22</td><td>FALSE</td></tr></table><div class="vfill"><span class="tag">character</span><span class="tag">numeric</span><span class="tag">logical</span></div><div class="diagram-note">행=사람 / 열=변수, 표의 각 열마다 타입이 달라도 됩니다.</div></div>`;
case 'quizRep':{let t=demo.rep;let a=t==='times'?[1,2,3,4,1,2,3,4]:[1,1,2,2,3,3,4,4];return `<div class="vis"><div class="vizHead">rep() 결과를 직접 비교</div>${buttons('rep',['times','each'],['times=2 · 묶음 반복','each=2 · 원소 반복'])}<div class="visrow">${a.map((n,i)=>cell(n,t==='times'?(i<4?'cyan':'gold'):(i%2===0?'cyan':'gold'))).join('')}</div><div class="minicard" style="font-size:16px">rep(1:4, ${t}=2)</div><div class="diagram-note">times: 1 2 3 4 / 1 2 3 4 · each: 1 1 / 2 2 / 3 3 / 4 4</div></div>`}
case 'quizExample':return `<div class="vis"><div class="vizHead">도움말 보기와 예제 실행은 다릅니다</div><div class="vfill"><div class="vbox"><div class="big">📖</div>help(solve)<div class="small">설명 문서 읽기</div></div><span class="arr">≠</span><div class="vbox green"><div class="big">▶️</div>example(solve)<div class="small">예제 명령 실행</div></div></div><div class="minicard" style="font-size:15px">example()은 도움말의 Examples에 있는 코드 실행</div></div>`;
default:return ''}}
function cover(){return `<div class="hero"><div class="eyebrow">PART 03 · 데이터 분석 / 2장 R 프로그래밍 기초</div><h2>R의 데이터는<br><em>어떻게 담고, 다루고, 반복할까?</em></h2><p>데이터 타입 → 벡터·행렬·데이터프레임·리스트 → 데이터 결합·반복문 → 문자열·날짜 → 실제 기출 5문항까지. 그림·코드·상호작용으로 연결해 학습합니다.</p><div class="keycloud"><span>교재 208–219쪽</span><span>이론 13개 단원</span><span>기출 3–7번 · 5문항</span><span>좌우넘김</span></div></div><h3 style="font-size:22px;margin:24px 0 10px">🎯 수업 학습목표</h3><div class="goalgrid"><div class="goal"><div class="goalicon">🧩</div><b>1. 데이터 타입 구분</b><small>numeric·character·logical·factor 및 특수값의 의미 설명</small></div><div class="goal"><div class="goalicon">🧱</div><b>2. 자료구조 비교</b><small>벡터·행렬·배열·데이터프레임·리스트의 차이 판단</small></div><div class="goal"><div class="goalicon">🔄</div><b>3. 코드 결과 예측</b><small>인덱싱·벡터 연산·rep()·반복문·조건문 이해</small></div><div class="goal"><div class="goalicon">📝</div><b>4. 기출문제 해결</b><small>주어진 코드와 선택지에 논리적으로 답하고 설명</small></div></div><h3 style="font-size:20px;margin:22px 0 8px">🟨 핵심 키워드 미리보기</h3>${tags(['자료형 Type','벡터 Vector','행렬 Matrix','데이터프레임 Data Frame','리스트 List','반복 Recycling','자료 결합 Bind','함수 Function'])}<div class="outline"><div>① 데이터 타입</div><div>② 자료구조</div><div>③ 데이터 핸들링</div><div>④ 기출 5문항</div></div>`}
function theory(x){return `<div class="kicker"><span class="pill">${x.section}</span><span class="pill gold">교재 pp. ${x.page}</span><span>시각화 이론 · 코드 · 4컷 요약</span></div><h1 class="stitle">${x.title}</h1><p class="slead">${x.subtitle}</p><div class="twocol"><div class="panel diagram"><div class="ptitle"><i></i>그림으로 원리 이해하기</div>${visual(x.topic)}</div><div class="panel"><div class="ptitle"><i></i>핵심 개념과 R 코드</div><p class="concept">${x.concept}</p><ul class="bullets">${x.bullets.map(t=>`<li>${t}</li>`).join('')}</ul><div class="codebox">${esc(x.code)}</div><div class="callout"><b>🔎 기억할 점</b> ${x.tip}</div></div></div>${comic(x.comic)}`}
function quiz(q,idx){let a=selections[idx],isShown=!!revealed[idx],correct=q.correct;return `<div class="kicker"><span class="pill green">기출문제 ${idx+1} / ${quizzes.length}</span><span class="pill gold">${q.year} · 교재 p. ${q.page}</span><span>정답 선택 → 해설 확인 → 좌우 넘김</span></div><h1 class="stitle">기출 ${q.num}번 · 개념 그림 + 문제 풀이</h1><p class="slead">먼저 왼쪽의 원리를 살핀 뒤 선택지를 고르고 <span class="keyword">정답과 해설 보기</span>를 눌러주세요.</p><div class="quizLayout"><div class="quizvisual"><div class="ptitle"><i></i>문제 관련 이론 시각화</div>${visual(q.visual)}<div class="callout"><b>핵심 이론</b> ${q.concept}</div><div class="hint">💡 ${q.hint}</div></div><div class="quizarea"><div class="qnumber">Q${q.num} · ${q.year}</div><div class="qquestion">${q.question}</div><div class="choices">${q.options.map((t,i)=>`<button class="choice ${a===i?'selected':''} ${isShown&&i===correct?'correct':''} ${isShown&&a===i&&a!==correct?'incorrect':''}" data-choice="${i}" ${isShown?'disabled':''}><span class="circ">${['①','②','③','④'][i]}</span><span>${esc(t)}</span></button>`).join('')}</div>${isShown?`<div class="feedback ${a!==correct?'miss':''}"><div class="fbheading">${a===correct?'✅ 정답입니다!':'🔎 정답을 다시 확인하세요.'} 정답 ${['①','②','③','④'][correct]}</div><ul class="rationale">${q.rationales.map((t,i)=>`<li><strong>${['①','②','③','④'][i]} ${i===correct?'정답':'오답'}:</strong> ${t}</li>`).join('')}</ul></div>`:`<button class="answerbtn" data-reveal="${idx}" ${a===undefined?'disabled':''}>정답과 해설 보기</button>`}</div></div>`}
function render(){const total=totalTheory+quizzes.length;let isQuiz=pos>=totalTheory;let idx=pos-totalTheory;const stage=$('stage');stage.innerHTML=isQuiz?quiz(quizzes[idx],idx):pos===0?cover():theory(chapters[pos]);$('current').textContent=String(pos+1).padStart(2,'0');$('total').textContent=String(total);$('where').textContent=isQuiz?'기출문제':'학습 화면';$('progressbar').style.width=((pos+1)/total*100)+'%';$('theoryTab').classList.toggle('active',!isQuiz);$('quizTab').classList.toggle('active',isQuiz);$('prev').disabled=pos===0;$('next').disabled=pos===total-1;$('next').textContent=isQuiz&&idx===quizzes.length-1?'마지막 문제':pos===totalTheory-1?'문제 풀기 →':'다음 →';$('dots').innerHTML=Array.from({length:isQuiz?quizzes.length:totalTheory},(_,i)=>`<span class="dot ${(isQuiz?idx:pos)===i?'active':''}"></span>`).join('');$('toclist').innerHTML=chapters.map((s,i)=>`<button class="tocitem ${i===pos?'current':''}" data-jump="${i}"><span>이론 ${String(i+1).padStart(2,'0')} · pp. ${s.page}</span>${s.title}</button>`).join('')+quizzes.map((s,i)=>`<button class="tocitem ${i+totalTheory===pos?'current':''}" data-jump="${i+totalTheory}"><span>기출 · 교재 p. ${s.page}</span>기출 ${s.num}번 · ${s.year}</button>`).join('');}
function go(n){pos=Math.max(0,Math.min(totalTheory+quizzes.length-1,n));render();window.scrollTo({top:0,behavior:'instant'});}
$('prev').onclick=()=>go(pos-1);$('next').onclick=()=>go(pos+1);$('theoryTab').onclick=()=>go(0);$('quizTab').onclick=()=>go(totalTheory);$('homeBtn').onclick=()=>go(0);$('tocBtn').onclick=()=>$('toc').classList.add('open');$('closeToc').onclick=()=>$('toc').classList.remove('open');$('toc').addEventListener('click',e=>{if(e.target===$('toc'))$('toc').classList.remove('open');const x=e.target.closest('[data-jump]');if(x){$('toc').classList.remove('open');go(+x.dataset.jump)}});$('fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
$('stage').addEventListener('click',e=>{const d=e.target.closest('[data-demo]');if(d){let {demo:key,value}=d.dataset;demo[key]=value==='true'?true:value==='false'?false:key==='index'||key==='loop'||key==='grade'?Number(value):value;render();return;}const c=e.target.closest('[data-choice]');if(c){let idx=pos-totalTheory;if(idx>=0&&!revealed[idx]){selections[idx]=+c.dataset.choice;render();}return;}const r=e.target.closest('[data-reveal]');if(r){revealed[+r.dataset.reveal]=true;render();}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight')go(pos+1);else if(e.key==='ArrowLeft')go(pos-1);else if(e.key==='Escape')$('toc').classList.remove('open')});
let touchstart=null;const swipe=$('stage');swipe.addEventListener('touchstart',e=>{touchstart={x:e.touches[0].clientX,y:e.touches[0].clientY}}, {passive:true});swipe.addEventListener('touchend',e=>{if(!touchstart)return;let dx=e.changedTouches[0].clientX-touchstart.x;let dy=e.changedTouches[0].clientY-touchstart.y;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.5)go(pos+(dx<0?1:-1));touchstart=null},{passive:true});
render();
</script>
</body>
</html>
