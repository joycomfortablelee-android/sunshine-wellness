/div></div><main><div class="heading"><div><div class="chapter" id="chapter"></div><h1 id="title"></h1></div><div class="subtitle" id="subtitle"></div></div><div class="layout"><section class="panel"><div class="paneltitle">STUDENT MATERIAL · 학생용 학습자료</div><div id="content"></div></section><aside class="panel notes"><div class="paneltitle">LECTURE SCRIPT · 교수자 설명 대본</div><div class="audiobar"><button class="primary" id="play">▶ 재생</button><button id="pause">Ⅱ 일시정지</button><button id="stop">■ 정지</button><label class="hint">속도 <select id="speed"><option>.75</option><option>1.0</option><option>1.25</option><option selected>1.5</option><option>1.75</option><option>2.0</option><option>2.5</option><option>3.0</option></select>×</label><select id="voice" aria-label="음성 선택"><option value="">기본 한국어 음성</option></select></div><div class="hint" id="audioStatus">브라우저 한국어 TTS · 기본 1.5배속 (녹음 파일 아님)</div><div id="script" class="script-sections"></div><div class="question"><b>학생에게 질문하기</b><br><span id="question"></span><button id="readQuestion" style="margin-top:6px;font-size:12px">▶ 질문 읽기</button></div></aside></div></main><div class="bottom"><button id="prev2">← 이전 장면</button><span><span id="bottomCount"></span> · 키보드 ← / → · 사진 클릭 확대</span><button id="next2">다음 장면 →</button></div><dialog id="zoomDialog"><button onclick="document.getElementById('zoomDialog').close()">닫기 ✕</button><img id="zoomImg" alt="확대 사진"></dialog><script>
const slides=[{"ch": "01 개념", "title": "오늘의 학습 목표와 지도", "sub": "개념 → 기술 → 고객 여정 → 경영·사례 → 미래 직무·실습", "body": "<div class=\"tiles objective-grid\"><article><b>01 개념</b><p><strong>전통적 호텔과 스마트 호텔의 차이</strong>를 이해하고, 스마트 기술이 <strong>호텔 운영과 고객 경험</strong>을 어떻게 변화시키는지 설명할 수 있다.</p></article><article><b>02 기술</b><p><strong>AI, IoT, 빅데이터, 로봇, 클라우드, 모바일, VR·AR</strong>의 개념을 이해하고, 각 기술의 <strong>호텔 서비스 적용 방식</strong>을 설명할 수 있다.</p></article><article><b>03 고객 여정</b><p><strong>예약부터 퇴실 후 관리까지의 고객 여정(Customer Journey)</strong>을 이해하고, 단계별 기술이 <strong>고객 편의와 만족도</strong>에 어떻게 기여하는지 설명할 수 있다.</p></article><article><b>04 호텔 경영</b><p><strong>PMS, RMS, CRM</strong>의 역할을 이해하고, 데이터 분석이 <strong>객실 운영, 수익관리, 고객관리 및 의사결정</strong>에 어떻게 활용되는지 설명할 수 있다.</p></article><article><b>05 실제 사례</b><p>국내외 스마트 호텔 사례를 통해 <strong>기술 도입의 성공 요인과 한계</strong>를 파악하고, 호텔 현장에서의 <strong>적용 가능성</strong>을 분석할 수 있다.</p></article><article><b>06 미래 직무</b><p>스마트 호텔에서 요구되는 <strong>디지털 역량과 직무 변화</strong>를 이해하고, 팀 활동을 통해 <strong>미래 호텔 서비스</strong>를 직접 설계할 수 있다.</p></article></div><div class=\"key\"><strong>학습성과:</strong> 스마트 기술을 <strong>호텔의 문제 해결, 고객 경험 개선, 경영성과</strong>에 연결하여 설명하고, 이를 바탕으로 <strong>스마트 호텔 서비스</strong>를 설계할 수 있다.</div><button class=\"comic-preview\" onclick=\"openHotelComic()\" aria-label=\"스마트 호텔 4컷 만화 전체 보기\"><img id=\"comicPreviewImage\" alt=\"스마트 호텔 4컷 만화 미리보기\"><span><strong>스마트 호텔의 하루 · 4컷 만화</strong><small>AI 예약 → 모바일 체크인·디지털 키 → 스마트 객실 → 앱·로봇 서비스</small><b>4컷 만화 전체 보기 →</b></span></button>", "script": "여러분, 오늘은 전통적 호텔과 스마트 호텔의 차이부터 시작합니다. 인공지능과 사물인터넷을 비롯한 일곱 가지 기술이 실제 호텔 서비스에 어떻게 쓰이는지 살펴보겠습니다. 특히 예약부터 퇴실 후 관리까지의 고객 여정을 따라가며 고객이 체감하는 편의와 만족을 생각해 봅시다. 호텔 내부에서는 PMS, RMS, CRM과 데이터를 활용해 객실 운영, 수익관리, 고객관리, 직원 배치를 개선합니다. 국내외 사례의 성공 요인과 한계도 함께 검토하겠습니다. 마지막에는 팀별로 안동의 가상 호텔을 설계해 봅니다. 오늘의 핵심은 기술 이름을 외우는 것이 아니라, 호텔의 문제 해결과 고객 경험 개선, 경영성과에 기술을 연결하는 것입니다.", "q": "기술 이름을 아는 것과 기술을 경영에 활용하는 것은 어떻게 다를까요?", "scriptHtml": "여러분, 오늘은 <strong>전통적 호텔과 스마트 호텔의 차이</strong>부터 시작합니다. 인공지능과 사물인터넷을 비롯한 <strong>일곱 가지 기술</strong>이 실제 호텔 서비스에 어떻게 쓰이는지 살펴보겠습니다. 특히 <strong>예약부터 퇴실 후 관리까지의 고객 여정</strong>을 따라가며 고객이 체감하는 편의와 만족을 생각해 봅시다. 호텔 내부에서는 <strong>PMS, RMS, CRM</strong>과 데이터를 활용해 객실 운영, 수익관리, 고객관리, 직원 배치를 개선합니다. 국내외 사례의 <strong>성공 요인과 한계</strong>도 함께 검토하겠습니다. 마지막에는 팀별로 안동의 가상 호텔을 설계해 봅니다. 오늘의 핵심은 기술 이름을 외우는 것이 아니라, <strong>호텔의 문제 해결과 고객 경험 개선, 경영성과</strong>에 기술을 연결하는 것입니다."}, {"ch": "01 개념", "title": "스마트 호텔의 이해", "sub": "SMART HOTEL · 스마트관광과 호텔경영", "body": "<div class=\"photos\"><figure><div class=\"pic\"><div class=\"fallback\">▧<br>스마트 객실 음성 단말·서비스<br><small>외부 사진 · 연결 필요</small></div><img src=\"https://v3-statics.mirrormedia.mg/images/20230822134737-7cb7b07583c0ad6a2c4ebb7b577c5127.png\" alt=\"스마트 객실 음성 단말·서비스\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onclick=\"zoom(this)\" onerror=\"this.style.display='none'\"></div><figcaption>스마트 객실 음성 단말·서비스 · <a href=\"https://www.mirrormedia.mg/story/20230822fin002\" target=\"_blank\" rel=\"noopener\">출처</a> <span>⤢ 확대</span></figcaption></figure><figure><div class=\"pic\"><div class=\"fallback\">▧<br>셀프 체크인과 배송 로봇<br><small>외부 사진 · 연결 필요</small></div><img src=\"https://img.etnews.com/news/article/2024/02/23/news-p.v1.20240223.ee6370d9b10847e6aa07e2ff0f47e7b9_P1.png\" alt=\"셀프 체크인과 배송 로봇\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onclick=\"zoom(this)\" onerror=\"this.style.display='none'\"></div><figcaption>셀프 체크인과 배송 로봇 · <a href=\"https://www.etnews.com/20240223000192\" target=\"_blank\" rel=\"noopener\">출처</a> <span>⤢ 확대</span></figcaption></figure><figure><div class=\"pic\"><div class=\"fallback\">▧<br>힐튼 디지털 키<br><small>외부 사진 · 연결 필요</small></div><img src=\"https://stories.hilton.com/uploads/2023/10/ConnectivityPersonalization-Hilton-Digital-Key.jpg\" alt=\"힐튼 디지털 키\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onclick=\"zoom(this)\" onerror=\"this.style.display='none'\"></div><figcaption>힐튼 디지털 키 · <a href=\"https://stories.hilton.com/videos/how-to-use-digital-key-with-the-hilton-honors-app\" target=\"_blank\" rel=\"noopener\">출처</a> <span>⤢ 확대</span></figcaption></figure></div><div class=\"key\">핵심 질문: 기술이 호텔의 고객 경험과 경영 의사결정을 어떻게 바꾸는가?</div><div class=\"flow\"><div>고객 경험</div><i>→</i><div>데이터 연결</div><i>→</i><div>운영 효율</div><i>→</i><div>경영성과</div></div>", "script": "여러분, 호텔에 도착해서 프런트에 들르지 않고 바로 객실로 들어갈 수 있다면 어떨까요? 수건을 요청하면 로봇이 가져다주고, 호텔은 예약 데이터를 분석해 객실 가격과 직원 배치를 결정합니다. 오늘은 로봇 자체보다 고객 경험과 호텔 경영이 어떻게 달라지는지 살펴보겠습니다. 스마트 호텔이 호텔리어의 일을 없애는 것인지, 아니면 새로운 일을 만드는 것인지도 함께 생각해 봅시다.", "q": "여러분이 이용해 본 스마트 호텔 서비스는 무엇인가요?", "scriptHtml": "여러분, 호텔에 도착해서 <strong>프런트에 들르지 않고 바로 객실로</strong> 들어갈 수 있다면 어떨까요? 수건을 요청하면 <strong>로봇이 가져다주고</strong>, 호텔은 <strong>예약 데이터를 분석해 객실 가격과 직원 배치</strong>를 결정합니다. 오늘은 로봇 자체보다 <strong>고객 경험과 호텔 경영</strong>이 어떻게 달라지는지 살펴보겠습니다. 스마트 호텔이 호텔리어의 일을 없애는 것인지, 아니면 <strong>새로운 일을 만드는</strong> 것인지도 함께 생각해 봅시다."}, {"ch": "01 개념", "title": "스마트 호텔이란?", "sub": "Smart Hotel ≠ 무인 호텔", "body": "<div class=\"photos\"><figure><div class=\"pic\"><div class=\"fallback\">▧<br>스마트 객실 음성 단말·서비스<br><small>외부 사진 · 연결 필요</small></div><img src=\"https://v3-statics.mirrormedia.mg/images/20230822134737-7cb7b07583c0ad6a2c4ebb7b577c5127.png\" alt=\"스마트 객실 음성 단말·서비스\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onclick=\"zoom(this)\" onerror=\"this.style.display='none'\"></div><figcaption>스마트 객실 음성 단말·서비스 · <a href=\"https://www.mirrormedia.mg/story/20230822fin002\" target=\"_blank\" rel=\"noopener\">출처</a> <span>⤢ 확대</span></figcaption></figure><figure><div class=\"pic\"><div class=\"fallback\">▧<br>프런트 응대 (출처의 AI 생성 예시)<br><small>외부 사진 · 연결 필요</small></div><img src=\"https://hrc-international.com/hs-fs/hubfs/AI-Generated%20Media/Images/Generate%20me%20an%20image%20described%20a%20hospitality%20professional%20doing%20their%20job%20as%20a%20frontdesk%20in%20a%20luxury%20hotel%20while%20serve%20a%20customer%20with%20smile%20and%20profe.png?height=900&amp;name=Generate+me+an+image+described+a+hospitality+professional+doing+their+job+as+a+frontdesk+in+a+luxury+hotel+while+serve+a+customer+with+smile+and+profe.png&amp;width=1600\" alt=\"프런트 응대 (출처의 AI 생성 예시)\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onclick=\"zoom(this)\" onerror=\"this.style.display='none'\"></div><figcaption>프런트 응대 (출처의 AI 생성 예시) · <a href=\"https://hrc-international.com/blog/top-skills-hospitality-training-programs\" target=\"_blank\" rel=\"noopener\">출처</a> <span>⤢ 확대</span></figcaption></figure></div><div class=\"key\">디지털 기술로 <mark>고객 경험 개선</mark>과 <mark>운영 및 경영 의사결정 효율화</mark>를 추구하는 호텔.</div><div class=\"flow\"><div>데이터 수집</div><i>→</i><div>시스템 연결</div><i>→</i><div>분석·자동화</div><i>→</i><div>서비스·경영 개선</div></div><div class=\"tiles\"><article><b>Smart hotel</b><p>직원과 기술이 협업할 수 있음</p></article><article><b>Unmanned hotel</b><p>대면 인력을 최소화하는 운영 형태</p></article></div>", "script": "스마트 호텔은 무인 호텔과 같은 말이 아닙니다. 직원이 많은 특급호텔도 고객 정보와 객실 상태를 실시간으로 공유하고, 데이터를 활용해 서비스를 개인화한다면 스마트 호텔이라고 볼 수 있습니다. 핵심은 기술의 개수가 아니라 기술들이 연결되어 고객과 호텔에 어떤 가치를 만드는가입니다.", "q": "5성급 호텔은 직원을 줄이지 않고도 스마트 호텔이 될 수 있을까요?", "scriptHtml": "스마트 호텔은 <strong>무인 호텔과 같은 말이 아닙니다</strong>. 직원이 많은 특급호텔도 <strong>고객 정보와 객실 상태</strong>를 <strong>실시간으로 공유</strong>하고, 데이터를 활용해 <strong>서비스를 개인화</strong>한다면 스마트 호텔이라고 볼 수 있습니다. 핵심은 기술의 개수가 아니라 <strong>기술들이 연결되어 고객과 호텔에 어떤 가치</strong>를 만드는가입니다."}, {"ch": "01 개념", "title": "전통적 호텔 vs 스마트 호텔", "sub": "서비스와 경영관리의 변화", "body": "<div class=\"tablewrap\"><table class=\"hotel-compare\"><thead><tr><th>구분</th><th>전통적 방식</th><th>스마트 방식</th></tr></thead><tbody><tr><td>예약</td><td>전화·웹 예약</td><td>AI 맞춤 추천</td></tr><tr><td>체크인</td><td>프런트 직원</td><td>모바일·키오스크</td></tr><tr><td>객실 출입</td><td>카드키</td><td>디지털 키</td></tr><tr><td>객실 관리</td><td>수동 조작</td><td>IoT·음성 제어</td></tr><tr><td>룸서비스</td><td>전화 주문</td><td>QR·앱·로봇</td></tr><tr><td>고객 응대</td><td>직원 직접 응대</td><td>AI·직원 협업</td></tr><tr><td>객실 가격</td><td>관리자 판단</td><td>수요예측·가격 결정</td></tr><tr><td>인력</td><td>고정 근무표</td><td>수요 기반 배치</td></tr><tr><td>에너지</td><td>수동 조절</td><td>재실 기반 제어</td></tr><tr><td>고객 관리</td><td>고객 명단</td><td>개인화 마케팅</td></tr></tbody></table></div><div /p></article><article><b>에너지관리</b><p><strong>재실 기반</strong> 조명·냉난방 제어</p></article></div>", "script": "그림의 첫 번째 장면에서는 AI 맞춤 추천을 통해 고객의 여행 일정과 선호에 맞는 객실을 찾습니다. 두 번째 장면에서는 모바일 체크인과 디지털 키로 입실 절차를 간소화합니다. 세 번째 장면에서는 IoT와 음성 제어를 통해 조명, 온도, 커튼을 조절합니다. 네 번째 장면에서는 앱으로 룸서비스를 주문하고 로봇 배달과 개인화 마케팅을 경험합니다. 그림에는 직접 나타나지 않지만 호텔 내부에서는 객실 수요예측과 가격 결정, 인력 배치, 재실 기반 에너지 제어도 이루어질 수 있습니다. 중요한 점은 전통적인 직원 서비스와 스마트 기술이 공존할 수 있다는 것입니다.", "scriptHtml": "그림의 첫 번째 장면에서는 <strong>AI 맞춤 추천</strong>을 통해 고객의 여행 일정과 선호에 맞는 객실을 찾습니다. 두 번째 장면에서는 <strong>모바일 체크인과 디지털 키</strong>로 입실 절차를 간소화합니다. 세 번째 장면에서는 <strong>IoT와 음성 제어</strong>를 통해 조명, 온도, 커튼을 조절합니다. 네 번째 장면에서는 앱으로 룸서비스를 주문하고 <strong>로봇 배달과 개인화 마케팅</strong>을 경험합니다. 그림에는 직접 나타나지 않지만 호텔 내부에서는 <strong>객실 수요예측과 가격 결정, 인력 배치, 재실 기반 에너지 제어</strong>도 이루어질 수 있습니다. 중요한 점은 <strong>전통적인 직원 서비스와 스마트 기술이 공존할 수 있다</strong>는 것입니다.", "q": "네 장면 중 고객의 불편을 가장 많이 줄이는 기술은 무엇일까요? 호텔 내부의 경영성과와도 연결해 보세요."}, {"ch": "02 기술", "title": "① 인공지능 AI", "sub": "Artificial Intelligence · 판단과 추천", "body": "<div class=\"photos\"><figure><div class=\"pic\"><div class=\"fallback\">▧<br>스마트 객실 음성 단말·서비스<br><small>외부 사진 · 연결 필요</small></div><img src=\"https://v3-statics.mirrormedia.mg/images/20230822134737-7cb7b07583c0ad6a2c4ebb7b577c5127.png\" alt=\"스마트 객실 음성 단말·서비스\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onclick=\"zoom(this)\" onerror=\"this.style.display='none'\"></div><figcaption>스마트 객실 음성 단말·서비스 · <a href=\"https://www.mirrormedia.mg/story/20230822fin002\" target=\"_blank\" rel=\"noopener\">출처</a> <span>⤢ 확대</span></figcaption></figure><figure><div class=\"pic\"><div class=\"fallback\">▧<br>웨스틴 스마트 버틀러 QR<br><small>외부 사진 · 연결 필요</small></div><img src=\"https://t1.daumcdn.net/news/202604/25/mk/20260425220002338ugpf.jpg\" alt=\"웨스틴 스마트 버틀러 QR\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onclick=\"zoom(this)\" onerror=\"this.style.display='none'\"></div><figcaption>웨스틴 스마트 버틀러 QR · <a href=\"https://www.mk.co.kr/news/business/12027334\" target=\"_blank\" rel=\"noopener\ \" onclick=\"zoom(this)\" onerror=\"this.style.display='none'\"></div><figcaption>객실 QR 안내판 · <a href=\"https://en.travie.com/news/articleView.html?idxno=150\" target=\"_blank\" rel=\"noopener\">출처</a> <span>⤢ 확대</span></figcaption></figure></div><div class=\"flow\"><div>앱·키오스크</div><i>→</i><div>예약·신원 확인</div><i>→</i><div>디지털 키 발급</div><i>→</i><div>객실 입실</div></div><div class=\"key\">모바일 체크인, 디지털 키, 간편결제 · 적용 호텔과 고객 조건에 따라 달라짐.</div>", "script": "모바일 기술은 고객이 호텔을 이용하는 접점을 스마트폰으로 옮깁니다. 체크인, 객실 선택, 디지털 키, 결제를 지원하는 경우 고객의 대기시간을 줄일 수 있습니다. 하지만 스마트폰이 없거나 배터리가 꺼졌을 때는 직원과 카드키가 대안이 되어야 합니다.", "q": "디지털 키만 제공하는 호텔을 모든 고객이 편리하게 이용할 수 있을까요?", "scriptHtml": "<strong>모바일 기술</strong>은 고객이 호텔을 이용하는 접점을 <strong>스마트폰</strong>으로 옮깁니다. <strong>체크인, 객실 선택, 디지털 키, 결제</strong>를 지원하는 경우 고객의 <strong>대기시간</strong>을 줄일 수 있습니다. 하지만 <strong>스마트폰</strong>이 없거나 배터리가 꺼졌을 때는 <strong>직원과 카드키가 대안</strong>이 되어야 합니다."}, {"ch": "02 기술", "title": "⑦ 가상현실·증강현실", "sub": "VR · AR · 예약 전 체험과 현장 정보", "body": "<div class=\"photos\"><figure><div class=\"pic\"><div class=\"fallback\">▧<br>360° 객실 투어 예시<br><small>외부 사진 · 연결 필요</small></div><img src=\"https://gc.360-data.com/tours/FIYBGJCTS/FIYBGJCTS-cjoGXsyW2R9lV-scene.jpg\" alt=\"360° 객실 투어 예시\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onclick=\"zoom(this)\" onerror=\"this.style.display='none'\"></div><figcaption>360° 객실 투어 예시 · <a href=\"https://app.cloudpano.com/tours/FIYBGJCTS\" target=\"_blank\" rel=\"noopener\">출처</a> <span>⤢ 확대</span></figcaption></figure></div><div class=\"tiles\"><article><b>VR / 360° 투어</b><p>예약 전에 객실 구조·뷰·시설을 살펴봄. 360° 영상은 몰입형 VR과 반드시 동일하지 않음.</p></article><article><b>AR</b><p>실제 공간 화면 위에 시설 방향, 관광 정보 등을 표시</p></article></div><a class=\"source\" href=\"https://app.cloudpano.com/tours/FIYBGJCTS\" target=\"_blank\" rel=\"noopener\">360° 투어 예시 열기 ↗</a>", "script": "가상현실과 증강현실은 고객이 공간을 이해하도록 돕습니다. 예약 전에 360도 객실 투어를 보면 사진 한 장보다 객실 구조를 더 쉽게 파악할 수 있습니다. 증강현실은 실제 화면 위에 시설 방향이나 정보를 덧붙이는 방식입니다. 고객의 예약 불확실성을 줄일 수 있는지가 중요한 평가 기준입니다.", "q": "객실 사진과 360도 투어가 예약 의사결정에 주는 정보는 어떻게 다를까요?", "scriptHtml": "<strong>가상현실과 증강현실</strong>은 고객이 공간을 이해하도록 돕습니다. 예약 전에 <strong>360도 객실 투어</strong>를 보면 사진 한 장보다 객실 구조를 더 쉽게 파악할 수 있습니다. 증강현실은 <strong>실제 화면 위에 시설 방향이나 정보를 덧붙이는</strong> 방식입니다. 고객의 <strong>예약 불확실성</strong>을 줄일 수 있는지가 중요한 평가 기준입니다."}, {"ch": "03 고객 여정", "title": "고객 여정 인터랙티브", "sub": "Customer Journey · 단계별 데이터와 경영효과", "body": "<div id=\"journey\"></div><div class=\"key\">단계를 클릭하면 고객 행동·기술·데이터·호텔 경영효과가 바뀝니다.</div>", "script": "여러분이 호텔 투숙객이라고 생각해 봅시다. 호텔을 검색하고 예약하며, 도착해 체크인하고 객실과 부대시설을 이용합니다. 퇴실 후에는 리뷰를 작성합니다. 각 단계의 행동에서 데이터가 생성되고 호텔은 그 데이터를 활용합니다. 버튼을 하나씩 눌러 어떤 기술이 고객과 경영에 연결되는지 확인해 보겠습니다.", "q": "고객 여정 중 불편이 가장 많이 발생할 것 같은 단계는 어디인가요?", "scriptHtml": "여러분이 <strong>호텔 투숙객</strong>이라고 생각해 봅시다. 호텔을 <strong>검색하고 예약</strong>하며, 도착해 <strong>체크인</strong>하고 <strong>객실과 부대시설</strong>을 이용합니다. 퇴실 후에는 <strong>리뷰</strong>를 작성합니다. 각 단계의 행동에서 <strong>데이터가 생성</strong>되고 호텔은 그 데이터를 활용합니다. 버튼을 하나씩 눌러 어떤 <strong>기술이 고객과 경영에 연결</strong>되는지 확인해 보겠습니다."}, {"ch": "03 고객 여정", "title": "예약부터 퇴실 후까지", "sub": "7단계 한눈에 비교", "body": "<div class=\"tablewrap\"><table><thead><tr><th>단계</th><th>기술</th><th>데이터</th><th>경영효과</th></tr></thead><tbody><tr><td>여행 준비</td><td>AI 추천</td><td>검색·선호</td><td>예약 전환</td></tr><tr><td>예약</td><td>CRS·RMS</td><td>날짜·가격·수요</td><td>수익관리</td></tr><tr><td>도착</td><td>키오스크·앱</td><td>입실·객실 상태</td><td>대기 감소</td></tr><tr><td>객실</td><td>IoT·디지털 키</td><td>재실·요청</td><td>편의·에너지</td></tr><tr><td>부대시설</td><td>QR·POS·로봇</td><td>주문·금액</td><td>F&B 매출</td></tr><tr><td>퇴실</td><td>PMS·결제</td><td>이용액·퇴실</td><td>정산·회전</td></tr><tr><td>이후</td><td>CRM·리뷰 AI</td><td>만족·이용이력</td><td>재방문</td></tr></tbody></table></div><div class=\"photos\"><figure><div class=\"pic\"><div class=\"fallback\">▧<br>힐튼 디지털 키<br><small>외부 사진 · 연결 필요</small></div><img src=\"https://stories.hilton.com/uploads/2023/10/ConnectivityPersonalization-Hilton-Digital-Key.jpg\" alt=\"힐튼 디지털 키\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onclick=\"zoom(this)\" onerror 표 알아보기! 재생\"><img src=\"https://i.ytimg.com/vi/PrLhgFQ4ufk/hqdefault.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.remove()\"><span class=\"vl-play-icon\">▶</span><small>영상 불러오기</small></button><div class=\"vl-text\"><div class=\"vl-channel\">야놀자리서치 · 2024</div><h3>ADR, OCC, RevPAR가 뭐예요?! 숙박업 성과 지표 알아보기!</h3><p>객실 점유율, 평균 객실단가, 판매 가능 객실당 매출을 다룹니다.</p><div class=\"vl-point\"><strong>시청 포인트</strong> · 시청 후 100실 가상 호텔 실습에서 세 지표를 직접 비교하세요.</div><a href=\"https://www.youtube.com/watch?v=PrLhgFQ4ufk\" target=\"_blank\" rel=\"noopener noreferrer\">유튜브에서 보기 ↗</a></div></article></div><p class=\"rev-video-link\"><button onclick=\"show(slides.findIndex(s=>s.title==='실습 ① 나는 레브뉴 매니저'))\">수익관리 실습으로 이동 →</button></p></section><details class=\"vl-extra\"><summary>기존 영상 및 추가 검색 자료</summary><p><a href=\"https://www.youtube.com/watch?v=4-_XCYuDm-4\" target=\"_blank\" rel=\"noopener\">힐튼 체크인·객실 선택 (기존 교안 링크, 재생 미확인) ↗</a></p><p><a href=\"https://www.youtube.com/results?search_query=노보텔+동대문+엔봇+호텔로봇\" target=\"_blank\" rel=\"noopener\">노보텔 엔봇 관련 영상 검색 ↗</a></p></details><p class=\"hint\">공개 영상의 제목과 설명을 바탕으로 선정했습니다. 재생 또는 임베드 가능 여부는 유튜브와 브라우저 환경에 따라 달라질 수 있습니다. 기업 소개 영상은 독립적으로 검증한 경영성과 자료가 아닙니다.</p><div class=\"vl-pager\"><button id=\"vlPrev\" onclick=\"stepVideo(-1)\">← 이전 주제</button><span id=\"vlPosition\"></span><button id=\"vlNext\" onclick=\"stepVideo(1)\">다음 주제 →</button></div>", "script": "여러분, 이 영상 라이브러리는 네 가지 주제로 구성됩니다. 첫째, 통합 기술이 호텔의 고객 서비스와 직원 업무를 어떻게 연결하는지 살펴봅니다. 둘째, 힐튼 디지털 키를 통해 체크인과 객실 출입의 변화를 확인합니다. 셋째, 국내 호텔의 AI 로봇과 일본 헨나 호텔 사례를 비교하면서 인간과 기술의 협업을 생각합니다. 마지막으로 두왓의 통합 플랫폼과 야놀자리서치의 객실 성과지표 영상을 보며 호텔 운영과 수익관리로 연결합니다. 모든 영상을 한 번에 시청할 필요는 없습니다. 각 영상에서 어떤 고객 문제를 해결하는지, 어떤 데이터가 생성되는지, 경영성과를 무엇으로 평가할지 메모해 보세요.", "scriptHtml": "여러분, 이 영상 라이브러리는 <strong>네 가지 주제</strong>로 구성됩니다. 첫째, 통합 기술이 호텔의 <strong>고객 서비스와 직원 업무</strong>를 어떻게 연결하는지 살펴봅니다. 둘째, <strong>힐튼 디지털 키</strong>를 통해 체크인과 객실 출입의 변화를 확인합니다. 셋째, 국내 호텔의 AI 로봇과 일본 헨나 호텔 사례를 비교하면서 <strong>인간과 기술의 협업</strong>을 생각합니다. 마지막으로 두왓의 통합 플랫폼과 야놀자리서치의 객실 성과지표 영상을 보며 <strong>호텔 운영과 수익관리</strong>로 연결합니다. 모든 영상을 한 번에 시청할 필요는 없습니다. 각 영상에서 <strong>어떤 고객 문제를 해결하는지</strong>, <strong>어떤 데이터가 생성되는지</strong>, <strong>경영성과를 무엇으로 평가할지</strong> 메모해 보세요.", "q": "영상 속 스마트 기술이 해결하는 고객 문제와 경영성과 지표를 각각 하나씩 제시해 보세요."}, {"ch": "05 경영 시스템", "title": "호텔 경영 시스템 8가지", "sub": "실무 필수 용어 · 영어 원어 · 한글 명칭 · 정의와 기능", "body": "<div class=\"tablewrap hotel-system-defs\"><table><thead><tr><th scope=\"col\">약어 · 한글 명칭</th><th scope=\"col\">영어 원어</th><th scope=\"col\">정의 및 핵심 기능</th></tr></thead><tbody><tr style=\"--sc:#245a91\"><td><span class=\"sys-code\">PMS</span><strong class=\"sys-kr\">호텔 운영관리 시스템</strong></td><td class=\"sys-en\">Property Management System</td><td><div class=\"sys-definition\">호텔의 <strong>객실 예약, 객실 상태, 체크인·체크아웃 및 정산</strong>을 통합적으로 관리하는 시스템.</div><div class=\"sys-function\">핵심 기능 · 예약·객실·프런트·정산</div></td></tr><tr style=\"--sc:#176b91\"><td><span class=\"sys-code\">CRS</span><strong class=\"sys-kr\">중앙 예약 시스템</strong></td><td class=\"sys-en\">Central Reservation System</td><td><div class=\"sys-definition\">여러 예약 경로에서 들어오는 <strong>예약 정보, 객실 재고와 요금</strong>을 중앙에서 관리하는 시스템.</div><div class=\"sys-function\">핵심 기능 · 중앙 예약</div></td></tr><tr style=\"--sc:#a65b16\"><td><span class=\"sys-code\">RMS</span><strong class=\"sys-kr\">수익관리 시스템</strong></td><td class=\"sys-en\">Revenue Management System</td><td><div class=\"sys-definition\">예약 및 시장 데이터를 활용해 <strong>객실 수요를 예측</strong>하고 적절한 <strong>가격과 판매전략</strong>을 결정하도록 지원하는 시스템.</div><div class=\"sys-function\">핵심 기능 · 수요·가격·수익</div></td></tr><tr style=\"--sc:#7954a1\"><td><span class=\"sys-code\">CRM</span><strong class=\"sys-kr\">고객관계관리 시스템</strong></td><td class=\"sys-en\">Customer Relationship Management</td><td><div class=\"sys-definition\">고객의 이용 이력, 선호도 등을 관리하여 <strong>맞춤 서비스, 마케팅 및 재방문</strong>을 지원하는 시스템.</div><div class=\"sys-function\">핵심 기능 · 고객관계·재방문</div></td></tr><tr style=\"--sc:#087b73\"><td><span class=\"sys-code\">POS</span><strong class=\"sys-kr\">판매시점관리 시스템</strong></td><td class=\"sys-en\">Point of Sale</td><td><div class=\"sys-definition\">레스토랑·바 등 판매 현장에서 <strong>주문, 결제 및 판매 내역</strong>을 기록·관리하는 시스템.</div><div class=\"sys-function\">핵심 기능 · 식음료 주문·결제</div></td></tr><tr style=\"--sc:#176499\"><td><span class=\"sys-code\">CM</span><strong class=\"sys-kr\">판매채널 관리 시스템</strong></td><td class=\"sys-en\">Channel Manager</td><td><div class=\"sys-definition\">여러 OTA 등 온라인 판매채널의 <strong>객실 재고와 요금, 판매 가능 여부</strong>를 연동·관리하는 시스템.</div><div class=\"sys-function\">핵심 기능 · OTA 판매채널</div></td></tr><tr style=\"--sc:#3d7a48\"><td><span class=\"sys-code\">EMS</span><strong class=\"sys-kr\">에너지 관리 시스템</strong></td><td class=\"sys-en\">Energy Management System</td><td><div class=\"sys-definition\">객실 및 호텔 시설의 <strong>에너지 사용량을 모니터링</strong>하고 조명·냉난방 등의 효율적 관리를 지원하는 시스템.</div><div class=\"sys-function\">핵심 기능 · 에너지 사용</div></td></tr><tr style=\"--sc:#a24b74\"><td><span class=\"sys-code\">HRMS</span><strong class=\"sys-kr\">인적자원관리 시스템</strong></td><td class=\"sys-en\">Human Resource Management System</td><td><div class=\"sys-definition\">호텔 직원의 <strong>인사정보, 근무 일정, 근태 및 급여</strong>를 관리하는 시스템.</div><div class=\"sys-function\">핵심 기능 · 인력·근무·급여</div></td></tr></tbody></table></div><div class=\"key\">PMS는 호텔 운영의 중심 시스템 중 하나. 호텔별 실제 연동 범위는 다르다.</div><div class=\"sys-rms-link\"><div><strong>RMS와 수익관리 실습의 연결</strong><p>RMS는 객실 수요와 요금을 관리하며, <strong>OCC·ADR·RevPAR·객실매출</strong>은 그 성과를 파악하는 핵심 지표입니다.</p></div><button class=\"primary\" onclick=\"show(27)\">수익관리 종합 실습 →</button></div>", "script": "호텔 취업을 준비한다면 이 약어들은 꼭 익혀두면 좋습니다. PMS는 호텔 운영을 관리하고, CRS는 예약을, RMS는 수익을, CRM은 고객관계를 담당합니다. POS는 식음료 주문과 결제, 채널 매니저는 온라인 판매채널, EMS는 에너지, HRMS는 인력을 관리합니다. 업무가 분리돼 있어도 데이터가 연결되면 의사결정의 질을 높일 수 있습니다. 특히 CRS는 중앙 예약 정보를 관리하고, 채널 매니저는 여러 온라인 판매채널의 객실 재고와 요금을 연동합니다. RMS는 수요예측과 가격 결정을 지원하며, 객실 점유율, 평균 판매가격, 판매 가능 객실당 매출을 함께 살펴보는 수익관리 실습으로 연결됩니다.", "q": "프런트 직원, 레브뉴 매니저, 식음료 직원은 각각 어떤 시스템을 주로 사용할까요?", "scriptHtml": "호텔 취업을 준비한다면 이 약어들은 꼭 익혀두면 좋습니다. <strong>PMS</strong>는 호텔 운영을 관리하고, <strong>CRS</strong>는 예약을, <strong>RMS</strong>는 수익을, <strong>CRM</strong>은 고객관계를 담당합니다. <strong>POS</strong>는 식음료 주문과 결제, <strong>채널 매니저</strong>는 온라인 판매채널, <strong>EMS</strong>는 에너지, <strong>HRMS</strong>는 인력을 관리합니다. 업무가 분리돼 있어도 <strong>데이터가 연결</strong>되면 <strong>의사결정의 질</strong>을 높일 수 있습니다. 특히 <strong>CRS는 중앙 예약 정보</strong>를 관리하고, <strong>채널 매니저는 여러 온라인 판매채널의 객실 재고와 요금</strong>을 연동합니다. <strong>RMS는 수요예측과 가격 결정</strong>을 지원하며, <strong>객실 점유율, 평균 판매가격, 판매 가능 객실당 매출</strong>을 함께 살펴보는 수익관리 실습으로 연결됩니다."}, {"ch": "05 경영 시스템", "title": "PMS가 하는 일", "sub": "Oracle OPERA Cloud · 실제 화면 참고", "body": "<div class=\"photos\"><figure><div class=\"pic\"><div class=\"fallback\">▧<br>Oracle OPERA Cloud 화면<br><small>외부 사진 · 연결 필요</small></div><img src=\"https://www.oracle.com/a/ocom/img/rc33-industry-hospitality.png\" alt=\"Oracle OPERA Cloud 화면\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onclick=\"zoom(this)\" onerror=\"this.style.display='none'\"></div><figcaption>Oracle OPERA Cloud 화면 · <a href=\"https://www.oracle.com/uk/industries/product-tours/\" target=\"_blank\" rel=\"noopener\">출처</a> <span>⤢ 확대</span></figcaption></figure><figure><div class=\"pic\"><div class=\"fallback\">▧<br>OPERA Cloud 객실 현황 화면<br><small>외부 사진 · 연결 필요</small></div><img src=\"https://www.mb-gmbh.de/assets/generated/pictures/118377/cFGRr/2.png\" alt=\"OPERA Cloud 객실 현황 화면\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onclick=\"zoom(this)\" onerror=\"this.style.display='none'\"></div><figcaption>OPERA Cloud 객실 현황 화면 · <a href=\"https://www.mb-gmbh.de/de/produkte/oracle-hospitality-opera-cloud-pms\" target=\"_blank\" rel=\"noopener\">출처</a> <span>⤢ 확대</span></figcaption></figure></div><div class=\"flow\"><div>예약 확인</div><i>→</i><div>객실 상태 확인</div><i>→</i><div>입실·투숙</div><i>→</i><div>정산·퇴실</div></div><div class=\"key\">객실 예약, 요금, 청소 상태, 청구 및 고객 정보 관리</div><a class=\"source\" href=\"https://www.oracle.com/hospitality/hotel-property-management/\" target=\"_blank\" rel=\"noopener\">Oracle 공식 PMS 소개 ↗</a>", "script": "PMS 화면을 보면 오늘 도착할 고객과 퇴실할 고객, 객실 상태, 예약 등의 정보가 나타납니다. 프런트에서 입실 요청을 받으면 객실 상태를 확인하고 객실을 배정합니다. 식음료 이용액이 연결되면 최종 정산에 반영할 수도 있습니다. 화면의 구성은 제품과 호텔 설정에 따라 달라집니다.", "q": "예약은 되어 있지만 객실 청소가 끝나지 않았다면 PMS에서 어떤 정보를 확인해야 할까요?", "scriptHtml": "<strong>PMS</strong> 화면을 보면 오늘 도착할 고객과 퇴실할 고객, <strong>객실 상태, 예약</strong> 등의 정보가 나타납니다. 프런트에서 입실 요청을 받으면 <strong>객실 상태를 확인하고 객실을 배정</strong>합니다. <strong>식음료 이용액</strong>이 연결되면 <strong>최종 정산</strong>에 반영할 수도 있습니다. 화면의 구성은 제품과 호텔 설정에 따라 달라집니다."}, {"ch": "05 경영 시스템", "title": "호텔 시스템 연결 구조", "sub": "상호연결성과 상호운용성", "body": "<div class=\"arch\"><div>고객 · 홈페이지 · OTA</div><span>⇅</span><div class=\"archrow\"><b>CRS 예약</b><b>CM 채널</b><b>CRM 고객</b></div><span>⇅</span><div class=\"core\">PMS<br><small>호텔 운영 통합관리</small></div><span>⇅</span><div class=\"archrow\"><b>RMS 수익</b><b>POS 식음료</b><b>EMS 에너지</b><b>HRMS 인력</b></div><span>↓</span><div>고객 경험 · 운영 효율 · 수익 향상</div></div><div class=\"key\">개념도: 실제 연결은 API, 인터페이스, 데이터 권한 및 호텔 환경에 따라 다름.</div><a class=\"source\" href=\"https://doi.org/10.1016/j.ijhm.2017.11.011\" target=\"_blank\" rel=\"noopener\">Buhalis & Leung (2018) ↗</a>", "script": "이 구조도에서 PMS는 운영의 중심에 있습니다. 예약이나 판매채널 정보가 연결되고, 수익관리나 식음료 관리 시스템과 데이터를 교환할 수 있습니다. 상호연결성은 시스템이 연결되는 것을 뜻하고, 상호운용성은 서로 데이터를 이해하며 사용할 수 있다는 뜻입니다. 모든 시스템이 반드시 PMS를 통해서만 연결되는 것은 아니며 호텔별로 구조는 다릅니다.", "q": "객실 재고가 OTA와 PMS에서 일치하지 않으면 어떤 문제가 발생할까요?", "scriptHtml": "이 구조도에서 <strong>PMS</strong>는 <strong>운영의 중심</strong>에 있습니다. 예약이나 판매채널 정보가 연결되고, <strong>수익관리나 식음료 관리 시스템</strong>과 <strong>데이터를 교환</strong>할 수 있습니다. <strong>상호연결성</strong>은 시스템이 연결되는 것을 뜻하고, <strong>상호운용성</strong>은 <strong>서로 데이터를 이해하며 사용할 수 있다</strong>는 뜻입니다. 모든 시스템이 반드시 <strong>PMS</strong>를 통해서만 연결되는 것은 아니며 호텔별로 구조는 다릅니다."}, {"ch": "06 분석", "title": "호텔경영과 빅데이터 분석", "sub": "경영 문제 → 분석기법 → 의사결정", "body": "<div class=\"tablewrap\"><table><thead><tr><th>경영 문제</th><th>분석방법</th><th>활용</th></tr></thead><tbody><tr><td>다음 달 객실 수요</td><td>회귀·시계열</td><td>판매계획</td></tr><tr><td>예약 취소</td><td>로지스틱 회귀·XGBoost</td><td>취소 위험 예측</td></tr><tr><td>고객 유형</td><td>K-means</td><td>맞춤 마케팅</td></tr><tr><td>고객 불편</td><td>텍스트마이닝·감성분석</td><td>품질 개선</td></tr><tr><td>리뷰 주제</td><td>LDA</td><td>고객 경험 탐색</td></tr><tr><td>직원 배치</td><td>수요예측·최적화</td><td>인력 배치</td></tr><tr><td>객실 가격</td><td>수요예측·가격 최적화</td><td>레브뉴 관리</td></tr></tbody></table></div><div class=\"flow\"><div>데이터</div><i>→</i><div>모형 학습·평가</div><i>→</i><div>예측·분석</div><i>→</i><div>관리자 결정</div></div>", "script": "앞서 배운 통계와 머신러닝을 호텔경영에 연결해 봅시다. 다음 달 수요를 예측하는 문제와 예약 취소 여부를 예측하는 문제는 다른 분석방법이 필요합니다. 고객을 유형별로 구분하는 군집분석은 정답 라벨이 없는 경우에도 사용할 수 있습니다. 리뷰 분석은 고객 불만과 주요 경험 주제를 찾는 데 도움이 됩니다. 분석 결과를 실제로 적용하기 전에 검증이 필요합니다.", "q": "예약 취소 예측과 고객 군집분석은 지도학습·비지도학습 중 어디에 해당할까요?", "scriptHtml": "앞서 배운 <strong>통계와 머신러닝</strong>을 호텔경영에 연결해 봅시다. <strong>다음 달 수요를 예측</strong>하는 문제와 <strong>예약 취소 여부를 예측</strong>하는 문제는 다른 분석방법이 필요합니다. 고객을 유형별로 구분하는 <strong>군집분석</strong>은 <strong>정답 라벨이 없는 경우</strong>에도 사용할 수 있습니다. <strong>리뷰 분석</strong>은 고객 불만과 주요 경험 주제를 찾는 데 도움이 됩니다. 분석 결과를 실제로 적용하기 전에 <strong>검증</strong>이 필요합니다."}, {"ch": "06 분석", "title": "레브뉴 매니지먼트 핵심 지표", "sub": "Revenue Management · 객실 수익 관리", "body": "<div class=\"revenue-primer\"><b>호텔 매출(Hotel Revenue)과 객실매출(Room Revenue)</b><p><strong>호텔 매출</strong>은 객실, 식음료, 연회 및 기타 서비스 판매로 얻는 총매출입니다. <strong>객실매출</strong>은 그중 객실 판매로 발생한 매출이며, 비용을 차감한 이익과는 다릅니다.</p></div><div class=\"tiles revenue-definitions\"><article><b>OCC · Occupancy Rate</b><p><strong>객실 점유율 · 판매 가능 객실 중 판매된 비율</strong><br>판매 객실 수 ÷ 판매가능 객실 수 × 100</p></article><article><b>ADR · Average Daily Rate</b><p><strong>실제로 판매된 객실 1실당 평균 판매가격</strong><br>객실 매출 ÷ 판매 객실 수</p></article><article><b>RevPAR · Revenue per Available Room</b><p><strong>미판매 객실을 포함한 판매 가능 객실 1실당 매출</strong><br>객실 매출 ÷ 판매가능 객실 수</p></article><article><b>객실매출 · Room Revenue</b><p><strong>객실 판매로 발생한 매출액</strong><br>평균 객실 판매가격 × 판매 객실 수</p></article></div><div class=\"tablewrap\"><table><thead><tr><th>전략</th><th>ADR</th><th>판매(100실)</th><th>매출</th><th>RevPAR</th></tr></thead><tbody><tr><td>저가</td><td>10만원</td><td>95실</td><td>950만원</td><td>9.5만원</td></tr><tr><td>중간</td><td>15만원</td><td>80실</td><td>1,200만원</td><td>12만원</td></tr><tr><td>고가</td><td>20만원</td><td>65실</td><td>1,300만원</td><td>13만원</td></tr></tbody></table></div><div class=\"key\">예시에서는 고가 전략의 객실 매출이 가장 크다. 수익성은 비용도 고려해야 한다.</div><div class=\"revrelation\"><strong>RevPAR = ADR × OCC(소수)</strong> · 판매된 객실만의 평균인 ADR과 달리, RevPAR는 판매 가능 객실 전체를 기준으로 합니다.</div><div class=\"rev-actions\"><button class=\"primary\" onclick=\"show(26)\">▶ 실시간 수익관리 실습</button><button onclick=\"openHotelVideos('D')\">▶ 성과지표 영상</button></div>", "script": "호텔에서는 점유율만 높다고 매출이 높은 것은 아닙니다. 객실 점유율, 평균 객실 판매가격, 판매가능 객실당 매출을 함께 봐야 합니다. 예를 들어 100실 중 95실을 10만원에 판매하면 950만원입니다. 65실을 20만원에 판매하면 1300만원입니다. 다만 매출과 이익은 다르고, 가격에 따라 실제 판매량이 어떻게 변하는지는 별도로 예측해야 합니다. 호텔 전체 매출은 객실, 식음료, 연회 등에서 발생하는 매출의 합입니다. 오늘 계산하는 객실매출은 호텔 전체 매출의 일부입니다. 이익은 비용을 차감한 결과이므로 매출과 구별해야 합니다.", "q": "점유율이 낮아도 RevPAR가 높아질 수 있는 이유는 무엇인가요?", "scriptHtml": "호텔에서는 <strong>점유율만 높다고 매출이 높은 것은 아닙니다</strong>. <strong>객실 점유율, 평균 객실 판매가격, 판매가능 객실당 매출</strong>을 함께 봐야 합니다. 예를 들어 100실 중 95실을 10만원에 판매하면 <strong>950만원</strong>입니다. 65실을 20만원에 판매하면 <strong>1300만원</strong>입니다. 다만 <strong>매출과 이익은 다르고</strong>, 가격에 따라 <strong>실제 판매량</strong>이 어떻게 변하는지는 별도로 예측해야 합니다. <strong>호텔 전체 매출</strong>은 객실, 식음료, 연회 등에서 발생하는 매출의 합입니다. 오늘 계산하는 <strong>객실매출</strong>은 호텔 전체 매출의 일부입니다. <strong>이익은 비용을 차감한 결과</strong>이므로 매출과 구별해야 합니다."}, {"ch": "06 분석", "title": "실습 ① 나는 레브뉴 매니저", "sub": "100실 가상 호텔 · 실시간 시뮬레이션", "body": "<div class=\"rev-actions\"><button onclick=\"show(25)\">← 수익지표 정의·공식</button><button onclick=\"openHotelVideos('D')\">▶ 성과지표 영상</button></div><div id=\"revenue\"></div><div class=\"revenue-primer\"><b>호텔 매출(Hotel Revenue)과 객실매출(Room Revenue)</b><p><strong>호텔 매출</strong>은 객실, 식음료, 연회 및 기타 서비스 판매로 얻는 총매출입니다. <strong>객실매출</strong>은 그중 객실 판매로 발생한 매출이며, 비용을 차감한 이익과는 다릅니다.</p></div><div class=\"key\">가상 교육용 조건: 가격과 판매량은 독립적으로 조절하며 실제 수요함수를 추정한 모형은 아님.</div><p class=\"hint\">1일 기준 가상 사례입니다. 객실매출은 식음료 등 부대매출 및 영업이익과 다릅니다. <a href=\"https://www.youtube.com/watch?v=PrLhgFQ4ufk\" target=\"_blank\" rel=\"noopener\">▶ 야놀자리서치 성과지표 영상</a> · <button onclick=\"openHotelVideos('D')\">D. 호텔 경영·수익관리 영상 열기</button></p>", "script": "이제 가격과 판매 객실 수를 직접 움직여 보겠습니다. 기본값은 15만원에 80실입니다. 저가 판매 전략과 고가 판매 전략 버튼을 눌러 점유율, 객실 매출, ADR, RevPAR가 어떻게 달라지는지 확인하세요. 실제 호텔에서는 가격을 바꾸면 수요도 변할 수 있으므로 과거 예약과 경쟁 가격 등을 이용하여 수요를 예측해야 합니다. 객실 점유율, OCC는 전체 판매 가능 객실 가운데 판매된 비율입니다. ADR은 판매된 객실 한 실의 평균 판매가격이고, RevPAR는 팔리지 않은 객실까지 포함한 전체 판매 가능 객실 한 실의 매출입니다. 100실 중 80실을 15만원에 팔면 점유율은 80퍼센트, 객실매출은 1,200만원, ADR은 15만원, RevPAR는 12만원입니다. RevPAR는 ADR에 점유율을 소수로 바꿔 곱해도 구할 수 있습니다. 이 지표는 이익이 아니라 객실매출을 기준으로 합니다.", "q": "객실매출이 가장 큰 전략과 객실점유율이 가장 높은 전략을 비교해 보세요.", "scriptHtml": "이제 <strong>가격과 판매 객실 수</strong>를 직접 움직여 보겠습니다. 기본값은 <strong>15만원에 80실</strong>입니다. <strong>저가 판매 전략과 고가 판매 전략</strong> 버튼을 눌러 <strong>점유율, 객실 매출, ADR, RevPAR</strong>가 어떻게 달라지는지 확인하세요. 실제 호텔에서는 가격을 바꾸면 <strong>수요도 변할</strong> 수 있으므로 과거 예약과 경쟁 가격 등을 이용하여 <strong>수요를 예측</strong>해야 합니다. <strong>OCC는 객실 점유율</strong>입니다. <strong>ADR은 판매된 객실 한 실의 평균 판매가격</strong>이고, <strong>RevPAR는 팔리지 않은 객실까지 포함한 전체 판매 가능 객실 한 실의 매출</strong>입니다. 100실 중 80실을 15만원에 팔면 점유율은 80%, 객실매출은 1,200만원, ADR은 15만원, RevPAR는 12만원입니다. <strong>RevPAR = ADR × OCC(소수)</strong>입니다. 이 지표는 이익이 아니라 <strong>객실매출</strong>을 기준으로 합니다."}, {"ch": "06 분석", "title": "수익관리 종합 · 컬러 대시보드", "sub": "Hotel Revenue · OCC · Room Revenue · ADR · RevPAR", "body": "<section class=\"revenue-dashboard\"><div class=\"rd-banner\"><small>REVENUE MANAGEMENT · 호텔 경영 실습</small><h2>호텔 매출의 이해와 실시간 수익관리</h2><p>매출의 개념 → 객실 성과지표 → 판매전략 비교</p></div><h2 class=\"rd-heading\"><span>01</span> 호텔 매출과 객실매출의 정의</h2><div class=\"rd-defs\"><article style=\"--rc:#245a91\"><small>HOTEL REVENUE</small><h3>호텔 매출</h3><p><strong>객실, 식음료, 연회 및 기타 서비스</strong> 판매로 발생하는 총매출</p></article><article style=\"--rc:#087b73\"><small>ROOM REVENUE</small><h3>객실매출</h3><p>호텔 매출 중 <strong>객실 판매</strong>로 발생하는 매출</p></article><article style=\"--rc:#7954a1\"><small>PROFIT</small><h3>이익</h3><p><strong>매출에서 해당 비용을 차감</strong>한 금액</p></article></div><div class=\"rd-relationship\"><strong>호텔 매출</strong> = <strong>객실매출</strong> + 식음료·연회·기타 매출 <span>이익 = 매출 − 비용</span></div><div class=\"key\">객실매출은 호텔 전체 매출의 일부이며, <mark>매출과 이익은 서로 다른 개념</mark>이다.</div><h2 class=\"rd-heading\"><span>02</span> 실시간 수익관리 실습</h2><div class=\"rd-practice\"><h3>나는 레브뉴 매니저 <small>(Revenue Manager)</small></h3><div id=\"revenue\"></div></div><div class=\"rd-tip\"><strong>핵심 비교</strong> · ADR은 <strong>판매된 객실</strong>, RevPAR는 <strong>판매 가능 객실 전체</strong>를 기준으로 계산한다. 객실점유율이나 객실매출만으로 이익을 판단할 수 없다.</div><div class=\"hint\">가상 교육용 모형: 가격과 판매량은 독립적으로 조절하며 실제 수요함수를 추정한 모형은 아닙니다.</div><div class=\"rev-actions\"><button onclick=\"show(25)\">← 수익지표 개념 학습</button><button onclick=\"show(26)\">기존 실습 화면</button><button class=\"primary\" onclick=\"openHotelVideos('D')\">▶ 야놀자리서치 성과지표 영상 · D 영역</button></div></section>", "script": "먼저 호텔 매출과 객실매출, 이익을 구분합시다. 호텔 매출에는 객실뿐 아니라 식음료, 연회, 기타 서비스가 포함됩니다. 이익은 매출에서 해당 비용을 차감한 금액입니다. 이제 판매 가능 객실 100실의 가상 호텔을 살펴보겠습니다. 객실 가격이 15만원이고 80실을 판매하면 객실점유율은 80퍼센트, 객실매출은 1,200만원입니다. ADR은 판매된 객실 1실당 평균 판매가격이므로 15만원입니다. RevPAR는 미판매 객실을 포함한 판매 가능 객실 전체를 기준으로 하므로 12만원입니다. 가격과 판매 객실 수를 바꾸고 저가, 중간, 고가 전략을 비교해 보세요. 객실점유율이 높다고 해서 반드시 객실매출이 높은 것은 아니며 이익을 판단하려면 비용도 고려해야 합니다.", "scriptHtml": "먼저 <strong>호텔 매출과 객실매출, 이익</strong>을 구분합시다. 호텔 매출에는 객실뿐 아니라 식음료, 연회, 기타 서비스가 포함됩니다. 이익은 매출에서 <strong>해당 비용을 차감</strong>한 금액입니다. 이제 <strong>판매 가능 객실 100실</strong>의 가상 호텔을 살펴보겠습니다. 객실 가격이 15만원이고 80실을 판매하면 <strong>객실점유율은 80퍼센트</strong>, <strong>객실매출은 1,200만원</strong>입니다. ADR은 <strong>판매된 객실 1실당 평균 판매가격</strong>이므로 15만원입니다. RevPAR는 미판매 객실을 포함한 <strong>판매 가능 객실 전체</strong>를 기준으로 하므로 <strong>12만원</strong>입니다. 가격과 판매 객실 수를 바꾸고 <strong>저가, 중간, 고가 전략</strong>을 비교해 보세요. 객실점유율이 높다고 해서 반드시 객실매출이 높은 것은 아니며 <strong>이익을 판단하려면 비용도 고려</strong>해야 합니다.", "q": "객실점유율이 가장 높은 전략이 객실매출도 가장 높을까요? 이익을 비교하려면 어떤 정보가 더 필요할까요?"}, {"ch": "07 function drawRev(){let e=$('revenue');if(!e)return;e.innerHTML=`<p class="rev-context">판매 가능 객실 <strong>100실</strong> · 1일 기준 가상 호텔</p><div class="rev-top"><div class="rev-room"><div class="rooms">${Array.from({length:100},(_,i)=>`<span class="${i<sold?'sold':''}"></span>`).join('')}</div><div class="hint">청록: 판매 ${sold}실 · 회색: 미판매 ${100-sold}실</div></div><div class="rev-controls"><div class="range"><b>객실 가격</b><b id="pval">${won(price)}</b><input id="prange" type="range" min="50000" max="350000" step="10000" value="${price}"></div><div class="range"><b>판매 객실 수</b><b id="sval">${sold}실</b><input id="srange" type="range" min="0" max="100" value="${sold}"></div></div></div><div class="metrics" id="revmetrics"></div><div class="revrelation" id="revrelation"></div><div class="tabs"><button onclick="price=100000;sold=95;drawRev()">저가 전략<small>100,000원 · 95실</small></button><button onclick="price=150000;sold=80;drawRev()">중간 전략<small>150,000원 · 80실</small></button><button onclick="price=200000;sold=65;drawRev()">고가 전략<small>200,000원 · 65실</small></button><button onclick="price=150000;sold=80;drawRev()">실습 초기화</button></div>`;let update=()=>{price=+$('prange').value;sold=+$('srange').value;$('pval').textContent=won(price);$('sval').textContent=sold+'실';e.querySelectorAll('.rooms span').forEach((n,i)=>n.className=i<sold?'sold':'');e.querySelector('.rooms + .hint').textContent=`청록: 판매 ${sold}실 · 회색: 미판매 ${100-sold}실`;$('revmetrics').innerHTML=[['OCC · Occupancy Rate','전체 판매 가능 객실 중 실제로 판매된 객실의 비율',sold+'%','판매 객실 수 ÷ 판매 가능 객실 수 × 100',`${sold} ÷ 100 × 100 = ${sold}%`,'#245a91'],['객실매출 · Room Revenue','객실 판매로 발생한 총매출액',won(price*sold),'판매 객실 수 × 평균 판매가격',`${sold}실 × ${won(price)} = ${won(price*sold)}`,'#087b73'],['ADR · Average Daily Rate','실제로 판매된 객실 1실당 평균 판매가격',sold?won(price):'산출 불가','객실매출 ÷ 판매 객실 수',sold?`${won(price*sold)} ÷ ${sold}실 = ${won(price)}`:'판매 객실이 0실이므로 산출 불가','#7954a1'],['RevPAR · Revenue per Available Room','미판매 객실을 포함한 판매 가능 객실 1실당 매출',won(price*sold/100),'객실매출 ÷ 판매 가능 객실 수',`${won(price*sold)} ÷ 100실 = ${won(price*sold/100)}`,'#a65b16']].map(x=>`<div class="metric metric-detail" style="--mc:${x[5]}"><div class="metric-name">${x[0].split(" · ")[0]}</div><small>${x[0].split(" · ")[1]}</small><div class="metric-kr">${({"OCC":"객실 점유율","객실매출":"객실 판매 총매출","ADR":"평균 객실 판매가격","RevPAR":"판매 가능 객실당 매출"})[x[0].split(" · ")[0]]}</div><div class="metric-definition"><span>정의</span> ${x[1]}</div><b>${x[2]}</b><div class="metric-formula"><span>공식</span> ${x[3]}</div><div class="metric-calc"><span>계산</span> ${x[4]}</div></div>`).join('');$('revrelation').innerHTML=sold?`<strong>RevPAR = ADR × OCC(소수)</strong> · ${won(price)} × ${(sold/100).toFixed(2)} = <strong>${won(price*sold/100)}</strong>`:'<strong>RevPAR = 0원</strong> · 판매 객실이 없어서 ADR은 산출할 수 없습니다.'};$('prange').oninput=update;$('srange').oninput=update;update()}
const opts=[['모바일 체크인',1000],['객실 배송 로봇',2500],['IoT 객실 제어',3000],['AI 관광 안내 챗봇',1000],['PMS·채널관리 연동',1500],['AI 객실 수요예측',1500],['스마트 에너지 관리',2000],['다국어 관광 안내 키오스크',1500]];function drawBudget(){let e=$('budget');if(!e)return;let total=[...budgetSelected].reduce((s,i)=>s+opts[i][1],0);e.innerHTML=`<div class="metrics" style="grid-template-columns:1fr 1fr"><div class="metric"><small>사용 예산</small><b class="${total>10000?'danger':''}">${total.toLocaleString()}만원</b></div><div class="metric"><small>잔여 예산</small><b class="${total>10000?'danger':''}">${(10000-total).toLocaleString()}만원</b></div></div><div class="bar"><div style="width:${Math.min(total/100,100)}%;background:${total>10000?'#b42318':'#008b86'}"></div></div>${opts.map((x,i)=>`<div class="budgetrow"><label><input type="checkbox" ${budgetSelected.has(i)?'checked':''} onchange="this.checked?budgetSelected.add(${i}):budgetSelected.delete(${i});drawBudget()"> ${x[0]}</label><b>${x[1].toLocaleString()}만원</b></div>`).join('')}<div class="hint ${total>10000?'danger':''}">${total>10000?'예산 초과 · 우선순위를 다시 선택하세요.':budgetSelected.size+'개 기술 선택'}</div><button onclick="budgetSelected.clear();drawBudget()">다시 설계</button>`}
const quizzes=[['스마트 호텔은 반드시 무인 호텔이어야 한다.',['맞다','아니다'],1,'직원과 기술의 협업도 스마트 호텔이다.'],['객실 가격과 수요를 관리하는 시스템은?',['PMS','RMS','POS'],1,'RMS는 Revenue Management System이다.'],['100실 호텔이 15만원에 80실을 판매했다. RevPAR는?',['15만원','12만원','8만원'],1,'1,200만원 ÷ 100실 = 12만원.'],['로봇 도입 시 가장 적절한 평가 기준은?',['로봇 대수','고객 문제 해결·운영 효과','무조건 인력 감축'],1,'기술의 수보다 고객가치와 운영효과가 중요하다.']];function drawQuiz(){let e=$('quiz');if(!e)return;e.innerHTML='<div class="quiz-grid">'+quizzes.map((x,i)=>`<div class="quizbox"><b>${i+1}. ${x[0]}</b><div>${x[1].map((o,k)=>`<button onclick="answers[${i}]=${k};drawQuiz()" ${answers[i]===k?'class="primary"':''}>${o}</button>`).join('')}</div>${i in answers?`<div class="feedback ${answers[i]===x[2]?'':'danger'}">${answers[i]===x[2]?'정답!':'다시 생각해 보세요.'} ${x[3]}</div>`:''}</div>`).join('')+'</div><p class="hint">정답 '+quizzes.filter((x,i)=>answers[i]===x[2]).length+' / '+quizzes.length+'</p><button onclick="answers={};drawQuiz()">퀴즈 초기화</button>'}
let videoCat='A';const videoCats=['A','B','C','D'];function filterHotelVideos(cat){videoCat=cat;document.querySelectorAll('.vl-group').forEach(g=>{let hide=cat!=='all'&&g.dataset.vgroup!==cat;g.hidden=hide;if(hide)g.querySelectorAll('iframe').forEach(f=>{let b=document.createElement('button');b.className='vl-player';let id=f.dataset.vid;b.setAttribute('aria-label',f.title);b.innerHTML=`<img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()"><span class="vl-play-icon">▶</span><small>영상 불러오기</small>`;b.onclick=()=>loadHotelVideo(b,id);f.replaceWith(b)})});document.querySelectorAll('[data-vcat]').forEach(b=>{let active=b.dataset.vcat===cat;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});let n=videoCats.indexOf(cat);if($('vlPosition')){$('vlPosition').textContent=n<0?'전체 7개':`${n+1} / 4 · ${cat}`;$('vlPrev').disabled=n<=0;$('vlNext').disabled=n===3}}function stepVideo(d){filterHotelVideos(videoCats[Math.max(0,Math.min(3,videoCats.indexOf(videoCat)+d))])}
function loadHotelVideo(b,id){stopSpeech();let f=document.createElement('iframe');f.className='vl-frame';f.dataset.vid=id;f.title=b.getAttribute('aria-label')||'스마트 호텔 영상';f.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1';f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';b.replaceWith(f)}
let speechSeq=0,activeParagraph=-1,speechMode='script';function clearReading(){document.querySelectorAll('.script-block.reading').forEach(x=>x.classList.remove('reading'))}function stopSpeech(){speechSeq++;utterance=null;speaking=false;activeParagraph=-1;if(speech)speech.cancel();clearReading();$('audioStatus').textContent='브라우저 한국어 TTS · 기본 1.5배속 (녹음 파일 아님)';$('pause').textContent='Ⅱ 일시정지'}function loadVoices(){if(!speech)return;voiceList=speech.getVoices();let old=$('voice').value;$('voice').innerHTML='<option value="">기본 한국어 음성</option>';voiceList.filter(v=>v.lang.toLowerCase().startsWith('ko')).forEach(v=>{let o=document.createElement('option');o.value=v.name;o.textContent=v.name;$('voice').append(o)});$('voice').value=old}if(speech){loadVoices();speech.onvoiceschanged=loadVoices}function speakParts(parts,from=0,mode='script'){if(!speech){$('audioStatus').textContent='이 브라우저는 음성 합성을 지원하지 않습니다.';return}stopSpeech();speechMode=mode;const token=speechSeq;lastText=parts.join(' ');function run(n){if(token!==speechSeq)return;if(n>=parts.length){speaking=false;activeParagraph=-1;clearReading();$('audioStatus').textContent='재생 완료';return}activeParagraph=n;let u=new SpeechSynthesisUtterance(parts[n]);u.lang='ko-KR';u.rate=+$('speed').value;let v=voiceList.find(v=>v.name===$('voice').value)||voiceList.find(v=>v.lang.toLowerCase().startsWith('ko'));if(v)u.voice=v;utterance=u;speaking=true;u.onstart=()=>{if(token!==speechSeq)return;clearReading();if(mode==='script'){let b=document.querySelectorAll('.script-block')[n];if(b){b.classList.add('reading');let panel=document.querySelector('.notes');if(b.offsetTop<panel.scrollTop||b.offsetTop+b.offsetHeight>panel.scrollTop+panel.clientHeight)b.scrollIntoView({block:'nearest',behavior:'smooth'})}}$('audioStatus').textContent='재생 중 · '+u.rate+'배속'+(mode==='script'?' · '+(n+1)+' / '+parts.length:'')};u.onend=()=>run(n+1);u.onerror=ev=>{if(token!==speechSeq)return;speaking=false;clearReading();$('audioStatus').textContent='음성 재생 불가: '+ev.error+' · 한국어 음성 설정 확인'};speech.speak(u)}run(from)}function scriptParts(){return Array.from(document.querySelectorAll('.script-block p'),x=>x.textContent)}$('play').onclick=()=>speakParts(scriptParts());$('readQuestion').onclick=()=>speakParts([slides[idx].q],0,'question');$('stop').onclick=stopSpeech;$('pause').onclick=()=>{if(!speech||!speaking)return;if(speech.paused){speech.resume();$('pause').textContent='Ⅱ 일시정지'}else{speech.pause();$('pause').textContent='▶ 이어듣기'}};function restartSpeech(){if(speaking)speakParts(speechMode==='script'?scriptParts():[slides[idx].q],Math.max(0,activeParagraph),speechMode)}$('speed').onchange=restartSpeech;$('voice').onchange=restartSpeech;
function renderScript(s){if(s.reviewParts){$('script').innerHTML=s.reviewParts.map((g,i)=>`<section class="script-block"><div class="script-label">${String(i+1).padStart(2,'0')} · ${s.reviewLabels[i]} 모범답안</div><p>${g}</p></section>`).join('');document.querySelector('.notes').scrollTop=0;return;}const parts=(s.scriptHtml||s.script).match(/[^]*?(?:[.!?。](?:<\/strong>)?(?=\s|$)|$)/g).filter(x=>x.trim());let groups=[];for(let i=0;i<parts.length;i+=2)groups.push(parts.slice(i,i+2).join('').trim());if(groups.length===0)groups=[s.scriptHtml||s.script];let names=s.title.includes('레브뉴 매니저')?['실습 안내','전략 비교','지표의 의미','계산과 해석','핵심 정리']:['도입 및 개념','주요 설명','적용 및 해석','핵심 정리'];$('script').innerHTML=groups.map((g,i)=>`<section class="script-block"><div class="script-label">${String(i+1).padStart(2,'0')} · ${names[Math.min(i,names.length-1)]}</div><p>${g}</p></section>`).join('');document.querySelector('.notes').scrollTop=0}
function openHotelVideos(cat="A"){videoCat=cat;show(slides.findIndex(s=>s.title==="영상 라이브러리"));}
function openHotelComic(){show(slides.findIndex(s=>s.title.includes("4컷 만화")))}
function show(i){if(i<0||i>=slides.length)return;stopSpeech();idx=i;let s=slides[i];$('chapter').textContent=s.ch;$('title').textContent=s.title;$('subtitle').textContent=s.sub;$('content').innerHTML=s.body;if($('comicPreviewImage')){const comic=slides.find(s=>s.title.includes('4컷 만화'));const tmp=document.createElement('div');tmp.innerHTML=comic.body;$('comicPreviewImage').src=tmp.querySelector('img').src}renderScript(s);$('question').textContent=s.q;$('progress').style.width=((i+1)/slides.length*100)+'%';$('prev2').disabled=i===0;$('next2').disabled=i===slides.length-1;$('bottomCount').textContent=`${i+1} / ${slides.length} · ${s.ch}`;updateChapterNav(i);if(s.title==="영상 라이브러리")filterHotelVideos(videoCat);drawJourney();drawRev();drawBudget();drawQuiz();if($('teamnote')){$('teamnote').value=teamMemo;$('teamnote').oninput=e=>teamMemo=e.target.value}window.scrollTo(0,0)}$('prev2').onclick=()=>show(idx-1);$('next2').onclick=()=>show(idx+1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)||$('zoomDialog').open)return;if(e.key==='ArrowLeft')show(idx-1);if(e.key==='ArrowRight')show(idx+1)});$('font').oninput=e=>document.documentElement.style.setProperty('--fs',e.target.value+'px');$('nfont').oninput=e=>document.documentElement.style.setProperty('--notes',e.target.value+'px');$('compact').onclick=()=>{let a=document.body.classList.toggle('compact');$('compact').textContent=a?'기본 간격':'공간절약';$('compact').setAttribute('aria-pressed',String(a))};$('student').onclick=()=>{let a=document.body.classList.toggle('student');$('student').textContent=a?'교수자 화면':'학생 화면';$('student').setAttribute('aria-pressed',String(a))};$('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};function zoom(img){$('zoomImg').src=img.src;$('zoomImg').alt=img.alt;$('zoomDialog').showModal()}$('zoomDialog').onclick=e=>{if(e.target===$('zoomDialog'))$('zoomDialog').close()};const chapterLabels=[['01','개념','#245a91'],['02','핵심 기술','#087b73'],['03','고객 여정','#7954a1'],['04','호텔 사례·영상','#a65319'],['05','호텔 경영','#344d9d'],['06','경영 데이터·수익관리','#087b73'],['07','미래 직무','#be185d'],['08','쟁점 및 토론','#9a581d'],['09','학생 실습','#047857'],['10','학술적 배경','#475569'],['11','정리 및 퀴즈','#4338ca'],['12','학습목표별 서술형 모범답안','#a24b74']];
const chapterGroups=chapterLabels.map(([num,label,color])=>({num,label,color,items:slides.map((slide,i)=>({slide,i})).filter(({slide})=>slide.ch.startsWith(num+' '))}));
const chapterRoot=$('chapterNav'), lessonRoot=$('lessonNav');
chapterGroups.forEach(g=>{const b=document.createElement('button');b.type='button';b.dataset.chapter=g.num;b.style.setProperty('--nc',g.color);const title=document.createElement('b');title.textContent=g.num+' · '+g.label;const count=document.createElement('small');count.textContent=g.items.length+'개';b.append(title,count);b.onclick=()=>show(g.items[0].i);chapterRoot.append(b)});
let displayedChapter='';
function updateChapterNav(i){const g=chapterGroups.find(g=>g.items.some(x=>x.i===i));if(!g)return;chapterRoot.querySelectorAll('button').forEach(b=>{const active=b.dataset.chapter===g.num;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'true':'false')});if(displayedChapter!==g.num){displayedChapter=g.num;$('lessonGroupName').textContent=g.num+' · '+g.label+' / 세부 장면';$('lessonGroupCount').textContent=g.items.length+'개 장면';lessonRoot.replaceChildren();lessonRoot.parentElement.style.setProperty('--lesson-color',g.color);g.items.forEach(({slide,i:j})=>{const b=document.createElement('button');b.type='button';b.dataset.slide=j;const n=document.createElement('span');n.className='lesson-number';n.textContent=String(j+1).padStart(2,'0');const title=document.createElement('span');title.textContent=slide.title;b.append(n,title);b.onclick=()=>show(j);lessonRoot.append(b)})}lessonRoot.querySelectorAll('button').forEach(b=>{const active=Number(b.dataset.slide)===i;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')})}
$('split').oninput=e=>{let v=+e.target.value;document.documentElement.style.setProperty('--split',v+'%');$('splitVal').textContent=v+':'+(100-v)};show(0);
