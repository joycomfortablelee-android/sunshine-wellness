function setFrame(id){
 const f=document.getElementById(id);
 if(!f.dataset.loaded){
   f.src='data:text/html;charset=utf-8;base64,'+pages[id];
   f.dataset.loaded='1';
 }
}
setFrame('exam');
document.querySelectorAll('.tab').forEach(btn=>{
 btn.addEventListener('click',()=>{
   document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
   document.querySelectorAll('iframe').forEach(x=>x.classList.remove('active'));
   btn.classList.add('active');
   const id=btn.dataset.target; setFrame(id); document.getElementById(id).classList.add('active');
 });
});
</script>
